<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MUSICATION — Mokytojo kambarys</title>
<link rel="stylesheet" href="../styles/pages.css">
<link rel="stylesheet" href="lessonEngine.css">
<style>
  [hidden] { display: none !important; }
  body { min-height: 100vh; }

  /* ── Sign in ── */
  .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
  .auth-logo { font-size: 30px; font-weight: 800; color: var(--navy); text-align: center; }
  .auth-card h1 { font-size: 24px; text-align: center; }
  .auth-card form { display: flex; flex-direction: column; gap: 12px; }
  .auth-card .btn { justify-content: center; }
  .auth-links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .link { background: none; border: none; color: var(--teal); font-weight: 800; cursor: pointer; font-size: 15px; padding: 0; font-family: inherit; }
  .auth-msg { min-height: 22px; text-align: center; font-weight: 700; }
  .auth-msg.bad { color: var(--orange); }
  .auth-msg.good { color: #1b8a3a; }
  .demo-note { background: #fff6e0; border: 2px solid #f5c443; border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
  .langs { display: flex; justify-content: center; gap: 6px; }

  /* ── Top navigation: the teacher's icons ── */
  .nav {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--navy); color: #fff; padding: 8px 16px;
  }
  .nav .brand { color: #fff; text-decoration: none; font-weight: 800; font-size: 20px; margin-right: 8px; display: flex; align-items: center; gap: 8px; }
  .nav .brand small { font-size: 13px; opacity: 0.75; font-weight: 700; }
  .nav nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .nav nav a, .nav nav button {
    color: #fff; text-decoration: none; border: none; background: transparent; cursor: pointer; font-family: inherit;
    border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
  }
  .nav nav a:hover, .nav nav button:hover { background: rgba(255,255,255,0.14); }
  .nav nav a.sel { background: #fff; color: var(--navy); }
  .nav nav a.plus { background: var(--teal); }
  .nav .ico { font-size: 19px; }
  .nav .who { font-weight: 700; font-size: 14px; opacity: 0.85; }
  .mode-badge { font-size: 12px; font-weight: 800; background: #f5c443; color: #3a2800; border-radius: 999px; padding: 2px 10px; }
  @media (max-width: 1500px) { .nav .brand small { display: none; } .nav nav a, .nav nav button { padding: 6px 9px; font-size: 14px; } }
  @media (max-width: 1250px) { .nav .who { display: none; } }
  @media (max-width: 640px) {
    .nav .brand { flex: 1; }
    .nav nav { order: 3; flex: 1 1 100%; justify-content: space-between; flex-wrap: nowrap; }
  }
  @media (max-width: 900px) { .nav nav .lbl { display: none; } .nav nav a, .nav nav button { padding: 7px 10px; } .nav .ico { font-size: 22px; } }

  h2.view-h { font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  h2.view-h .grow { flex: 1; }
  .sub-h { font-size: 20px; font-weight: 800; margin: 18px 0 10px; }

  /* ── Home ── */
  .home-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .home-tiles a { aspect-ratio: auto; min-height: 150px; text-decoration: none; color: inherit; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
  .stat { background: #fff; border-radius: 18px; padding: 10px 18px; font-weight: 800; box-shadow: 0 4px 14px rgba(35,38,74,0.07); }
  .stat b { font-size: 26px; margin-right: 6px; color: var(--teal); }

  /* ── Filters and lesson cards ── */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filters label { display: flex; align-items: center; gap: 6px; font-weight: 800; background: #fff; border-radius: 999px; padding: 4px 6px 4px 12px; box-shadow: 0 2px 0 rgba(0,0,0,0.06); }
  .filters select, .filters input { border: none; outline: none; font-size: 15px; font-weight: 700; background: transparent; padding: 4px; }
  .filters input { min-width: 180px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .lcard {
    background: #fff; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    border-left: 10px solid var(--c, var(--teal)); box-shadow: 0 5px 0 rgba(0,0,0,0.05), 0 10px 22px rgba(35,38,74,0.08);
  }
  .lcard .head { display: flex; gap: 12px; align-items: center; }
  .lcard .pic { width: 52px; height: 52px; border-radius: 16px; flex: none; font-size: 30px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c, var(--teal)) 15%, #fff); }
  .lcard h3 { font-size: 19px; line-height: 1.2; }
  .lcard .meta { font-size: 13px; font-weight: 700; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .lcard .goal { font-size: 14px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; }
  .lcard .blocks { font-size: 20px; letter-spacing: 2px; }
  .lcard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .lcard .acts .btn { padding: 6px 12px; font-size: 14px; }
  .lock { font-size: 12px; font-weight: 800; color: var(--violet); background: #f1ebfa; border-radius: 999px; padding: 2px 8px; }
  .vtag { font-size: 12px; font-weight: 800; color: #fff; background: var(--navy); border-radius: 999px; padding: 1px 8px; }
  .arch { opacity: 0.6; }

  /* ── Lesson editor ── */
  .ed-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .ed-top .title-in { flex: 1; min-width: 220px; font-size: 22px; font-weight: 800; }
  .dirty { font-size: 13px; font-weight: 800; color: var(--orange); }
  .ed-grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .ed-grid { grid-template-columns: 1fr; } }
  .settings-box { display: flex; flex-direction: column; gap: 10px; }
  .settings-box h3 { font-size: 18px; }
  .blist { display: flex; flex-direction: column; gap: 8px; }
  .brow { background: #fff; border-radius: 16px; box-shadow: 0 3px 10px rgba(35,38,74,0.07); border: 2px solid transparent; }
  .brow.open { border-color: var(--teal); }
  .brow.drag-over { border-color: var(--yellow); border-style: dashed; }
  .brow .bhead { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .brow .handle { cursor: grab; font-size: 20px; color: var(--ink-soft); padding: 0 4px; user-select: none; }
  .brow .no { width: 28px; height: 28px; border-radius: 50%; background: var(--teal); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; font-size: 14px; }
  .brow .bico { font-size: 24px; flex: none; }
  .brow .btxt { flex: 1; min-width: 0; }
  .brow .btxt b { display: block; font-size: 16px; }
  .brow .btxt span { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow .thumb { width: 150px; flex: none; display: flex; justify-content: center; }
  .brow .thumb svg { width: 100%; height: auto; max-height: 52px; }
  .brow .thumb img { max-height: 52px; max-width: 100%; border-radius: 8px; }
  .brow .bacts { display: flex; gap: 4px; flex: none; }
  .brow .bacts button { border: none; background: #f3f1fb; border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; }
  .brow .bacts button:hover { background: #e6e1f7; }
  .brow .bbody { padding: 4px 14px 14px; border-top: 1px solid var(--line); }
  @media (max-width: 700px) { .brow .thumb { display: none; } }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .palette button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px; cursor: pointer; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; font-family: inherit; }
  .palette button span { font-size: 24px; }
  .palette button:hover { border-color: var(--teal); }

  /* ── Tables ── */
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 14px rgba(35,38,74,0.07); }
  .tbl th, .tbl td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: middle; }
  .tbl th { background: #f3f1fb; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl td.c, .tbl th.c { text-align: center; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: #faf9ff; }
  .tbl-wrap { overflow-x: auto; }
  .code { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 18px; letter-spacing: 2px; background: #f3f1fb; border-radius: 8px; padding: 2px 8px; }
  .score { font-weight: 800; border-radius: 999px; padding: 2px 10px; display: inline-block; min-width: 52px; text-align: center; }
  .score.hi { background: #e3f7e6; color: #1b7a33; }
  .score.mid { background: #fff3d6; color: #8a5a00; }
  .score.lo { background: #ffe5dc; color: #b23a12; }
  .score.none { color: var(--ink-soft); }
  .ibtn { border: none; background: #f3f1fb; border-radius: 10px; min-width: 34px; height: 34px; cursor: pointer; font-size: 15px; padding: 0 8px; font-weight: 700; font-family: inherit; }
  .ibtn.on { background: #dff5f5; box-shadow: inset 0 0 0 2px var(--teal); }

  .cols { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .clist { display: flex; flex-direction: column; gap: 6px; }
  .clist button { text-align: left; border: none; background: #fff; border-radius: 14px; padding: 10px 14px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-family: inherit; box-shadow: 0 2px 0 rgba(0,0,0,0.05); }
  .clist button.sel { background: var(--teal); color: #fff; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

  /* ── Live lesson ── */
  .live { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 10px 16px 20px; max-width: 1500px; margin: 0 auto; }
  .live.with-panel { grid-template-columns: 1fr 340px; }
  @media (max-width: 1000px) { .live.with-panel { grid-template-columns: 1fr; } }
  .live-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; grid-column: 1 / -1; }
  .live-bar h2 { font-size: 22px; flex: 1; min-width: 200px; }
  .ppanel { background: #fff; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(35,38,74,0.1); align-self: start; position: sticky; top: 64px; }
  .ppanel h3 { font-size: 18px; }
  .pmodes { display: flex; flex-direction: column; gap: 6px; }
  .pmodes button { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 15px; }
  .pmodes button.sel { border-color: var(--teal); background: #e9f8f8; }
  .slist { display: flex; flex-direction: column; gap: 4px; max-height: 42vh; overflow-y: auto; }
  .srow { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 10px; background: #f6f4fd; font-weight: 700; font-size: 15px; }
  .srow input { width: 18px; height: 18px; accent-color: var(--teal); }
  .srow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .st { font-size: 16px; min-width: 22px; text-align: center; }
  .legend { font-size: 12px; font-weight: 700; color: var(--ink-soft); line-height: 1.5; }
  :fullscreen .live { max-width: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(30px); opacity: 0; z-index: 400;
    background: var(--navy); color: #fff; padding: 10px 22px; border-radius: 999px; font-weight: 800; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.bad { background: var(--orange); }
  .modal.wide { max-width: 1240px; height: 94vh; max-height: 94vh; }
  .modal.wide .modal-body { flex: 1; }
  .modal.mid { max-width: 820px; }
  .pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 15px; }
  .seg button.sel { border-color: var(--teal); background: #e9f8f8; }
  .errs { margin: 4px 0 0 18px; font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .linkbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 700; }
  .linkbox code { font-size: 14px; word-break: break-all; }
</style>
</head>
<body>

<div id="boot" class="empty" style="padding-top:30vh">⏳</div>

<!-- T-01: sign in -->
<div class="auth" id="authScreen" hidden>
  <div class="panel auth-card">
    <div class="auth-logo">🎼 MUSICATION</div>
    <h1 data-i18n="t.loginTitle"></h1>
    <div class="demo-note" id="demoNote" hidden data-i18n="t.demoNote"></div>
    <form id="fLogin">
      <label class="field"><span data-i18n="t.email"></span><input class="input" type="email" id="liEmail" autocomplete="username" required></label>
      <label class="field"><span data-i18n="t.password"></span><input class="input" type="password" id="liPass" autocomplete="current-password"></label>
      <button class="btn btn-teal" type="submit" data-i18n="t.signIn"></button>
      <div class="auth-links">
        <button class="link" type="button" data-to="fSignup" data-i18n="t.signUp"></button>
        <button class="link" type="button" data-to="fForgot" data-i18n="t.forgot"></button>
      </div>
    </form>
    <form id="fSignup" hidden>
      <label class="field"><span data-i18n="t.name"></span><input class="input" type="text" id="suName" required></label>
      <label class="field"><span data-i18n="t.email"></span><input class="input" type="email" id="suEmail" autocomplete="username" required></label>
      <label class="field"><span data-i18n="t.passwordNew"></span><input class="input" type="password" id="suPass" autocomplete="new-password" minlength="6"></label>
      <label class="field"><span data-i18n="t.language"></span><select class="select" id="suLang"><option value="lt">Lietuvių</option><option value="en">English</option></select></label>
      <button class="btn btn-teal" type="submit" data-i18n="t.createAccount"></button>
      <div class="auth-links"><button class="link" type="button" data-to="fLogin" data-i18n="t.haveAccount"></button></div>
    </form>
    <form id="fForgot" hidden>
      <p class="muted" data-i18n="t.forgotHelp"></p>
      <label class="field"><span data-i18n="t.email"></span><input class="input" type="email" id="fgEmail" required></label>
      <button class="btn btn-teal" type="submit" data-i18n="t.sendLink"></button>
      <div class="auth-links"><button class="link" type="button" data-to="fLogin" data-i18n="t.back"></button></div>
    </form>
    <form id="fNewPass" hidden>
      <label class="field"><span data-i18n="t.passwordNew"></span><input class="input" type="password" id="npPass" autocomplete="new-password" minlength="6" required></label>
      <button class="btn btn-teal" type="submit" data-i18n="t.savePassword"></button>
    </form>
    <p class="auth-msg" id="authMsg"></p>
    <div class="langs"><button class="chip" data-lang="lt">LT</button><button class="chip" data-lang="en">EN</button></div>
  </div>
</div>

<!-- The teacher's room -->
<div id="app" hidden>
  <header class="nav" id="nav">
    <a class="brand" href="#home">🎼 MUSICATION <small data-i18n="t.room"></small></a>
    <nav>
      <a href="#library" data-r="library"><span class="ico">📚</span><span class="lbl" data-i18n="nav.library"></span></a>
      <a href="#mine" data-r="mine"><span class="ico">📂</span><span class="lbl" data-i18n="nav.mine"></span></a>
      <a href="#classes" data-r="classes"><span class="ico">👥</span><span class="lbl" data-i18n="nav.classes"></span></a>
      <a href="#results" data-r="results"><span class="ico">📊</span><span class="lbl" data-i18n="nav.results"></span></a>
      <a href="#new" data-r="new" class="plus"><span class="ico">＋</span><span class="lbl" data-i18n="nav.new"></span></a>
      <a href="#settings" data-r="settings"><span class="ico">⚙️</span><span class="lbl" data-i18n="nav.settings"></span></a>
      <button id="langBtn" type="button"><span class="ico">🌐</span><span id="langLbl">LT</span></button>
    </nav>
    <span class="mode-badge" id="modeBadge" hidden data-i18n="t.demo"></span>
    <span class="who" id="who"></span>
  </header>
  <main id="view"></main>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="db.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script src="solfedzioData.js"></script>
<script src="lessonEngine.js"></script>
<script src="programLessons.js"></script>
<script>
(function () {
  'use strict';
  var DB = window.MusicationDB, LE = window.LessonEngine, PL = window.ProgramLessons, I = window.I18N;
  var t = I.t, esc = LE.esc;
  function $(id) { return document.getElementById(id); }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

  var S = { user: null, profile: null, classes: [], students: [], lessons: [], assignments: [], attempts: [] };
  var AREAS = [['notes', '🎼'], ['rhythm', '👏'], ['listening', '👂'], ['piano', '🎹'], ['other', '📝']];
  var STATUS_ICO = { assigned: '📤', started: '▶', in_progress: '⏳', completed: '✓', repeat: '🔄' };
  var ONLINE_MS = 45000;

  // ───────────────────────────── Small helpers ─────────────────────────────
  var toastT = null;
  function toast(msg, bad) {
    var x = $('toast');
    x.textContent = msg; x.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastT); toastT = setTimeout(function () { x.className = 'toast' + (bad ? ' bad' : ''); }, bad ? 4200 : 2400);
  }
  function fail(e) { console.error(e); toast('⚠️ ' + ((e && e.message) || e), true); }
  function title(l) { return (I.lang === 'en' && l.title_en) ? l.title_en : (l.title || t('t.untitled')); }
  function fmtDate(iso) {
    if (!iso) { return '—'; }
    try { return new Date(iso).toLocaleString(I.lang === 'en' ? 'en-GB' : 'lt-LT', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; }
  }
  function gradeName(g) { return g === null || g === undefined || g === '' ? '—' : +g === 0 ? t('g.pre') : t('g.n', { n: g }); }
  function topicName(id) { return id ? t('topic.' + id) : '—'; }
  function stars(n) { return '⭐'.repeat(Math.max(1, Math.min(3, n || 1))); }
  function pct(x) { return x === null || x === undefined ? null : Math.round(x * 100); }
  function scoreHtml(x) {
    var p = pct(x);
    if (p === null) { return '<span class="score none">—</span>'; }
    return '<span class="score ' + (p >= 85 ? 'hi' : p >= 60 ? 'mid' : 'lo') + '">' + p + '%</span>';
  }
  function blockIcons(blocks) {
    return (blocks || []).map(function (b) { return b.type === 'game' ? (LE.GAMES.filter(function (g) { return g.id === b.game; })[0] || {}).ico || '🎮' : LE.ICO[b.type]; }).join('');
  }
  function className(id) { var c = S.classes.filter(function (x) { return x.id === id; })[0]; return c ? c.name : t('cl.none'); }
  function studentName(id) { var s = S.students.filter(function (x) { return x.id === id; })[0]; return s ? s.name : '?'; }
  function online(s) {
    if (!s.last_seen) { return 'off'; }
    var age = Date.now() - new Date(s.last_seen).getTime();
    return age < ONLINE_MS ? (s.seen_from === 'home' ? 'home' : 'on') : 'off';
  }
  var ONLINE_ICO = { on: '🟢', home: '🏠', off: '⚪' };
  function studentLink() { return new URL('mokinys.html', location.href).href.split('#')[0]; }

  // ── Modals ──
  var modalNow = null;
  function openModal(o) {
    if (modalNow) { modalNow.close(); }
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal ' + (o.size || '') + '" style="--mc:' + (o.color || 'var(--teal)') + '"><div class="modal-head"><h2></h2>' +
      '<button class="x" aria-label="✕">&times;</button></div><div class="modal-body"></div><div class="modal-foot"></div></div>';
    ov.querySelector('h2').textContent = o.title || '';
    var body = ov.querySelector('.modal-body'), foot = ov.querySelector('.modal-foot');
    if (typeof o.body === 'string') { body.innerHTML = o.body; } else if (o.body) { body.appendChild(o.body); }
    var m = {
      el: ov, body: body, foot: foot,
      close: function () {
        if (m.closed) { return; }
        m.closed = true;
        if (o.onClose) { o.onClose(); }
        ov.remove();

  // ───────────────────────────── ✏️ Lesson editor ─────────────────────────────
  function vEdit(id) {
    view.innerHTML = '<div class="empty">⏳</div>';
    DB.lessons.get(id).then(function (l) { buildEditor(l); }).catch(function (e) { fail(e); go('mine'); });
  }
  function buildEditor(l) {
    var ed = { l: l, blocks: LE.clone(l.blocks || []), dirty: false, open: null };
    var FIELDS = ['title', 'title_en', 'grade', 'topic', 'difficulty', 'duration', 'order_mode', 'color_mode', 'language'];
    ed.vals = {}; FIELDS.forEach(function (f) { ed.vals[f] = l[f]; });
    guard = function (silent) { return !ed.dirty || (!silent && confirm(t('ed.leave'))); };
    var src = l.source_lesson_id ? PL.get(l.source_lesson_id) : null;

    view.innerHTML =
      '<div class="ed-top">' +
        '<a class="btn" href="#mine">← ' + esc(t('nav.mine')) + '</a>' +
        '<input class="input title-in" id="edTitle" aria-label="' + esc(t('ed.title')) + '">' +
        '<span class="vtag" id="edVer"></span><span class="dirty" id="edDirty" hidden>● ' + esc(t('ed.unsaved')) + '</span>' +
        '<button class="btn" id="edPrev">▶ ' + esc(t('a.preview')) + '</button>' +
        '<button class="btn" id="edLive">📺 ' + esc(t('a.live')) + '</button>' +
        '<button class="btn" id="edVers">🕘 ' + esc(t('ed.versions')) + '</button>' +
        '<button class="btn" id="edNewVer">💾 ' + esc(t('ed.saveNew')) + '</button>' +
        '<button class="btn btn-teal" id="edSave">💾 ' + esc(t('ed.save')) + '</button>' +
      '</div>' +
      (src ? '<p class="muted" style="margin:-6px 0 12px">⧉ ' + esc(t('mine.from', { name: title(src) })) + ' · 🔒 ' + esc(t('ed.origSafe')) + '</p>' : '') +
      '<div class="ed-grid"><div class="panel settings-box" id="edSettings"></div><div><div class="blist" id="edBlocks"></div>' +
      '<div class="sub-h">＋ ' + esc(t('ed.addBlock')) + '</div><div class="palette" id="edPalette"></div></div></div>';
    var titleIn = $('edTitle');
    titleIn.value = ed.vals.title || '';
    titleIn.addEventListener('input', function () { ed.vals.title = titleIn.value; dirty(); });
    function dirty() { ed.dirty = true; $('edDirty').hidden = false; }
    function ver() { $('edVer').textContent = 'V' + (ed.l.version || 1); }
    ver();

    // Lesson settings
    var sb = $('edSettings');
    function sel(k, label, opts) {
      return '<label class="field"><span>' + label + '</span><select class="select" data-k="' + k + '">' + opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (String(ed.vals[k]) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select></label>';
    }
    sb.innerHTML = '<h3>⚙️ ' + esc(t('ed.settings')) + '</h3>' +
      '<label class="field"><span>' + esc(t('ed.titleEn')) + '</span><input class="input" data-k="title_en"></label>' +
      sel('grade', '🎓 ' + esc(t('f.grade')), PL.GRADES.map(function (g) { return [g, gradeName(g)]; })) +
      sel('topic', '🎼 ' + esc(t('f.topic')), PL.TOPICS.map(function (x) { return [x.id, x.ico + ' ' + topicName(x.id)]; })) +
      sel('difficulty', '⭐ ' + esc(t('f.diff')), [[1, '⭐'], [2, '⭐⭐'], [3, '⭐⭐⭐']]) +
      '<label class="field"><span>⏱ ' + esc(t('ed.duration')) + '</span><input class="input" type="number" min="1" max="180" data-k="duration"></label>' +
      sel('order_mode', '🔢 ' + esc(t('ed.order')), [['fixed', t('ed.orderFixed')], ['free', t('ed.orderFree')]]) +
      sel('color_mode', '🎨 ' + esc(t('ed.color')), [['color', t('ed.colorOn')], ['mono', t('ed.colorOff')]]) +
      sel('language', '🌐 ' + esc(t('t.language')), [['lt', 'Lietuvių'], ['en', 'English']]);
    sb.querySelectorAll('[data-k]').forEach(function (x) {
      var k = x.dataset.k;
      if (x.tagName === 'INPUT') { x.value = ed.vals[k] == null ? '' : ed.vals[k]; }
      x.addEventListener(x.tagName === 'INPUT' ? 'input' : 'change', function () {
        ed.vals[k] = /grade|difficulty|duration/.test(k) ? (x.value === '' ? null : +x.value) : x.value;
        dirty();
      });
    });

    // Blocks
    var listEl = $('edBlocks'), dragFrom = null;
    function drawBlocks() {
      listEl.innerHTML = '';
      if (!ed.blocks.length) { listEl.innerHTML = '<div class="empty" style="padding:20px">' + esc(t('ed.noBlocks')) + '</div>'; }
      ed.blocks.forEach(function (b, i) {
        var row = el('<div class="brow' + (ed.open === b.id ? ' open' : '') + '" draggable="false">' +
          '<div class="bhead"><span class="handle" title="' + esc(t('ed.drag')) + '">☰</span><span class="no">' + (i + 1) + '</span>' +
          '<span class="bico">' + (b.type === 'game' ? (LE.GAMES.filter(function (g) { return g.id === b.game; })[0] || {}).ico : LE.ICO[b.type]) + '</span>' +
          '<div class="btxt"><b>' + esc(b.title && b.title !== '🎯' ? b.title : LE.typeName(b.type)) + '</b><span>' + esc(LE.summary(b) || '—') + '</span></div>' +
          '<div class="thumb">' + (/rhythm|notes|image/.test(b.type) ? LE.thumb(b) : '') + '</div>' +
          '<div class="bacts">' +
            '<button data-a="up" title="' + esc(t('ed.up')) + '"' + (i === 0 ? ' disabled' : '') + '>⬆</button>' +
            '<button data-a="down" title="' + esc(t('ed.down')) + '"' + (i === ed.blocks.length - 1 ? ' disabled' : '') + '>⬇</button>' +
            '<button data-a="edit" title="' + esc(t('a.edit')) + '">✏️</button>' +
            '<button data-a="dup" title="' + esc(t('ed.dup')) + '">⧉</button>' +
            '<button data-a="del" title="' + esc(t('a.delete')) + '">🗑️</button>' +
          '</div></div></div>');
        var handle = row.querySelector('.handle');
        handle.addEventListener('mousedown', function () { row.draggable = true; });
        handle.addEventListener('mouseup', function () { row.draggable = false; });
        row.addEventListener('dragstart', function (e) { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (x) {} });
        row.addEventListener('dragend', function () { row.draggable = false; dragFrom = null; listEl.querySelectorAll('.drag-over').forEach(function (x) { x.classList.remove('drag-over'); }); });
        row.addEventListener('dragover', function (e) { if (dragFrom === null) { return; } e.preventDefault(); row.classList.add('drag-over'); });
        row.addEventListener('dragleave', function () { row.classList.remove('drag-over'); });
        row.addEventListener('drop', function (e) {
          e.preventDefault();
          if (dragFrom === null || dragFrom === i) { return; }
          var x = ed.blocks.splice(dragFrom, 1)[0];
          ed.blocks.splice(i, 0, x);
          dragFrom = null; dirty(); drawBlocks();
        });
        row.querySelector('[data-a="up"]').addEventListener('click', function () { move(i, -1); });
        row.querySelector('[data-a="down"]').addEventListener('click', function () { move(i, 1); });
        row.querySelector('[data-a="edit"]').addEventListener('click', function () { ed.open = ed.open === b.id ? null : b.id; drawBlocks(); });
        row.querySelector('[data-a="dup"]').addEventListener('click', function () {
          var c = LE.clone(b); c.id = LE.uid(); ed.blocks.splice(i + 1, 0, c); ed.open = c.id; dirty(); drawBlocks();
        });
        row.querySelector('[data-a="del"]').addEventListener('click', function () {
          ask(t('ed.delBlock', { n: i + 1 }), '🗑️ ' + t('a.delete'), true).then(function (yes) {
            if (!yes) { return; }
            ed.blocks.splice(i, 1); dirty(); drawBlocks();
          });
        });
        if (ed.open === b.id) {
          var body = el('<div class="bbody"></div>');
          LE.editor(b, body, function () {
            dirty();
            row.querySelector('.btxt b').textContent = b.title && b.title !== '🎯' ? b.title : LE.typeName(b.type);
            row.querySelector('.btxt span').textContent = LE.summary(b) || '—';
            row.querySelector('.thumb').innerHTML = /rhythm|notes|image/.test(b.type) ? LE.thumb(b) : '';
          }, { upload: DB.media.upload });
          var tryBtn = el('<button class="btn btn-small" style="margin-top:10px">▶ ' + esc(t('ed.tryBlock')) + '</button>');
          tryBtn.addEventListener('click', function () { preview({ title: b.title || LE.typeName(b.type), color_mode: ed.vals.color_mode }, [b]); });
          body.appendChild(tryBtn);
          row.appendChild(body);
        }
        listEl.appendChild(row);
      });
    }
    function move(i, d) {
      var j = i + d;
      if (j < 0 || j >= ed.blocks.length) { return; }
      var x = ed.blocks[i]; ed.blocks[i] = ed.blocks[j]; ed.blocks[j] = x;
      dirty(); drawBlocks();
    }
    var pal = $('edPalette');
    LE.ORDER.forEach(function (type) {
      var b = el('<button type="button"><span>' + LE.ICO[type] + '</span>' + esc(LE.typeName(type)) + '</button>');
      b.addEventListener('click', function () {
        var nb = LE.newBlock(type);
        ed.blocks.push(nb); ed.open = nb.id; dirty(); drawBlocks();
        setTimeout(function () { var r = listEl.lastChild; if (r && r.scrollIntoView) { r.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }, 30);
      });
      pal.appendChild(b);
    });
    drawBlocks();

    function lessonNow() {
      var o = { blocks: ed.blocks };
      FIELDS.forEach(function (f) { o[f] = ed.vals[f]; });
      o.title = (o.title || '').trim() || t('t.untitled');
      return o;
    }
    function save(newVersion, note) {
      var btns = [$('edSave'), $('edNewVer')];
      btns.forEach(function (b) { b.disabled = true; });
      return DB.lessons.save(ed.l.id, lessonNow(), { newVersion: newVersion, note: note }).then(function (l) {
        ed.l = l; ed.dirty = false; $('edDirty').hidden = true; ver();
        toast('✓ ' + (newVersion ? t('ed.savedNew', { v: l.version }) : t('ed.saved')));
        return reload(['lessons']);
      }).catch(fail).then(function () { btns.forEach(function (b) { b.disabled = false; }); });
    }
    $('edSave').addEventListener('click', function () { save(false); });
    $('edNewVer').addEventListener('click', function () {
      var box = el('<div><p class="muted">' + esc(t('ed.newVerHelp', { v: (ed.l.version || 1) + 1 })) + '</p>' +
        '<label class="field"><span>' + esc(t('ed.note')) + '</span><input class="input" id="verNote" placeholder="' + esc(t('ed.notePh')) + '"></label></div>');
      openModal({ title: '💾 ' + t('ed.saveNew'), body: box, buttons: [
        { label: t('t.cancel'), fn: function (m) { m.close(); } },
        { label: '💾 V' + ((ed.l.version || 1) + 1), cls: 'btn-teal', fn: function (m) { var n = $('verNote').value.trim(); m.close(); save(true, n); } }
      ] });
    });
    $('edPrev').addEventListener('click', function () { preview({ title: ed.vals.title, color_mode: ed.vals.color_mode }, ed.blocks); });
    $('edLive').addEventListener('click', function () {
      if (ed.dirty) { save(false).then(function () { go('live/' + ed.l.id); }); } else { go('live/' + ed.l.id); }
    });
    $('edVers').addEventListener('click', function () {
      DB.lessons.versions(ed.l.id).then(function (vs) {
        var box = el('<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + esc(t('ed.version')) + '</th><th>' + esc(t('ed.date')) + '</th><th>' + esc(t('ed.note')) + '</th><th></th></tr></thead><tbody></tbody></table></div>');
        var tb = box.querySelector('tbody');
        (vs || []).forEach(function (v) {
          var tr = el('<table><tr><td><span class="vtag">V' + v.version + '</span>' + (v.version === ed.l.version ? ' ' + esc(t('ed.current')) : '') + '</td><td>' + esc(fmtDate(v.created_at)) +
            '</td><td>' + esc(v.note || '') + '</td><td style="white-space:nowrap"><button class="ibtn" data-a="see">▶</button> <button class="ibtn" data-a="back">↩ ' + esc(t('ed.restore')) + '</button></td></tr></table>').querySelector('tr');
          tr.querySelector('[data-a="see"]').addEventListener('click', function () {
            DB.lessons.version(ed.l.id, v.version).then(function (x) { preview({ title: (x.title || '') + ' · V' + v.version }, x.blocks || []); }).catch(fail);
          });
          tr.querySelector('[data-a="back"]').addEventListener('click', function () {
            DB.lessons.version(ed.l.id, v.version).then(function (x) {
              ed.blocks = LE.clone(x.blocks || []);
              if (x.settings) { FIELDS.forEach(function (f) { if (x.settings[f] !== undefined) { ed.vals[f] = x.settings[f]; } }); }
              if (x.title) { ed.vals.title = x.title; }
              modalNow.close();
              titleIn.value = ed.vals.title || '';
              sb.querySelectorAll('[data-k]').forEach(function (inp) { inp.value = ed.vals[inp.dataset.k] == null ? '' : ed.vals[inp.dataset.k]; });
              dirty(); drawBlocks();
              toast(t('ed.restored', { v: v.version }));
            }).catch(fail);
          });
          tb.appendChild(tr);
        });
        openModal({ title: '🕘 ' + t('ed.versions'), body: box, size: 'mid' });
      }).catch(fail);
    });
  }

        (list.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + esc(t('cl.name')) + '</th><th>' + esc(t('cl.code')) + '</th><th class="c" title="' + esc(t('cl.remoteHelp')) + '">🏠 ' + esc(t('cl.remote')) + '</th><th>' + esc(t('cl.state')) + '</th><th>' + esc(t('cl.class')) + '</th><th></th></tr></thead><tbody id="stBody"></tbody></table></div>'
          : '<div class="empty"><span class="big">🧒</span>' + esc(t('cl.noStudents')) + '</div>') +
        '<p class="legend" style="margin-top:10px">🟢 ' + esc(t('st.on')) + ' · 🏠 ' + esc(t('st.home')) + ' · ⚪ ' + esc(t('st.off')) + '</p>';

  // ───────────────────────────── 📊 Results ─────────────────────────────
  var resTab = 'results', resClass = '', resAsg = '';
  function latestAttempts(filterFn) {
    var m = {};
    S.attempts.forEach(function (a) {
      if (filterFn && !filterFn(a)) { return; }
      var k = a.assignment_id + '|' + a.student_id + '|' + (a.block_id || '');
      if (!m[k] || m[k].completed_at < a.completed_at) { m[k] = a; }
    });
    return Object.keys(m).map(function (k) { return m[k]; });
  }
  function avg(list) { return list.length ? list.reduce(function (s, a) { return s + Number(a.score); }, 0) / list.length : null; }
  function vResults() {
    view.innerHTML = '<h2 class="view-h">📊 ' + esc(t('nav.results')) + '<span class="grow"></span><button class="btn btn-small" id="resReload">🔄 ' + esc(t('t.refresh')) + '</button></h2>' +
      '<div class="tabs"><button class="chip' + (resTab === 'results' ? ' sel' : '') + '" data-tab="results">📊 ' + esc(t('r.tabResults')) + '</button>' +
      '<button class="chip' + (resTab === 'tasks' ? ' sel' : '') + '" data-tab="tasks">📤 ' + esc(t('r.tabTasks')) + '</button></div><div id="resBody"></div>';
    view.querySelectorAll('[data-tab]').forEach(function (b) { b.addEventListener('click', function () { resTab = b.dataset.tab; vResults(); }); });
    $('resReload').addEventListener('click', function () { reload(['students', 'assignments', 'attempts']).then(vResults).catch(fail); });
    if (resTab === 'tasks') { drawTasks($('resBody')); } else { drawResults($('resBody')); }
  }
  function drawResults(box) {
    box.innerHTML = '<div class="filters">' +
      '<label>👥<select id="rCls"><option value="">' + esc(t('cl.all')) + '</option>' + S.classes.map(function (c) { return '<option value="' + c.id + '"' + (c.id === resClass ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></label>' +
      '<label>📤<select id="rAsg"><option value="">' + esc(t('r.allTasks')) + '</option>' + S.assignments.map(function (a) { return '<option value="' + a.id + '"' + (a.id === resAsg ? ' selected' : '') + '>' + esc(a.title) + ' · ' + esc(fmtDate(a.assigned_at)) + '</option>'; }).join('') + '</select></label>' +
      '</div><p class="muted" style="margin:-6px 0 12px">' + esc(t('r.help')) + '</p><div id="rTable"></div>';
    $('rCls').addEventListener('change', function () { resClass = this.value; drawResults(box); });
    $('rAsg').addEventListener('change', function () { resAsg = this.value; drawResults(box); });
    var students = S.students.filter(function (s) { return !resClass || s.class_id === resClass; });
    if (!students.length) { $('rTable').innerHTML = '<div class="empty"><span class="big">📊</span>' + esc(t('cl.noStudents')) + '</div>'; return; }
    var latest = latestAttempts(function (a) { return !resAsg || a.assignment_id === resAsg; });
    var html = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + esc(t('cl.name')) + '</th>' +
      AREAS.map(function (x) { return '<th class="c">' + x[1] + ' ' + esc(t('area.' + x[0])) + '</th>'; }).join('') +
      '<th class="c">' + esc(t('r.overall')) + '</th><th class="c">' + esc(t('r.done')) + '</th><th>' + esc(t('r.last')) + '</th></tr></thead><tbody>';
    students.forEach(function (s) {
      var mine = latest.filter(function (a) { return a.student_id === s.id; });
      var asg = S.assignments.filter(function (a) { return (!resAsg || a.id === resAsg) && a.students.some(function (x) { return x.student_id === s.id; }); });
      var doneN = asg.filter(function (a) { return a.students.some(function (x) { return x.student_id === s.id && x.status === 'completed'; }); }).length;
      var last = mine.reduce(function (m, a) { return !m || a.completed_at > m ? a.completed_at : m; }, null);
      html += '<tr class="click" data-s="' + s.id + '"><td><b>' + esc(s.name) + '</b> <span class="muted">' + esc(className(s.class_id)) + '</span></td>' +
        AREAS.map(function (x) { return '<td class="c">' + scoreHtml(avg(mine.filter(function (a) { return a.area === x[0]; }))) + '</td>'; }).join('') +
        '<td class="c">' + scoreHtml(avg(mine)) + '</td><td class="c">' + (asg.length ? doneN + '/' + asg.length : '—') + '</td><td>' + esc(last ? fmtDate(last) : '—') + '</td></tr>';
    });
    $('rTable').innerHTML = html + '</tbody></table></div>';
    $('rTable').querySelectorAll('[data-s]').forEach(function (tr) { tr.addEventListener('click', function () { studentDetail(tr.dataset.s); }); });

  function studentDetail(sid) {
    var list = S.attempts.filter(function (a) { return a.student_id === sid; });

      list.forEach(function (a) {
        var asg = S.assignments.filter(function (x) { return x.id === a.assignment_id; })[0];
        var b = asg ? LE.blocksOf(asg.content).filter(function (x) { return x.id === a.block_id; })[0] : null;
        var errs = (a.errors || []).map(LE.errorText).filter(Boolean);
        html += '<tr><td>' + esc(asg ? asg.title : '?') + '</td><td>' + (b ? (LE.ICO[b.type] || '') + ' ' + esc(b.title && b.title !== '🎯' ? b.title : LE.typeName(b.type)) : esc(a.block_id || '')) + '</td>' +
          '<td class="c">' + scoreHtml(Number(a.score)) + '</td><td>' + (errs.length ? '<ul class="errs">' + errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '<span class="muted">' + esc(t('r.noErrors')) + '</span>') + '</td>' +
          '<td>' + esc(fmtDate(a.completed_at)) + '</td></tr>';

  function drawTasks(box) {

    box.innerHTML = '<p class="legend" style="margin-bottom:10px">' + Object.keys(STATUS_ICO).map(function (k) { return STATUS_ICO[k] + ' ' + esc(t('s.' + k)); }).join(' · ') + '</p>';

        '<div style="font-weight:800">' + Object.keys(STATUS_ICO).filter(function (k) { return counts[k]; }).map(function (k) { return STATUS_ICO[k] + ' ' + counts[k]; }).join('  ') + '</div>' +
        '<button class="ibtn" data-a="open">👁</button><button class="ibtn" data-a="del" title="' + esc(t('a.delete')) + '">🗑️</button></div>' +
        '<div data-list hidden style="margin-top:10px"></div></div>');
      var lst = card.querySelector('[data-list]');
      function drawList() {
        lst.innerHTML = '';
        a.students.forEach(function (x) {
          var r = el('<div class="srow"><span class="st">' + (STATUS_ICO[x.status] || '○') + '</span><span class="nm">' + esc(studentName(x.student_id)) + ' <span class="muted">· ' + esc(t('s.' + x.status)) + ' · ' + esc(fmtDate(x.updated_at)) + '</span></span>' +
            '<button class="ibtn" data-a="rep" title="' + esc(t('r.markRepeat')) + '">🔄</button><button class="ibtn" data-a="un" title="' + esc(t('r.unassign')) + '">✕</button></div>');
          r.querySelector('[data-a="rep"]').addEventListener('click', function () {
            DB.assign.setStatus(a.id, x.student_id, 'repeat').then(function () { x.status = 'repeat'; drawList(); }).catch(fail);
          });
          r.querySelector('[data-a="un"]').addEventListener('click', function () {
            DB.assign.unassign(a.id, x.student_id).then(function () { a.students = a.students.filter(function (y) { return y !== x; }); drawList(); }).catch(fail);
          });
          lst.appendChild(r);
        });
      }
      card.querySelector('[data-a="open"]').addEventListener('click', function () { lst.hidden = !lst.hidden; if (!lst.hidden) { drawList(); } });
      card.querySelector('[data-a="del"]').addEventListener('click', function () {
        ask(t('r.delTask', { name: a.title }), '🗑️ ' + t('a.delete'), true).then(function (yes) {
          if (yes) { DB.assign.remove(a.id).then(function () { return reload(['assignments', 'attempts']); }).then(vResults).catch(fail); }
        });
      });
      box.appendChild(card);

  // ───────────────────────────── 📺 Live lesson ─────────────────────────────
  // The lesson on the board. Students take part only if the teacher opens
  // 👥: the whole class, chosen students, or remote ones get the current
  // block (or the whole lesson) as a task, and their state shows live.
  var part = { open: false, mode: 'class', classId: '', picked: {}, lastAsg: null };
  function vLive(ref) {
    view.innerHTML = '<div class="empty">⏳</div>';
    lessonByRef(ref).then(function (l) {
      if (!l) { go('library'); return; }
      buildLive(l);
    }).catch(function (e) { fail(e); go('library'); });
  }
  function buildLive(l) {
    if (!part.classId && S.classes[0]) { part.classId = S.classes[0].id; }
    view.innerHTML = '';
    var wrap = el('<div class="live' + (part.open ? ' with-panel' : '') + '">' +
      '<div class="live-bar"><button class="btn" id="lvBack">← ' + esc(t('t.back')) + '</button><h2>📺 ' + esc(title(l)) + '</h2>' +
      '<button class="btn' + (part.open ? ' btn-teal' : '') + '" id="lvPart">👥 ' + esc(t('p.title')) + '</button>' +
      '<button class="btn" id="lvFull">⛶ ' + esc(t('p.full')) + '</button></div>' +
      '<div id="lvPlayer"></div><div class="ppanel" id="lvPanel"' + (part.open ? '' : ' hidden') + '></div></div>');
    view.appendChild(wrap);
    var player = LE.player($('lvPlayer'), LE.clone(l.blocks || []), { mode: 'teacher', role: 'teacher', mono: l.color_mode === 'mono', onChange: function () { drawPanel(); } });
    $('lvBack').addEventListener('click', function () { history.length > 1 ? history.back() : go('library'); });
    $('lvFull').addEventListener('click', function () {
      if (document.fullscreenElement) { document.exitFullscreen(); } else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
    });
    function onFs() { $('nav').hidden = !!document.fullscreenElement; }
    document.addEventListener('fullscreenchange', onFs);
    $('lvPart').addEventListener('click', function () {
      part.open = !part.open;
      wrap.classList.toggle('with-panel', part.open);
      $('lvPanel').hidden = !part.open;
      this.classList.toggle('btn-teal', part.open);
      drawPanel();
    });

    function who() {
      if (part.mode === 'class') { return S.students.filter(function (s) { return s.class_id === part.classId; }); }
      if (part.mode === 'remote') { return S.students.filter(function (s) { return s.remote_enabled && (!part.classId || s.class_id === part.classId); }); }
      return S.students.filter(function (s) { return !part.classId || s.class_id === part.classId; });
    }
    function targets() {
      var list = who();
      return part.mode === 'pick' ? list.filter(function (s) { return part.picked[s.id]; }) : list;
    }
    function drawPanel() {
      var pn = $('lvPanel');
      if (!pn || pn.hidden || !player) { return; }
      var b = player.block();
      var asg = part.lastAsg ? S.assignments.filter(function (a) { return a.id === part.lastAsg; })[0] : null;
      var stOf = function (sid) { var x = asg ? asg.students.filter(function (y) { return y.student_id === sid; })[0] : null; return x ? x.status : null; };
      pn.innerHTML = '<h3>👥 ' + esc(t('p.title')) + '</h3>' +
        '<div class="pmodes">' +
          '<button data-m="class" class="' + (part.mode === 'class' ? 'sel' : '') + '">👥 ' + esc(t('p.class')) + '</button>' +
          '<button data-m="pick" class="' + (part.mode === 'pick' ? 'sel' : '') + '">👤 ' + esc(t('p.pick')) + '</button>' +
          '<button data-m="remote" class="' + (part.mode === 'remote' ? 'sel' : '') + '">🏠 ' + esc(t('p.remote')) + '</button></div>' +
        (S.classes.length ? '<select class="select" id="pCls">' + (part.mode !== 'class' ? '<option value="">' + esc(t('cl.all')) + '</option>' : '') +
          S.classes.map(function (c) { return '<option value="' + c.id + '"' + (c.id === part.classId ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select>' : '') +
        '<div class="slist" id="pList"></div>' +
        '<p class="legend">🟢 ' + esc(t('st.on')) + ' · ⚪ ' + esc(t('st.off')) + ' · 🏠 ' + esc(t('st.home')) + ' · ✓ ' + esc(t('s.completed')) + '</p>' +
        '<button class="btn btn-teal" id="pSendBlock" style="justify-content:center">📤 ' + esc(t('p.sendBlock')) + '</button>' +
        '<div class="muted" style="text-align:center">' + (b ? (LE.ICO[b.type] || '') + ' ' + esc(b.title && b.title !== '🎯' ? b.title : LE.typeName(b.type)) : '') + '</div>' +
        '<button class="btn" id="pSendAll" style="justify-content:center">📤 ' + esc(t('p.sendAll')) + '</button>' +
        (asg ? '<div class="muted">📤 ' + esc(asg.title) + ' · ' + esc(fmtDate(asg.assigned_at)) + '</div>' : '');
      pn.querySelectorAll('[data-m]').forEach(function (x) { x.addEventListener('click', function () { part.mode = x.dataset.m; if (part.mode === 'class' && !part.classId && S.classes[0]) { part.classId = S.classes[0].id; } drawPanel(); }); });
      if ($('pCls')) { $('pCls').addEventListener('change', function () { part.classId = this.value; drawPanel(); }); }
      var list = who(), box = $('pList');
      if (!list.length) { box.innerHTML = '<div class="muted">' + esc(t(S.students.length ? 'p.nobody' : 'as.noStudents')) + '</div>'; }
      list.forEach(function (s) {
        var o = online(s), st = stOf(s.id);
        var r = el('<label class="srow">' + (part.mode === 'pick' ? '<input type="checkbox"' + (part.picked[s.id] ? ' checked' : '') + '>' : '') +
          '<span class="st" title="' + esc(t('st.' + o)) + '">' + ONLINE_ICO[o] + '</span><span class="nm">' + esc(s.name) + '</span>' +
          '<span class="st" title="' + esc(st ? t('s.' + st) : t('s.none')) + '">' + (st ? STATUS_ICO[st] : '○') + '</span></label>');
        var cb = r.querySelector('input');
        if (cb) { cb.addEventListener('change', function () { part.picked[s.id] = cb.checked; }); }
        box.appendChild(r);
      });
      $('pSendBlock').disabled = !b;
      $('pSendBlock').addEventListener('click', function () { send(b ? [b] : []); });
      $('pSendAll').addEventListener('click', function () { send(l.blocks || []); });
    }
    function send(blocks) {
      var ids = targets().map(function (s) { return s.id; });
      if (!ids.length) { toast(t('as.pickSomeone'), true); return; }
      if (!blocks.length) { return; }
      sendAssignment(l, blocks, ids, part.mode === 'remote').then(function (a) {
        part.lastAsg = a.id;
        toast('✓ ' + t('as.sent', { n: ids.length }));
        drawPanel();
      }).catch(fail);
    }
    var iv = setInterval(function () {
      if (!part.open) { return; }
      reload(['students', 'assignments']).then(drawPanel).catch(function () {});
    }, 5000);
    cleanup = function () { clearInterval(iv); player.destroy(); document.removeEventListener('fullscreenchange', onFs); if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); } };
    drawPanel();
  }

  // ───────────────────────────── Start ─────────────────────────────
  if (/error_description=/.test(location.hash)) {
    var em = decodeURIComponent((/error_description=([^&]*)/.exec(location.hash) || [])[1] || '').replace(/\+/g, ' ');
    history.replaceState(null, '', location.pathname);
    DB.auth.init().then(function () { showAuth(); authMsg(em, 'bad'); });
  } else {
    DB.auth.init().then(function () { if (!recovering) { return start(); } }).catch(function (e) { showAuth(); authMsg(e.message, 'bad'); });
  }
})();
</script>
