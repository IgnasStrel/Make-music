<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUSICATION — Atspėk natą</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #232347;
      --text: #f3f3fb;
      --soft: #b9b9d6;
      --accent: #7ee8a2;
      --bad: #ff7a7a;
      --border: #3a3a63;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Chewy', cursive; }
    body {
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -10%, #2a2a55, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      gap: 18px;
    }
    .back {
      align-self: flex-start;
      color: var(--soft);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: 0.2s;
    }
    .back:hover { color: var(--text); border-color: var(--soft); }
    h1 { font-size: 26px; font-weight: 700; text-align: center; }
    h1 small { display: block; font-size: 14px; font-weight: 400; color: var(--soft); margin-top: 6px; }

    .scoreboard {
      display: flex;
      gap: 28px;
      font-size: 15px;
      color: var(--soft);
    }
    .scoreboard b { color: var(--text); font-size: 20px; }

    /* The pond where the drop falls */
    .stage {
      position: relative;
      width: min(520px, 92vw);
      height: 320px;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #20406e 0%, #15294a 60%, #0e1d38 100%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.4), 0 8px 30px rgba(0,0,0,0.3);
    }
    .pool {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 46px;
      background: linear-gradient(180deg, rgba(126,232,162,0.20), rgba(60,140,200,0.35));
      border-top: 2px solid rgba(255,255,255,0.18);
    }
    .drop {
      position: absolute;
      top: -36px;
      left: 50%;
      font-size: 30px;
      transform: translate(-50%, 0);
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(150,220,255,0.6));
      pointer-events: none;
    }
    .ripple {
      position: absolute;
      bottom: 30px;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      transform: translate(-50%, 0) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    @keyframes rippleOut {
      0%   { transform: translate(-50%, 0) scale(0);   opacity: 0.9; }
      100% { transform: translate(-50%, 0) scale(6);   opacity: 0; }
    }
    .ripple.go { animation: rippleOut 0.7s ease-out forwards; }

    .hint {
      min-height: 26px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      transition: 0.2s;
    }
    .hint.ok  { color: var(--accent); }
    .hint.no  { color: var(--bad); }

    /* Note keys */
    .keys {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .key {
      min-width: 64px;
      padding: 16px 10px 12px;
      border: none;
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.08s, background 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    }
    .key:hover:not(:disabled) { background: #2c2c5a; }
    .key:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
    .key:disabled { opacity: 0.45; cursor: not-allowed; }
    .key.correct { background: var(--accent); color: #103018; border-color: var(--accent); }
    .key.wrong   { background: var(--bad);    color: #3a0d0d; border-color: var(--bad); }
    .key small { display: block; font-weight: 400; font-size: 11px; color: var(--soft); margin-top: 4px; }
    .key.correct small, .key.wrong small { color: inherit; opacity: 0.75; }

    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary { background: var(--accent); color: #0e2a17; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: transparent; color: var(--soft); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--soft); }
  </style>
</head>
<body>
  <a class="back" href="zaidimai.html">← Atgal į žaidimus</a>

  <h1>💧 Klausos žaidimas
    <small>Krenta lašas, suskamba nata — atspėk ir paspausk teisingą natą</small>
  </h1>

  <div class="scoreboard">
    <div>Taškai: <b id="score">0</b></div>
    <div>Serija: <b id="streak">0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="drop" id="drop">💧</div>
    <div class="ripple" id="ripple"></div>
    <div class="pool"></div>
  </div>

  <div class="hint" id="hint">Paspausk „Pradėti", kad nukristų pirmas lašas</div>

  <div class="keys" id="keys"></div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">▶ Pradėti</button>
    <button class="btn btn-ghost" id="replayBtn" disabled>🔊 Pakartoti garsą</button>
    <button class="btn btn-ghost" id="skipBtn" disabled>⏭ Atskleisti / kita</button>
  </div>

  <script>
    (function () {
      // Solfège notes -> frequencies (C major, 4th octave)
      var NOTES = [
        { name: 'Do',  solf: 'C',  freq: 261.63 },
        { name: 'Re',  solf: 'D',  freq: 293.66 },
        { name: 'Mi',  solf: 'E',  freq: 329.63 },
        { name: 'Fa',  solf: 'F',  freq: 349.23 },
        { name: 'Sol', solf: 'G',  freq: 392.00 },
        { name: 'La',  solf: 'A',  freq: 440.00 },
        { name: 'Si',  solf: 'B',  freq: 493.88 }
      ];

      var scoreEl  = document.getElementById('score');
      var streakEl = document.getElementById('streak');
      var hintEl   = document.getElementById('hint');
      var keysEl   = document.getElementById('keys');
      var dropEl   = document.getElementById('drop');
      var rippleEl = document.getElementById('ripple');
      var stageEl  = document.getElementById('stage');
      var startBtn = document.getElementById('startBtn');
      var replayBtn= document.getElementById('replayBtn');
      var skipBtn  = document.getElementById('skipBtn');

      var score = 0, streak = 0;
      var target = null;       // the note currently being asked
      var canGuess = false;    // true only after the drop has landed
      var audioCtx = null;

      // Build the note buttons
      var keyButtons = {};
      NOTES.forEach(function (n) {
        var b = document.createElement('button');
        b.className = 'key';
        b.disabled = true;
        b.innerHTML = n.name + '<small>' + n.solf + '</small>';
        b.addEventListener('click', function () { guess(n); });
        keysEl.appendChild(b);
        keyButtons[n.name] = b;
      });

      function ensureAudio() {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        return audioCtx;
      }

      // A soft bell-like tone with a quick attack and exponential decay.
      function playNote(freq) {
        var ctx = ensureAudio();
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.35);
      }

      function setHint(text, cls) {
        hintEl.textContent = text;
        hintEl.className = 'hint' + (cls ? ' ' + cls : '');
      }

      function clearKeyStates() {
        NOTES.forEach(function (n) {
          keyButtons[n.name].classList.remove('correct', 'wrong');
        });
      }

      function setKeysEnabled(on) {
        NOTES.forEach(function (n) { keyButtons[n.name].disabled = !on; });
      }

      // Drop one drop, then play the target note when it lands.
      function newRound() {
        clearKeyStates();
        setKeysEnabled(false);
        canGuess = false;
        replayBtn.disabled = true;
        skipBtn.disabled = true;
        target = NOTES[Math.floor(Math.random() * NOTES.length)];
        setHint('Klausyk… 👂', '');

        // Random horizontal landing spot for variety.
        var x = 18 + Math.random() * 64;            // percent
        dropEl.style.left = x + '%';
        rippleEl.style.left = x + '%';
        rippleEl.classList.remove('go');

        var fall = dropEl.animate(
          [
            { transform: 'translate(-50%, 0)',   opacity: 1 },
            { transform: 'translate(-50%, 250px)', opacity: 1, offset: 0.92 },
            { transform: 'translate(-50%, 260px)', opacity: 0 }
          ],
          { duration: 1500, easing: 'cubic-bezier(.5,0,.9,.35)', fill: 'forwards' }
        );
        fall.onfinish = function () {
          // splash + sound
          void rippleEl.offsetWidth;            // restart animation
          rippleEl.classList.add('go');
          playNote(target.freq);
          canGuess = true;
          setKeysEnabled(true);
          replayBtn.disabled = false;
          skipBtn.disabled = false;
          setHint('Kokia tai nata? Paspausk.', '');
        };
      }

      function guess(note) {
        if (!canGuess) return;
        playNote(note.freq);             // let the player hear what they pressed
        if (note.name === target.name) {
          canGuess = false;
          setKeysEnabled(false);
          keyButtons[note.name].classList.add('correct');
          score++; streak++;
          scoreEl.textContent = score;
          streakEl.textContent = streak;
          setHint('✅ Teisingai! Tai buvo ' + target.name + ' (' + target.solf + ')', 'ok');
          setTimeout(newRound, 1400);
        } else {
          streak = 0; streakEl.textContent = streak;
          keyButtons[note.name].classList.add('wrong');
          setHint('❌ Ne tas garsas — pabandyk dar', 'no');
          setTimeout(function () { keyButtons[note.name].classList.remove('wrong'); }, 500);
        }
      }

      function reveal() {
        if (!target) return;
        canGuess = false;
        setKeysEnabled(false);
        keyButtons[target.name].classList.add('correct');
        streak = 0; streakEl.textContent = streak;
        setHint('Tai buvo ' + target.name + ' (' + target.solf + ')', '');
        setTimeout(newRound, 1400);
      }

      startBtn.addEventListener('click', function () {
        ensureAudio();
        startBtn.textContent = '▶ Iš naujo';
        newRound();
      });
      replayBtn.addEventListener('click', function () {
        if (target) playNote(target.freq);
      });
      skipBtn.addEventListener('click', reveal);
    })();
  </script>
  <script src="seasonBg.js"></script>
</body>
</html>
