<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MUSICATION — Muzikinės ištraukos</title>
<script src="auth.js"></script>
<script>var SESSION = MusicationAuth.requireLogin();</script>
<link rel="stylesheet" href="../styles/pages.css">
<style>
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .tempo { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 6px 16px; box-shadow: 0 4px 0 rgba(0,0,0,0.08); font-weight: 700; }
  .tempo input { width: 160px; accent-color: var(--teal); }

  .meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: start; }
  .meter-col { background: #fff; border-radius: 26px; overflow: hidden; box-shadow: 0 6px 24px rgba(35,38,74,0.08); }
  .meter-head { background: var(--c); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
  /* The metre written the way it is on a staff: two stacked numbers. */
  .meter-sig { display: flex; flex-direction: column; align-items: center; font-size: 30px; font-weight: 800; line-height: 0.85; font-family: Georgia, 'Times New Roman', serif; }
  .meter-name { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .meter-name small { display: block; font-size: 14px; font-weight: 600; opacity: 0.9; }
  .meter-list { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 80px; }

  .ex {
    display: flex; align-items: center; gap: 12px;
    background: color-mix(in srgb, var(--c) 9%, #fff);
    border-radius: 18px; padding: 10px 12px;
    border: 2px solid transparent; transition: border-color 0.15s;
  }
  .ex.playing { border-color: var(--c); }
  .ex-ico { font-size: 30px; width: 44px; text-align: center; flex: none; }
  .ex.playing .ex-ico { animation: picBounce 0.9s ease infinite; }
  .ex-text { flex: 1; min-width: 0; }
  .ex-title { font-weight: 800; font-size: 17px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-kind { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .ex .btn-icon.loop.on { background: var(--c); color: #fff; }

  @media (max-width: 980px) { .meters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="btn" id="backBtn">← Atgal</button>
    <h1><span class="h-ico">🎼</span> Muzikinės ištraukos</h1>
    <div class="grow"></div>
    <button class="btn btn-pink" id="uploadBtn" hidden>➕ Įkelti savo įrašą</button>
  </div>

  <div class="toolbar">
    <div class="tempo">🐢 <input type="range" id="tempo" min="0.6" max="1.4" step="0.05" value="1"> 🐇 <span id="tempoVal">100%</span></div>
    <span class="muted">Paleisk ištrauką ir grok ar plok kartu savo sukurtą ritmą ar melodiją. 🔁 – groti be pabaigos.</span>
  </div>

  <div class="meters" id="meters"></div>
</div>

<!-- Upload dialog -->
<div class="overlay" id="upOverlay" hidden>
  <div class="modal" style="--mc: var(--pink); max-width: 480px;">
    <div class="modal-head"><h2>🎧 Naujas įrašas</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <label class="field"><span>Garso failas (mp3, wav, ogg, m4a)</span>
        <input class="input" type="file" id="upFile" accept="audio/*">
      </label>
      <label class="field"><span>Pavadinimas</span>
        <input class="input" type="text" id="upTitle" placeholder="pvz. Polka su akordeonu">
      </label>
      <div class="field"><span>Metras</span>
        <div class="pick-row" id="upMeter"></div>
      </div>
      <p class="muted" id="upError" hidden></p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>Atšaukti</button>
      <button class="btn btn-pink" id="upSave">💾 Išsaugoti</button>
    </div>
  </div>
</div>

<script src="excerpts.js"></script>
<script>
(function () {
  'use strict';
  var EX = window.MusicationExcerpts;
  var TEACHER = SESSION && SESSION.role === 'teacher';
  var METER_INFO = {
    '2/4': { color: '#009D9D', name: 'Dviejų dalių', sub: 'maršai, polkos' },
    '3/4': { color: '#D11264', name: 'Trijų dalių',  sub: 'valsai, lopšinės' },
    '4/4': { color: '#56317D', name: 'Keturių dalių', sub: 'dainelės, rokas' }
  };

  var tempoEl = document.getElementById('tempo');
  var tempoVal = document.getElementById('tempoVal');
  var loopOn = {};

  document.getElementById('backBtn').addEventListener('click', function () {
    if (document.referrer && document.referrer.indexOf(location.origin) === 0) { history.back(); }
    else { location.href = 'rasymas.html'; }
  });

  tempoEl.addEventListener('input', function () {
    tempoVal.textContent = Math.round(tempoEl.value * 100) + '%';
  });

  function sig(meter) {
    var p = meter.split('/');
    return '<span class="meter-sig"><span>' + p[0] + '</span><span>' + p[1] + '</span></span>';
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render() {
    EX.all().then(function (items) {
      var box = document.getElementById('meters');
      box.innerHTML = '';
      EX.METERS.forEach(function (m) {
        var info = METER_INFO[m];
        var col = document.createElement('section');
        col.className = 'meter-col';
        col.style.setProperty('--c', info.color);
        col.innerHTML = '<div class="meter-head">' + sig(m) +
          '<div class="meter-name">' + m + ' · ' + info.name + '<small>' + info.sub + '</small></div></div>' +
          '<div class="meter-list"></div>';
        var list = col.querySelector('.meter-list');
        items.filter(function (it) { return it.meter === m; }).forEach(function (it) {
          var row = document.createElement('div');
          row.className = 'ex';
          row.dataset.id = it.id;
          row.innerHTML =
            '<span class="ex-ico">' + EX.KIND_ICON[it.kind] + '</span>' +
            '<div class="ex-text"><div class="ex-title">' + esc(it.title) + '</div>' +
            '<div class="ex-kind">' + EX.KIND_NAME[it.kind] + '</div></div>' +
            '<button class="btn btn-icon loop' + (loopOn[it.id] ? ' on' : '') + '" title="Groti be pabaigos">🔁</button>' +
            '<button class="btn btn-icon play" title="Groti">▶️</button>' +
            (TEACHER && it.kind === 'irasas' ? '<button class="btn btn-icon del" title="Ištrinti">🗑️</button>' : '');
          row.querySelector('.play').addEventListener('click', function () {
            if (EX.playingId() === it.id) { EX.stop(); return; }
            EX.play(it, { bpm: it.bpm ? it.bpm * parseFloat(tempoEl.value) : null, loop: !!loopOn[it.id] });
          });
          row.querySelector('.loop').addEventListener('click', function (e) {
            loopOn[it.id] = !loopOn[it.id];
            e.currentTarget.classList.toggle('on', loopOn[it.id]);
          });
          var del = row.querySelector('.del');
          if (del) {
            del.addEventListener('click', function () {
              if (confirm('Ištrinti įrašą „' + it.title + '“?')) { EX.removeUpload(it.id).then(render); }
            });
          }
          list.appendChild(row);
        });
        box.appendChild(col);
      });
      showPlaying(EX.playingId());
    });
  }

  function showPlaying(id) {
    document.querySelectorAll('.ex').forEach(function (row) {
      var on = row.dataset.id === id;
      row.classList.toggle('playing', on);
      row.querySelector('.play').textContent = on ? '⏹️' : '▶️';
    });
  }
  EX.onChange(showPlaying);

  // ── Upload (teacher only) ──
  var upOverlay = document.getElementById('upOverlay');
  var upMeter = 'none';
  if (TEACHER) { document.getElementById('uploadBtn').hidden = false; }
  var meterRow = document.getElementById('upMeter');
  EX.METERS.forEach(function (m) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.style.fontSize = '18px'; b.style.fontWeight = '800';
    b.textContent = m;
    b.addEventListener('click', function () {
      upMeter = m;
      meterRow.querySelectorAll('.pick').forEach(function (x) { x.classList.toggle('sel', x === b); });
    });
    meterRow.appendChild(b);
  });
  document.getElementById('uploadBtn').addEventListener('click', function () {
    document.getElementById('upFile').value = '';
    document.getElementById('upTitle').value = '';
    document.getElementById('upError').hidden = true;
    upMeter = 'none';
    meterRow.querySelectorAll('.pick').forEach(function (x) { x.classList.remove('sel'); });
    upOverlay.hidden = false;
  });
  document.getElementById('upFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    var title = document.getElementById('upTitle');
    if (f && !title.value) { title.value = f.name.replace(/\.[^.]+$/, ''); }
  });
  upOverlay.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { upOverlay.hidden = true; });
  });
  document.getElementById('upSave').addEventListener('click', function () {
    var f = document.getElementById('upFile').files[0];
    var title = document.getElementById('upTitle').value.trim();
    var err = document.getElementById('upError');
    var msg = !f ? 'Pasirink garso failą.' : !title ? 'Įrašyk pavadinimą.' : upMeter === 'none' ? 'Pasirink metrą.' : '';
    if (msg) { err.textContent = '⚠️ ' + msg; err.hidden = false; return; }
    EX.addUpload(f, title, upMeter).then(function () { upOverlay.hidden = true; render(); })
      .catch(function () { err.textContent = '⚠️ Nepavyko išsaugoti įrašo.'; err.hidden = false; });
  });

  render();
})();
</script>
</body>
</html>
