<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MUSICATION — Rašyk natas 🎵</title>
  <script src="auth.js"></script>
  <script>
    // The main screen only opens after logging in on index.html.
    var SESSION = MusicationAuth.requireLogin();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lt-font.css">
  <!-- Shared kids engine (mascot, stars, audio helpers) - loaded before our
       own <style> below so any of its rules our markup happens to share a
       class name with (only .topbar) get cleanly overridden by us. -->
  <link rel="stylesheet" href="../styles/kids.css">
  <style>
    /* kids.css's .topbar sets a max-width meant for its own centered layout;
       neutralize that here so our (different) topbar keeps its own sizing. */
    .topbar { width: auto !important; gap: 0 !important; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }

    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --heading-font: 'Baloo 2', var(--font);
      --ink: #1f2430;
      --ink-soft: #626b7a;
      --accent: #2f6fed;
      --accent-dark: #1d4fc4;
      --panel: rgba(255,255,255,0.97);
      --panel-border: rgba(15,23,42,0.1);
      /* Plain, solid panel colours - easy to re-tint by eye. --glass is the
         everyday chrome background (a whisper of blue), --glass-strong is
         pure white for surfaces (like the staff) that need to stay crisp. */
      --glass: #f7f9fc;
      --glass-strong: #ffffff;
      --glass-border: var(--panel-border);
    }

    body {
      font-family: var(--font);
      background: #222;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
      /* kids.css (loaded above for the mascot) sets its own body padding/gap
         meant for its centered-column layout - reset those back to ours. */
      padding: 0; gap: 0;
    }

    /* ── Page shell ── */
    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: 2000px;
      padding: 8px 10px 170px;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 100vh;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .topbar-brand { display: flex; align-items: center; gap: 22px; }
    .topbar-logo { display: block; height: 100px; width: auto; }
    /* The level (I / II / III) chosen on the login screen, next to the logo. */
    .topbar-level {
      font-family: var(--heading-font); font-weight: 800; line-height: 1;
      font-size: 84px; color: #012A5F; letter-spacing: 4px;
      padding-top: 6px;
    }
    .back-link {
      text-decoration: none; color: var(--ink);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px; padding: 8px 16px;
      font-size: 15px; font-weight: 700; font-family: var(--heading-font);
      box-shadow: 0 2px 8px rgba(15,23,42,0.10);
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, transform 0.12s;
    }
    .back-link:hover { background: var(--glass-strong); box-shadow: 0 4px 14px rgba(15,23,42,0.16); transform: translateY(-1px); }

    /* ── Main area: just the center content ── */
    .main-area {
      display: flex; gap: 12px; align-items: flex-start; flex: 1;
      /* 1840px is the layout on a full-HD (1920px) screen; max-width keeps
         the right-hand buttons on screen when the window is narrower. */
      width: 1840px; max-width: 100%;
      padding-left: 200px; /* leave room for fixed left circles */
    }

    /* ── Left column: 4 settings circles — fixed to left edge of screen ── */
    .left-col {
      position: fixed;
      left: 55px;
      top: 40%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 16px;
      z-index: 200;
    }

    .circle-wrap { position: relative; }

    /* Shared kid-button shape as .play-btn on judek.html: a white pill with a
       3D bottom edge, lifting on hover and pressing down on click. */
    .scircle, .nav-card-head, .nav-btn, .pop-btn {
      border: none; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      background: #fff; color: #16401a;
      font-family: inherit; font-weight: 800;
      box-shadow: 0 6px 0 rgba(0,0,0,0.16), 0 10px 18px rgba(0,0,0,0.14);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .scircle:hover, .nav-card-head:hover, .nav-btn:hover, .pop-btn:hover { transform: translateY(-2px); }
    .scircle:active, .nav-card-head:active, .nav-btn:active, .pop-btn:active {
      transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.16);
    }

    /* Emoji only, no words (the name is still there as a tooltip and for
       screen readers), so the circle can be a bit smaller than before and
       all six fit on a small laptop screen without touching the top bar. */
    .scircle {
      width: 88px; height: 88px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .scircle .ico { font-size: 46px; line-height: 1; display: inline-block; }
    /* Playful touch: the icon wiggles when the pointer is over its button. */
    @keyframes iconWiggle {
      0%, 100% { transform: rotate(0) scale(1); }
      25% { transform: rotate(-14deg) scale(1.12); }
      50% { transform: rotate(10deg) scale(1.12); }
      75% { transform: rotate(-6deg) scale(1.06); }
    }
    .scircle:hover .ico, .nav-card-head:hover .nch-ico { animation: iconWiggle 0.6s ease-in-out; }
    .scircle.open {
      box-shadow: 0 0 0 4px #8ee38a, 0 6px 0 rgba(0,0,0,0.16), 0 10px 18px rgba(0,0,0,0.14);
    }

    /* Popup opens to the RIGHT of the circle */
    .popup {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%; transform: translateY(-50%);
      background: #f6fdf3;
      border-radius: 22px; padding: 12px;
      z-index: 300;
      box-shadow: 0 0 0 6px rgba(142,227,138,0.3), 0 18px 40px rgba(15,23,42,0.22);
      transform-origin: left center;
      display: none; flex-direction: column; gap: 5px;
      min-width: 190px;
      white-space: nowrap;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    @keyframes popIn {
      from { opacity: 0; scale: 0.9; }
      to   { opacity: 1; scale: 1; }
    }
    .popup.open { display: flex; animation: popIn 0.25s cubic-bezier(.34,1.56,.64,1) both; }
    .pop-title {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 10px 16px; margin-bottom: 6px; border-radius: 14px;
      background:
        repeating-linear-gradient(to bottom, transparent 0 7px, rgba(255,255,255,0.22) 7px 8px),
        linear-gradient(135deg, #5cc85a, #3fa83e);
      color: #fff; text-shadow: 0 2px 0 rgba(22,64,26,0.25);
      font-family: var(--heading-font); font-size: 22px; font-weight: 800;
      box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    }
    .pop-title::before, .pop-title::after { font-size: 26px; line-height: 1; }
    .pop-title::before { content: '♪'; }
    .pop-title::after { content: '♫'; }
    .pop-btn {
      border-radius: 999px; padding: 12px 22px;
      font-family: var(--font); font-size: 18px; font-weight: 700;
      text-align: left; white-space: nowrap;
    }
    .pop-btn.sel { box-shadow: 0 0 0 3px #fff, 0 0 0 5px #3fa83e, 0 6px 0 rgba(0,0,0,0.16); }
    #pop-sound.open { display: grid; grid-template-columns: repeat(2, max-content); gap: 6px 14px; }
    #pop-sound .pop-title { grid-column: 1 / -1; }
    .snd-col { display: flex; flex-direction: column; gap: 8px; }
    .snd-head { font-family: var(--heading-font); font-size: 17px; font-weight: 800; color: #4a6a4a; text-align: center; padding: 2px 0; }

    /* ── Lesson library modal ── */
    .lib-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(15,23,42,0.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .lib-overlay[hidden] { display: none; }
    .lib-modal {
      background: #f1fbef; border: 2px solid #8ee38a; border-radius: 18px; padding: 20px;
      width: 100%; max-width: 420px; max-height: 80vh;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(15,23,42,0.35);
      font-family: var(--font);
    }
    .lib-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 17px; font-weight: 700; color: var(--ink);
    }
    .lib-close {
      border: none; background: transparent; font-size: 22px; line-height: 1;
      color: var(--ink-soft); cursor: pointer;
    }
    .lib-close:hover { color: var(--accent-dark); }
    .lib-search {
      border: 1.5px solid var(--panel-border); border-radius: 10px;
      padding: 9px 12px; font-family: var(--font); font-size: 14px;
    }
    .lib-search:focus { outline: none; border-color: var(--accent); }
    .lib-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    /* ── Info popup (Nustatymai / Reikšmės / Kita) ── */
    #infoOverlay .lib-modal { padding: 22px 24px 16px; gap: 14px; border-radius: 24px; }
    #infoOverlay .lib-modal-head { font-family: var(--heading-font); font-size: 24px; font-weight: 800; color: #16401a; }
    #infoOverlay .lib-close {
      width: 40px; height: 40px; border-radius: 50%; flex: none;
      background: #fff; color: #16401a; font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 0 rgba(0,0,0,0.14);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #infoOverlay .lib-close:hover { transform: translateY(-2px); color: #16401a; }
    #infoOverlay .lib-close:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.14); }
    /* The body scrolls when it is long, and a scrolling box clips whatever
       sticks out of it - the padding (cancelled by the negative side margin)
       leaves room for the buttons' shadows and green "selected" ring. */
    #infoBody {
      font-family: var(--font); font-size: 14px; color: var(--ink);
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
      padding: 6px 8px 14px; margin: 0 -8px;
    }

    /* Settings popup content */
    .set-wrap { display: flex; flex-direction: column; gap: 18px; }
    .set-section { display: flex; flex-direction: column; gap: 8px; }
    .set-label { font-family: var(--heading-font); font-size: 16px; font-weight: 800; color: #4a6a4a; }
    .set-card {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border-radius: 18px; padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.08);
    }
    .set-avatar { font-size: 36px; line-height: 1; flex: none; }
    .set-name { flex: 1; min-width: 0; font-family: var(--heading-font); font-size: 21px; font-weight: 800; color: #16401a; }
    .set-logout.pop-btn { flex: none; font-size: 16px; padding: 10px 18px; background: #fff0eb; color: #b3361c; }
    .set-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .set-choice .pop-btn { text-align: center; font-size: 17px; padding: 13px 10px; }
    .set-choice .pop-btn.sel { background: #dff7dc; }
    .lib-empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 16px 0; }
    .lib-row {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 12px;
    }
    .lib-row-info { flex: 1; min-width: 0; }
    .lib-row-title { font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lib-row-date { font-size: 12px; color: var(--ink-soft); }
    .lib-row-btn {
      border: none; border-radius: 7px; padding: 7px 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: var(--font);
    }
    .lib-row-open { background: rgba(47,111,237,0.12); color: var(--accent-dark); }
    .lib-row-open:hover { background: rgba(47,111,237,0.2); }
    .lib-row-del { background: rgba(192,57,43,0.10); color: #c0392b; }
    .lib-row-del:hover { background: rgba(192,57,43,0.18); }

    /* ── Center column: note-bar + staff ── */
    .center-col {
      flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    }

    /* Note type bar */
    .note-bar {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 6px 10px;
      display: flex; gap: 2px; align-items: center; justify-content: center;
      box-shadow: 0 3px 14px rgba(15,23,42,0.10); flex-wrap: wrap; row-gap: 2px;
      /* Above the staff panels, so the Metras / Tonacija menus that drop
         down from here are not hidden under the staff lines. */
      position: relative; z-index: 20;
    }
    /* Drop-down menus of the Metras / Tonacija buttons. */
    .nbar-wrap { position: relative; display: flex; }
    .nbar-menu {
      position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: #f6fdf3; border-radius: 18px; padding: 10px; z-index: 400;
      box-shadow: 0 0 0 6px rgba(142,227,138,0.3), 0 18px 40px rgba(15,23,42,0.22);
      display: none; flex-direction: column; gap: 6px; white-space: nowrap;
    }
    .nbar-menu.open { display: flex; animation: popIn 0.2s cubic-bezier(.34,1.56,.64,1) both; }
    .nbar-menu .pop-btn { font-size: 16px; padding: 9px 16px; }
    #meterMenu .pop-btn { text-align: center; }
    #meterMenu .pop-btn[data-meter]:not([data-meter=""]) { font-size: 22px; font-weight: 800; }
    /* "Groti kartu" (play along with a music excerpt): its list opens upwards. */
    .along-wrap { position: relative; }
    .sbtn-along { --sbtn-color: #29b6f6; --sbtn-shadow: #0288d1; --sbtn-fill: #e6f6ff; }
    .sbtn-along.on { --sbtn-fill: #29b6f6; }
    .along-menu {
      position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%);
      background: #f6fdf3; border-radius: 18px; padding: 10px; z-index: 400;
      box-shadow: 0 0 0 6px rgba(142,227,138,0.3), 0 18px 40px rgba(15,23,42,0.22);
      display: none; flex-direction: column; gap: 5px; white-space: nowrap;
      max-height: 60vh; overflow-y: auto; min-width: 250px;
    }
    .along-menu.open { display: flex; }
    .along-menu .pop-btn { font-size: 16px; padding: 8px 14px; }
    .along-menu .am-head { font-family: var(--heading-font); font-weight: 800; color: #4a6a4a; font-size: 15px; padding: 2px 6px; }
    .nbar-btn {
      min-width: 39px; height: 54px;
      border: 1px solid transparent; background: transparent;
      border-radius: 6px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      padding: 0 4px;
      transition: background 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .nbar-btn:hover { background: rgba(15,23,42,0.05); }
    .nbar-btn.active { border-color: var(--accent); background: rgba(47,111,237,0.12); }
    .nbar-btn .nl { font-size: 10px; font-weight: 600; color: var(--ink-soft); font-family: var(--font); }
    /* Icon-only note/rest/accidental glyphs (spec: "aiškios ikonos be žodžių") */
    .glyph-serif { font-family:serif; font-size:28px; line-height:1.1; display:block; }
    /* Every note / rest / accidental icon is drawn in the same 40x48 box,
       so they all come out the same size and line up. */
    .nbar-ico { width: 32px; height: 38px; display: block; }
    /* Markings keep an icon + the music term (spec's explicit exception), so
       they need a bit more room than the icon-only buttons. */
    .nbar-mark { min-width: 52px; }
    /* MUSICATION I: double sharp / double flat are beyond kindergarten, and
       leaving them out keeps the whole bar on one line. */
    body.kids .nbar-btn[data-acc="doublesharp"], body.kids .nbar-btn[data-acc="doubleflat"] { display: none; }
    .nbar-mark .nl { font-size: 9.5px; }
    .nbar-btn.active .nl { color: var(--accent-dark); }
    .nbar-sep { width: 1px; height: 36px; background: rgba(15,23,42,0.10); margin: 0 2px; flex-shrink: 0; }

    /* Staff panel */
    .staff-panel {
      /* Kept nearly-opaque (unlike the glass chrome elsewhere) so the
         written notes always stay crisp and readable over any background. */
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 16px 20px 14px;
      box-shadow: 0 6px 24px rgba(15,23,42,0.14);
      overflow-x: auto;
    }
    /* SVG is vector, so scaling it up to fill the wider page stays crisp (HD)
       instead of stretching a raster image - the viewBox keeps everything
       (staff, clef, notes) proportional at any size. */
    /* aspect-ratio follows the viewBox width, which the script sets. */
    #staffSvg, #staffSvg2 { display: block; width: 100%; height: auto; aspect-ratio: 1280 / 130; min-width: 900px; }
    .staff-panel[hidden] { display: none; }
    /* MUSICATION I draws the staff bigger. On shorter screens two of them
       (plus the buttons under them) must still fit above the piano, so the
       staff may get a little smaller there; it stays centred in its panel. */
    body.kids #staffSvg, body.kids #staffSvg2 { max-height: max(110px, calc((100vh - 613px) / 2)); }
    /* Staff actions: big, round, emoji-only buttons — no words, so children
       who cannot read yet can use them. Each one has its own colour, set
       through --sbtn-color (ring + fill tint) and --sbtn-shadow (the chunky
       "3D" edge that squashes when the button is pressed). */
    .staff-actions { display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 12px; padding-bottom: 8px; }
    .sbtn {
      width: 68px; height: 68px; padding: 0; flex: none;
      border: 4px solid var(--sbtn-color); border-radius: 50%;
      background: var(--sbtn-fill, #fff); cursor: pointer;
      font-size: 34px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 0 var(--sbtn-shadow), 0 10px 16px rgba(0,0,0,0.16);
      transition: transform 0.12s, box-shadow 0.12s;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .sbtn:hover { transform: translateY(-3px) scale(1.06); }
    .sbtn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 2px 0 var(--sbtn-shadow), 0 4px 8px rgba(0,0,0,0.16); }
    .sbtn:focus-visible { outline: 4px solid rgba(47,111,237,0.55); outline-offset: 3px; }
    /* Play is the main action, so it is the biggest. */
    .sbtn-play  { --sbtn-color: #5cc85a; --sbtn-shadow: #3d9a3b; --sbtn-fill: #eaffe8; width: 84px; height: 84px; font-size: 42px; }
    .sbtn-stop  { --sbtn-color: #ff7a59; --sbtn-shadow: #d4532f; --sbtn-fill: #fff0eb; }
    .sbtn-del   { --sbtn-color: #ffb300; --sbtn-shadow: #d18f00; --sbtn-fill: #fff8e1; }
    .sbtn-clear { --sbtn-color: #b388ff; --sbtn-shadow: #8457d6; --sbtn-fill: #f4eeff; }
    /* Page (lapas) turning: sits at the right end of the action row so the
       main buttons stay centred. ➡ pulses when the page is full. */
    .staff-actions { position: relative; }
    .page-nav { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 10px; }
    .sbtn-page { --sbtn-color: #29b6f6; --sbtn-shadow: #0288d1; --sbtn-fill: #e6f6ff; width: 56px; height: 56px; font-size: 28px; }
    .sbtn[hidden], .page-label[hidden] { display: none; }
    .page-label { font-family: var(--font); font-weight: 700; font-size: 16px; color: var(--ink-soft); min-width: 44px; text-align: center; }
    /* The play-head stick: drag it to another note to play from there. */
    .play-head { cursor: grab; touch-action: none; }
    /* While the music plays, the stick glows and pulses on every note, and
       the little frog sitting in its middle hops onto each note. */
    .play-head .ph-line { filter: drop-shadow(0 0 3px rgba(47,179,74,0.75)); }
    .play-head .ph-frog { transform-box: fill-box; transform-origin: center bottom; }
    .play-head.beat .ph-line { animation: phPulse 0.35s ease-out; }
    .play-head.beat .ph-knob { animation: phKnob 0.35s ease-out; transform-box: fill-box; transform-origin: center; }
    .play-head.hop .ph-frog { animation: frogHop 0.42s cubic-bezier(.3,.7,.4,1); }
    @keyframes phPulse {
      0%   { stroke-width: 9; filter: drop-shadow(0 0 10px rgba(47,179,74,1)); }
      100% { stroke-width: 4; filter: drop-shadow(0 0 3px rgba(47,179,74,0.75)); }
    }
    @keyframes phKnob { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
    @keyframes frogHop {
      0%   { transform: translateY(0) scale(1.15, 0.85); }
      35%  { transform: translateY(-22px) scale(0.92, 1.1) rotate(-8deg); }
      70%  { transform: translateY(0) scale(1.12, 0.88); }
      100% { transform: translateY(0) scale(1, 1); }
    }
    body.dragging-stick, body.dragging-stick * { cursor: grabbing !important; user-select: none; }
    .sbtn-page.pulse { animation: page-pulse 1.1s ease-in-out infinite; }
    /* Page turn: "next" pivots on the left edge (like turning a book page
       forward), "prev" on the right. 300ms out + 300ms in, see goToPage(). */
    .staff-panel.flipping { overflow: hidden; }
    .flip-out-next, .flip-in-next { transform-origin: left center; }
    .flip-out-prev, .flip-in-prev { transform-origin: right center; }
    .flip-out-next { animation: flip-out-next .3s ease-in forwards; }
    .flip-in-next  { animation: flip-in-next  .3s ease-out forwards; }
    .flip-out-prev { animation: flip-out-prev .3s ease-in forwards; }
    .flip-in-prev  { animation: flip-in-prev  .3s ease-out forwards; }
    @keyframes flip-out-next { from { transform: perspective(1600px) rotateY(0); opacity: 1; } to { transform: perspective(1600px) rotateY(-90deg); opacity: .35; } }
    @keyframes flip-in-next  { from { transform: perspective(1600px) rotateY(90deg); opacity: .35; } to { transform: perspective(1600px) rotateY(0); opacity: 1; } }
    @keyframes flip-out-prev { from { transform: perspective(1600px) rotateY(0); opacity: 1; } to { transform: perspective(1600px) rotateY(90deg); opacity: .35; } }
    @keyframes flip-in-prev  { from { transform: perspective(1600px) rotateY(-90deg); opacity: .35; } to { transform: perspective(1600px) rotateY(0); opacity: 1; } }
    @keyframes page-pulse {
      0%, 100% { box-shadow: 0 6px 0 var(--sbtn-shadow), 0 0 0 0 rgba(41,182,246,0.55); }
      50%      { box-shadow: 0 6px 0 var(--sbtn-shadow), 0 0 0 12px rgba(41,182,246,0); }
    }
    /* Short screens (small laptops): the tall piano leaves less room above
       it, so the staff panels and the action buttons tighten up a little
       to stay clear of the keys. */
    @media (max-height: 820px) {
      .page { gap: 6px; }
      .staff-panel { padding: 8px 20px 6px; }
      .staff-actions { gap: 16px; margin-top: 2px; padding-bottom: 6px; }
      .sbtn { width: 56px; height: 56px; font-size: 28px; }
      .sbtn-play { width: 68px; height: 68px; font-size: 34px; }
      .left-col { top: 50%; }
    }
    /* Screens lower than full HD: the 100px logo would push the staff under
       the piano and sit on top of the left-hand buttons, so it is smaller. */
    @media (max-height: 880px) {
      .topbar-logo { height: 56px; }
      .topbar-level { font-size: 47px; padding-top: 3px; }
      /* ...and the "Pamokos" popup has seven buttons: slimmer ones fit
         without scrolling. */
      .lib-modal.sub-modal { max-height: 94vh; }
      .sub-modal .sub-group { gap: 10px; }
      .sub-group .nav-btn { padding: 9px 22px; font-size: 18px; }
    }

    /* ── Piano ── */
    .piano-wrap {
      position: fixed; bottom: 0; left: 27px; right: 0;
      background: transparent; padding: 8px 0 4px;
      display: flex; justify-content: center;
      overflow-x: auto; z-index: 10;
    }
    .piano-inner { position: relative; display: flex; flex-shrink: 0; height: 225px; }

    /* Each white key in its note's colour (--k, the same colours as the
       notes on the staff). */
    .wk {
      --k: #f6f6f2;
      flex-shrink: 0; height: 215px;
      background: linear-gradient(175deg, color-mix(in srgb, var(--k) 70%, #fff) 0%, var(--k) 55%, color-mix(in srgb, var(--k) 82%, #000) 100%);
      border: 1px solid color-mix(in srgb, var(--k) 65%, #000); border-radius: 0 0 8px 8px;
      cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 5px;
      font-size: 10px; font-weight: 700; color: #bbb; font-family: var(--font);
      user-select: none; transition: filter 0.06s, transform 0.07s, box-shadow 0.06s;
      transform-origin: top center;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,0.35), 2px 4px 8px rgba(0,0,0,0.28);
      -webkit-tap-highlight-color: transparent;
    }
    .wk:active, .wk.lit { filter: brightness(1.18) saturate(1.1); box-shadow: inset 0 -1px 3px rgba(0,0,0,0.15), 0 0 18px var(--k); transform: scaleY(0.97) translateY(2px); }

    .bk {
      position: absolute; top: 0; height: 160px;
      background: linear-gradient(175deg, #3d3d3d 0%, #111 100%);
      border-radius: 0 0 5px 5px;
      cursor: pointer; z-index: 2;
      transition: background 0.06s, transform 0.07s;
      transform-origin: top center;
      box-shadow: 2px 5px 10px rgba(0,0,0,0.5);
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .bk:active, .bk.lit { background: linear-gradient(175deg, #6090cc 0%, #336 100%); transform: scaleY(0.97) translateY(2px); }

    .clef-hover-bg { transition: fill 0.15s; }
    @font-face { font-family: 'Bravura'; src: url('../styles/fonts/Bravura_1.392.woff') format('woff'); font-display: block; }
    .clef-glyph { font-family: 'Bravura'; }
    #clefGroupRow1:hover .clef-hover-bg,
    #clefGroupRow2:hover .clef-hover-bg { fill: rgba(70,142,224,0.15); }

    /* ── Right column: games & other activities ── */
    .right-col {
      width: max-content; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 16px;
      /* room for the buttons' hover lift and 3D shadow inside the scroll box */
      overflow-y: auto; padding: 3px 5px 15px;
      left: 22px; position: relative;
    }
    /* Narrower than full HD there is no spare room on the right, so the
       22px nudge would push these buttons past the edge of the window. */
    @media (max-width: 1880px) {
      .right-col { left: 0; }
    }

    /* Each nav group (Žaidimai / Mokymasis / Pamokos) is its own plain white
       card with a clickable header that expands/collapses its body - a
       smooth, dependency-free "unfold" using the CSS grid-rows trick
       (0fr -> 1fr) instead of a JS height hack or an animation library. */
    .nav-card-head {
      display: flex; align-items: center; justify-content: center;
      width: 88px; height: 88px; padding: 0; border-radius: 50%;
      text-decoration: none;
    }
    .nch-ico { font-size: 46px; line-height: 1; display: inline-block; }
    /* Emoji only: the name stays in the page (it is the tooltip, the
       subcategory popup's heading and what a screen reader says) but is
       not shown on the button. */
    .nch-title {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .sub-modal { max-width: 480px; max-height: 92vh; }
    .sub-modal .lib-modal-head { font-size: 24px; font-family: var(--heading-font); font-weight: 800; color: #16401a; }
    /* Scrolls inside the popup if the buttons do not all fit; the padding
       (cancelled by the negative side margin) keeps their shadows unclipped. */
    .sub-group {
      display: flex; flex-direction: column; gap: 12px;
      overflow-y: auto; min-height: 0; padding: 4px 8px 14px; margin: 0 -8px;
    }
    .sub-group[hidden] { display: none; }

    .nav-btn {
      display: flex; align-items: center; gap: 16px;
      width: 100%; border-radius: 999px; padding: 18px 26px;
      font-family: var(--font); font-size: 21px; font-weight: 700;
      text-decoration: none;
    }
    .nav-btn .nb-ico {
      font-size: 30px; line-height: 1; flex-shrink: 0;
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.45);
    }

    /* ── Motion polish: notes pop in, panels + nav items unfold on load ── */
    @keyframes notePop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .note-pop { transform-box: fill-box; transform-origin: center; animation: notePop 0.28s cubic-bezier(.34,1.56,.64,1); }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes navBtnIn {
      from { opacity: 0; transform: translateX(-10px) scale(0.96); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .note-bar, .staff-panel, .right-col .nav-card-head {
      animation: panelIn 0.4s cubic-bezier(.16,1,.3,1) both;
    }
    .staff-panel:nth-of-type(2) { animation-delay: 0.06s; }
    .right-col .nav-card-head:nth-child(1) { animation-delay: 0.08s; }
    .right-col .nav-card-head:nth-child(2) { animation-delay: 0.14s; }
    .right-col .nav-card-head:nth-child(3) { animation-delay: 0.2s; }
    .sub-group .nav-btn {
      animation: navBtnIn 0.32s cubic-bezier(.16,1,.3,1) both;
    }

    /* Bigger "Fonas" colour orbs inside the left-circle popup, to match the
       enlarged sidebar buttons (scoped to this page only). */
    #pop-bg .bg-orb-row { gap: 10px; }
    #pop-bg .bg-orb { width: 54px; height: 54px; font-size: 24px; }
  </style>
</head>
<body>




<div class="page">
  <div class="topbar">
    <div class="topbar-brand">
      <img class="topbar-logo" src="../uploads/musication-logo.png" alt="MUSICATION">
      <span class="topbar-level" id="topbarLevel">I</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="back-link" id="btnUser" title="Naudotojas">👤 <span id="userModeLabel">Mokytojas</span></button>
    </div>
  </div>

  <div class="main-area">

    <!-- ── Center: note-bar + staff ── -->
    <div class="center-col">

      <!-- Note type bar -->
      <div class="note-bar" id="noteBar">

        <!-- Whole -->
        <button class="nbar-btn" data-type="whole" title="Visa nata">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="20" cy="36" rx="10.5" ry="7" fill="none" stroke="#2b2f45" stroke-width="3.4"/><ellipse cx="20" cy="36" rx="4" ry="5.6" transform="rotate(-35 20 36)" fill="#2b2f45" opacity="0.15"/></svg>
        </button>

        <!-- Half -->
        <button class="nbar-btn" data-type="half" title="Pusinė nata">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="none" stroke="#2b2f45" stroke-width="3"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Dotted half -->
        <button class="nbar-btn" data-type="half-dot" title="Pusinė nata su tašku">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="none" stroke="#2b2f45" stroke-width="3"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="36" r="2.8" fill="#2b2f45"/></svg>
        </button>

        <!-- Quarter (default active) -->
        <button class="nbar-btn active" data-type="quarter" title="Ketvirtinė nata">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="#2b2f45"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Dotted quarter -->
        <button class="nbar-btn" data-type="quarter-dot" title="Ketvirtinė nata su tašku">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="#2b2f45"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="36" r="2.8" fill="#2b2f45"/></svg>
        </button>

        <!-- Eighth -->
        <button class="nbar-btn" data-type="eighth" title="Aštuntinė nata">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="#2b2f45"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 7 C31 11 35 18 30 26" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Dotted eighth -->
        <button class="nbar-btn" data-type="eighth-dot" title="Aštuntinė nata su tašku">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="#2b2f45"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 7 C31 11 35 18 30 26" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="36" r="2.8" fill="#2b2f45"/></svg>
        </button>

        <!-- Sixteenth -->
        <button class="nbar-btn" data-type="sixteenth" title="Šešioliktinė nata">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><ellipse cx="15" cy="37" rx="8.6" ry="6.2" transform="rotate(-22 15 37)" fill="#2b2f45"/><path d="M23 35 V7" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 7 C31 11 35 18 30 26" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M23 15 C31 19 35 26 30 34" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="nbar-sep"></div>

        <!-- Rest whole -->
        <button class="nbar-btn" data-type="rest-whole" title="Visos natos pauzė">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 18 H34" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round"/><rect x="12" y="18" width="16" height="8" rx="1.5" fill="#2b2f45"/></svg>
        </button>

        <!-- Rest half -->
        <button class="nbar-btn" data-type="rest-half" title="Pusinės natos pauzė">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M6 30 H34" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round"/><rect x="12" y="22" width="16" height="8" rx="1.5" fill="#2b2f45"/></svg>
        </button>

        <!-- Rest quarter -->
        <button class="nbar-btn" data-type="rest-quarter" title="Ketvirtinės natos pauzė">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M16 6 L25 16 L18 24 L26 33 C19 30 15 34 21 42" fill="none" stroke="#2b2f45" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Rest eighth -->
        <button class="nbar-btn" data-type="rest-eighth" title="Aštuntinės natos pauzė">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><circle cx="15" cy="15" r="3.8" fill="#2b2f45"/><path d="M15 18 C21 20 26 17 28 12 L19 42" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <!-- Rest sixteenth -->
        <button class="nbar-btn" data-type="rest-sixteenth" title="Šešioliktinės natos pauzė">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><circle cx="17" cy="10" r="3.4" fill="#2b2f45"/><circle cx="13" cy="22" r="3.4" fill="#2b2f45"/><path d="M17 12.5 C22 14 26.5 12 28.5 7 L18 43" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 24.5 C18 26 22.5 24 24.6 19" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="nbar-sep"></div>

        <!-- Sharp -->
        <button class="nbar-btn" data-acc="sharp" title="Diezas (♯)">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M16 7 V43 M24 5 V41" stroke="#2b2f45" stroke-width="2.6" stroke-linecap="round"/><path d="M9 21 L31 15 M9 33 L31 27" stroke="#2b2f45" stroke-width="5" stroke-linecap="round"/></svg>
        </button>

        <!-- Double sharp -->
        <button class="nbar-btn" data-acc="doublesharp" title="Dublis diezas (𝄪)">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M12 16 L28 32 M28 16 L12 32" stroke="#2b2f45" stroke-width="3.6" stroke-linecap="round"/><rect x="9" y="13" width="6" height="6" rx="1.5" fill="#2b2f45"/><rect x="25" y="13" width="6" height="6" rx="1.5" fill="#2b2f45"/><rect x="9" y="29" width="6" height="6" rx="1.5" fill="#2b2f45"/><rect x="25" y="29" width="6" height="6" rx="1.5" fill="#2b2f45"/></svg>
        </button>

        <!-- Flat -->
        <button class="nbar-btn" data-acc="flat" title="Bemolis (♭)">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M15 4 V41" stroke="#2b2f45" stroke-width="3" stroke-linecap="round"/><path d="M15 41 C29 33 30 21 22 21 C18.5 21 16.5 23 15 26" fill="none" stroke="#2b2f45" stroke-width="3.6" stroke-linecap="round"/></svg>
        </button>

        <!-- Double flat -->
        <button class="nbar-btn" data-acc="doubleflat" title="Dublis bemolis (𝄫)">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M8 4 V41 M21 4 V41" stroke="#2b2f45" stroke-width="2.6" stroke-linecap="round"/><path d="M8 41 C17 35 18 25 13 25 C11 25 9.5 26.5 8 29 M21 41 C30 35 31 25 26 25 C24 25 22.5 26.5 21 29" fill="none" stroke="#2b2f45" stroke-width="3.2" stroke-linecap="round"/></svg>
        </button>

        <!-- Natural -->
        <button class="nbar-btn" data-acc="natural" title="Bekaras (♮)">
          <svg class="nbar-ico" viewBox="0 0 40 48" aria-hidden="true"><path d="M14 4 V34 M26 14 V44" stroke="#2b2f45" stroke-width="2.8" stroke-linecap="round"/><path d="M14 20 L26 16.5 M14 32 L26 28.5" stroke="#2b2f45" stroke-width="5" stroke-linecap="round"/></svg>
        </button>

        <div class="nbar-sep"></div>

        <!-- Additional markings - icon + music term, per spec these keep a label -->
        <button class="nbar-btn nbar-mark" data-mark="slur" title="Pridėti prie pažymėtos natos">
          <svg width="30" height="22" viewBox="0 0 30 22"><path d="M2 4 Q15 20 28 4" fill="none" stroke="#333" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span class="nl">Legato</span>
        </button>
        <button class="nbar-btn nbar-mark" data-mark="cresc" title="Pridėti prie pažymėtos natos">
          <svg width="30" height="20" viewBox="0 0 30 20"><path d="M2 10 L26 2 M2 10 L26 18" fill="none" stroke="#333" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span class="nl">Crescendo</span>
        </button>
        <button class="nbar-btn nbar-mark" data-mark="dim" title="Pridėti prie pažymėtos natos">
          <svg width="30" height="20" viewBox="0 0 30 20"><path d="M4 2 L28 10 M4 18 L28 10" fill="none" stroke="#333" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span class="nl">Diminuendo</span>
        </button>

        <div class="nbar-sep"></div>

        <!-- Lyrics/text under a selected note -->
        <button class="nbar-btn" id="btnAddLyric" title="Pridėti tekstą po pažymėta nata">
          <span style="font-family:var(--font);font-weight:800;font-size:20px;line-height:1;">Aa</span>
        </button>

        <div class="nbar-sep"></div>

        <!-- Staff tools: metre, key signature, bar lines, rhythm line -->
        <div class="nbar-wrap">
          <button class="nbar-btn nbar-mark" id="btnMeter" title="Metras – kiek dalių takte">
            <svg width="30" height="26" viewBox="0 0 30 26"><text x="15" y="12" text-anchor="middle" font-family="Georgia,serif" font-weight="800" font-size="13" fill="#333">3</text><text x="15" y="25" text-anchor="middle" font-family="Georgia,serif" font-weight="800" font-size="13" fill="#333">4</text></svg>
            <span class="nl">Metras</span>
          </button>
          <div class="nbar-menu" id="meterMenu">
            <button class="pop-btn" data-meter="">Be metro</button>
            <button class="pop-btn" data-meter="2/4">2/4</button>
            <button class="pop-btn" data-meter="3/4">3/4</button>
            <button class="pop-btn" data-meter="4/4">4/4</button>
          </div>
        </div>
        <div class="nbar-wrap">
          <button class="nbar-btn nbar-mark" id="btnKey" title="Tonacija – diezai ar bemoliai prie rakto">
            <svg width="30" height="26" viewBox="0 0 30 26"><path d="M1 6 H29 M1 13 H29 M1 20 H29" stroke="#999" stroke-width="1.4"/><text x="10" y="19" text-anchor="middle" font-family="serif" font-size="17" fill="#333">♯</text><text x="21" y="17" text-anchor="middle" font-family="serif" font-size="17" fill="#333">♭</text></svg>
            <span class="nl">Tonacija</span>
          </button>
          <div class="nbar-menu" id="keyMenu">
            <button class="pop-btn" data-key="0">C-dur / a-moll · be ženklų</button>
            <button class="pop-btn" data-key="1">G-dur / e-moll · 1 ♯</button>
            <button class="pop-btn" data-key="2">D-dur / h-moll · 2 ♯</button>
            <button class="pop-btn" data-key="-1">F-dur / d-moll · 1 ♭</button>
            <button class="pop-btn" data-key="-2">B-dur / g-moll · 2 ♭</button>
          </div>
        </div>
        <button class="nbar-btn nbar-mark" id="btnBars" title="Taktai – takto brūkšniai pagal metrą">
          <svg width="30" height="26" viewBox="0 0 30 26"><path d="M1 5 H29 M1 10 H29 M1 15 H29 M1 20 H29" stroke="#999" stroke-width="1.2"/><path d="M10 5 V20 M21 5 V20" stroke="#333" stroke-width="2.4"/></svg>
          <span class="nl">Taktai</span>
        </button>
        <button class="nbar-btn nbar-mark" id="btnRhythmLine" title="Ritmo linija – tik ritmas, be natų aukščio">
          <svg width="30" height="26" viewBox="0 0 30 26"><path d="M1 19 H29" stroke="#333" stroke-width="1.8"/><ellipse cx="7" cy="19" rx="3.6" ry="2.6" fill="#333"/><path d="M10.3 18 V5" stroke="#333" stroke-width="1.8"/><ellipse cx="17" cy="19" rx="3.6" ry="2.6" fill="#333"/><ellipse cx="25" cy="19" rx="3.6" ry="2.6" fill="#333"/><path d="M20.3 18 V5 M28.3 18 V5 M20.3 5.9 H28.3" stroke="#333" stroke-width="1.8"/></svg>
          <span class="nl">Ritmo linija</span>
        </button>

      </div><!-- /note-bar -->

      <!-- Staff row 1 -->

<script>
(function () {
  'use strict';
  var K = window.Kids;

  // Level chosen on the login screen. MUSICATION I is for kindergarten
  // children: bigger staff and notes, one staff at a time, a c-c2 keyboard
  // with c1 in the middle.
  var LEVEL     = (SESSION && SESSION.level) || 'I';
  var KIDS_MODE = LEVEL === 'I';
  var TREBLE_OCTAVES = KIDS_MODE ? [3, 4] : [3, 4, 5];

  // ── Audio context ────────────────────────────────────────────────────────────
  var PIANO_CTX  = null;
  var PIANO_COMP = null;
  var MASTER_GAIN = null;
  var VOLUME_LEVEL = 0.85; // 0..1, controlled by the "Garsumas" circle

  function getCtx() {
    if (!PIANO_CTX) {
      PIANO_CTX = new (window.AudioContext || window.webkitAudioContext)();
      PIANO_COMP = PIANO_CTX.createDynamicsCompressor();
      PIANO_COMP.threshold.value = -14;
      PIANO_COMP.knee.value      = 6;
      PIANO_COMP.ratio.value     = 4;
      PIANO_COMP.attack.value    = 0.003;
      PIANO_COMP.release.value   = 0.22;
      MASTER_GAIN = PIANO_CTX.createGain();
      MASTER_GAIN.gain.value = VOLUME_LEVEL;
      PIANO_COMP.connect(MASTER_GAIN);
      MASTER_GAIN.connect(PIANO_CTX.destination);
    }
    return PIANO_CTX;
  }

  var PIANO_FREQ = {
    'C2': 65.41,'Cs2': 69.30,'D2': 73.42,'Ds2': 77.78,'E2': 82.41,
    'F2': 87.31,'Fs2': 92.50,'G2': 98.00,'Gs2':103.83,'A2':110.00,'As2':116.54,'B2':123.47,
    'C3':130.81,'Cs3':138.59,'D3':146.83,'Ds3':155.56,'E3':164.81,
    'F3':174.61,'Fs3':185.00,'G3':196.00,'Gs3':207.65,'A3':220.00,'As3':233.08,'B3':246.94,
    'C4':261.63,'Cs4':277.18,'D4':293.66,'Ds4':311.13,'E4':329.63,
    'F4':349.23,'Fs4':369.99,'G4':392.00,'Gs4':415.30,'A4':440.00,'As4':466.16,'B4':493.88,
    'C5':523.25,'Cs5':554.37,'D5':587.33,'Ds5':622.25,'E5':659.26,
    'F5':698.46,'Fs5':739.99,'G5':783.99,'Gs5':830.61,'A5':880.00,'As5':932.33,'B5':987.77,
    'C6':1046.50
  };

  var BETA = 0.00018;

  // ── Piano synthesis (realistic) ──────────────────────────────────────────────
  function synthPiano(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var decayScale = Math.max(0.35, 1.0 - (freq - 130.0) / 1800.0);
    var sustainEnd = now + durSecs;
    var releaseEnd = now + durSecs + 0.55 * decayScale;

    var master = ctx.createGain();
    master.gain.setValueAtTime(0.001, now);
    master.gain.linearRampToValueAtTime(0.52, now + 0.006);
    master.gain.exponentialRampToValueAtTime(0.20, now + 0.08);
    master.gain.setValueAtTime(0.20, sustainEnd - 0.01);
    master.gain.exponentialRampToValueAtTime(0.001, releaseEnd);
    master.connect(comp);

    var harms  = [1,    2,    3,    4,    5,    6,    7,    8   ];
    var amps   = [1.00, 0.42, 0.20, 0.11, 0.066,0.038,0.022,0.012];
    var dFracs = [1.00, 0.87, 0.74, 0.62, 0.52, 0.44, 0.37, 0.31];

    harms.forEach(function (h, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * h * Math.sqrt(1.0 + BETA * h * h);
      var t1 = now + (durSecs + 0.6) * dFracs[i] * decayScale;
      g.gain.setValueAtTime(amps[i], now);
      g.gain.exponentialRampToValueAtTime(0.001, t1);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(t1 + 0.05);
    });
  }

  // ── Bowed strings (violin) — sawtooth core, slow bow attack + gentle vibrato ──
  function synthViolin(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var end = now + durSecs;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.34, now + 0.09);
    master.gain.setValueAtTime(0.34, Math.max(now + 0.09, end - 0.05));
    master.gain.exponentialRampToValueAtTime(0.0001, end + 0.12);
    master.connect(comp);

    var vibrato = ctx.createOscillator();
    vibrato.type = 'sine'; vibrato.frequency.value = 5.2;
    var vibGain = ctx.createGain(); vibGain.gain.value = freq * 0.006;
    vibrato.connect(vibGain);
    vibrato.start(now); vibrato.stop(end + 0.15);

    [1, 2, 3, 4, 5].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = freq * h;
      vibGain.connect(osc.frequency);
      g.gain.value = [0.5, 0.24, 0.14, 0.07, 0.04][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(end + 0.15);
    });
  }

  // ── Flute — mostly-sine core with a breath of filtered noise ────────────────
  function synthFlute(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var end = now + durSecs;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
    master.gain.setValueAtTime(0.4, Math.max(now + 0.05, end - 0.04));
    master.gain.exponentialRampToValueAtTime(0.0001, end + 0.08);
    master.connect(comp);

    [1, 2, 3].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq * h;
      g.gain.value = [1.0, 0.16, 0.06][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(end + 0.1);
    });

    var noise = makeNoiseSource(ctx, durSecs + 0.1);
    var breathFilter = ctx.createBiquadFilter();
    breathFilter.type = 'bandpass'; breathFilter.frequency.value = freq * 1.5; breathFilter.Q.value = 0.6;
    var breathGain = ctx.createGain(); breathGain.gain.value = 0.05;
    noise.connect(breathFilter); breathFilter.connect(breathGain); breathGain.connect(master);
    noise.start(now); noise.stop(end + 0.1);
  }

  // ── Shared: a short burst of white noise, as a raw un-gained buffer source ──
  var NOISE_BUFFER = null;
  function makeNoiseSource(ctx, durSecs) {
    if (!NOISE_BUFFER || NOISE_BUFFER.sampleRate !== ctx.sampleRate) {
      var len = ctx.sampleRate * 2;
      NOISE_BUFFER = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = NOISE_BUFFER.getChannelData(0);
      for (var i = 0; i < len; i++) { data[i] = Math.random() * 2 - 1; }
    }
    var src = ctx.createBufferSource();
    src.buffer = NOISE_BUFFER;
    src.loop = true;
    return src;
  }

  // ── Percussion: drum/shaker/triangle are unpitched - they ignore the piano
  // key's frequency and just play their own fixed hit. ───────────────────────
  // Soft-clipping curve for the drum: it adds overtones, so the drum is also
  // heard on small laptop/tablet speakers that cannot play its low thump.
  var DRUM_CURVE = (function () {
    var n = 1024, curve = new Float32Array(n);
    for (var i = 0; i < n; i++) { var x = i * 2 / n - 1; curve[i] = Math.tanh(2.6 * x); }
    return curve;
  })();

  function synthDrum(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var shaper = ctx.createWaveShaper();
    shaper.curve = DRUM_CURVE;
    var master = ctx.createGain();
    master.gain.setValueAtTime(1.0, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
    shaper.connect(master);
    master.connect(comp);

    // Body: a pitch-dropping tone, plus a triangle an octave up for punch.
    [['sine', 230, 72, 1.0], ['triangle', 460, 130, 0.45]].forEach(function (p) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = p[0];
      osc.frequency.setValueAtTime(p[1], now);
      osc.frequency.exponentialRampToValueAtTime(p[2], now + 0.16);
      g.gain.value = p[3];
      osc.connect(g); g.connect(shaper);
      osc.start(now); osc.stop(now + 0.5);
    });

    // Stick attack: a short, bright click of noise.
    var noise = makeNoiseSource(ctx, 0.05);
    var nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 1800; nf.Q.value = 0.8;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.9, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    noise.connect(nf); nf.connect(ng); ng.connect(comp);
    noise.start(now); noise.stop(now + 0.06);
  }

  function synthShaker(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var noise = makeNoiseSource(ctx, 0.14);
    var f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 6500; f.Q.value = 0.7;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.5, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    noise.connect(f); f.connect(g); g.connect(comp);
    noise.start(now); noise.stop(now + 0.15);
  }

  function synthTriangleInst(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.5, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
    master.connect(comp);
    [1, 2.76, 5.4, 8.9].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 2800 * h / 4;
      g.gain.value = [1.0, 0.5, 0.28, 0.12][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + 1.5);
    });
  }

  function playNote(noteName, durSecs) {
    // The rhythm line has no pitch: a melodic instrument becomes the drum.
    var type = (RHYTHM_LINE && !UNPITCHED[SOUND_TYPE]) ? 'drums' : SOUND_TYPE;
    var freq = PIANO_FREQ[noteName];
    if (!freq && !UNPITCHED[type]) { return; }
    var ctx = getCtx();
    if (ctx.state !== 'running') { ctx.resume(); }
    switch (type) {
      case 'violin':   synthViolin(freq, durSecs, ctx, PIANO_COMP); break;
      case 'flute':    synthFlute(freq, durSecs, ctx, PIANO_COMP); break;
      case 'drums':    synthDrum(durSecs, ctx, PIANO_COMP); break;
      case 'shaker':   synthShaker(durSecs, ctx, PIANO_COMP); break;

    var h = pop.offsetHeight;

    var shift = 0;
    if (center - h / 2 < 16) { shift = 16 - (center - h / 2); }
    else if (center + h / 2 > window.innerHeight - 16) { shift = window.innerHeight - 16 - (center + h / 2); }

  // ── Accidentals ──────────────────────────────────────────────────────────────
  // Semitone-based so all 5 accidentals (sharp/double-sharp/flat/double-flat/
  // natural) resolve to the correct pitch, including wrapping into the next
  // or previous octave (e.g. B double-sharp -> Cs one octave up).
  var selectedAccidental = null;
  var LETTER_SEMI = { 'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11 };
  var SEMI_NAME   = ['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
  var ACC_OFFSET  = { sharp:1, doublesharp:2, flat:-1, doubleflat:-2, natural:0 };
  var ACC_GLYPH   = { sharp:'♯', doublesharp:'𝄪', flat:'♭', doubleflat:'𝄫', natural:'♮' };

  function getPlayNote(noteName, acc) {
    if (!acc || !noteName) { return noteName; }
    var off = ACC_OFFSET[acc] || 0;
    if (!off) { return noteName; }
    var letter = noteName.charAt(0);
    var oct = parseInt(noteName.slice(1), 10);
    var semi = LETTER_SEMI[letter] + off;
    while (semi < 0) { semi += 12; oct -= 1; }
    while (semi > 11) { semi -= 12; oct += 1; }
    return SEMI_NAME[semi] + oct;
  }

  // The pitch a written note sounds at: its own accidental first (a natural
  // cancels the key), otherwise the key signature's sharp / flat.
  function soundingNote(n) {
    if (RHYTHM_LINE || !n.note) { return n.note; }
    if (n.acc) { return getPlayNote(n.note, n.acc); }
    if (KEY_SIG) {
      var kind = KEY_SIG > 0 ? 'sharp' : 'flat';
      if (KEY_LETTERS[kind].slice(0, Math.abs(KEY_SIG)).indexOf(n.note.charAt(0)) >= 0) { return getPlayNote(n.note, kind); }
    }
    return n.note;
  }
