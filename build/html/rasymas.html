    var l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', STAFF_COLOR); l.setAttribute('stroke-width', w);
    l.setAttribute('stroke-linecap', 'round');
    g.appendChild(l);
  }
  function svgText(g, x, y, size, txt, family, weight) {
    var t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-family', family || 'serif');
    t.setAttribute('font-size', size);
    if (weight) { t.setAttribute('font-weight', weight); }
    t.setAttribute('fill', SIG_COLOR);
    t.setAttribute('pointer-events', 'none');
    t.textContent = txt;
    g.appendChild(t);
  }

  // Staff lines, the percussion clef of the rhythm line, the key signature
  // and the metre - everything that does not depend on the written notes.
  function drawStaff(svg, clefId) {
    svg.setAttribute('viewBox', '0 -24 ' + VB_W + ' 130');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.style.aspectRatio = VB_W + ' / 130';
    var g = svg.querySelector('.staff-lines');
    g.innerHTML = '';
    document.getElementById(clefId).style.display = RHYTHM_LINE ? 'none' : '';
    if (RHYTHM_LINE) {
      staffLine(g, 58, 48, STAFF_END, 48, 2.6);
      staffLine(g, 58, 34, 58, 62, 2.4);
      staffLine(g, STAFF_END, 34, STAFF_END, 62, 4);
      // Percussion clef: two thick upright bars.
      [78, 90].forEach(function (x) {
        var r = document.createElementNS(svgNS, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', 34); r.setAttribute('width', 6); r.setAttribute('height', 28);
        r.setAttribute('rx', 1.5); r.setAttribute('fill', SIG_COLOR);
        g.appendChild(r);
      });
    } else {
      for (var y = 20; y <= 76; y += 14) { staffLine(g, 58, y, STAFF_END, y, 2.4); }
      staffLine(g, 58, 20, 58, 76, 2.4);
      staffLine(g, STAFF_END, 20, STAFF_END, 76, 4);
      if (KEY_SIG) {
        var kind = KEY_SIG > 0 ? 'sharp' : 'flat';
        KEY_POS[rowClef][kind].slice(0, Math.abs(KEY_SIG)).forEach(function (py, i) {
          svgText(g, KEY_X + 6 + i * 13, py + (kind === 'sharp' ? 9 : 5), 28, kind === 'sharp' ? '♯' : '♭');
        });
      }
    }
    if (METER) {
      var p = METER.split('/');
      var top = RHYTHM_LINE ? 46 : 46, bot = RHYTHM_LINE ? 66 : 75;
      svgText(g, TIME_X, top, RHYTHM_LINE ? 22 : 31, p[0], 'Georgia, serif', 800);
      svgText(g, TIME_X, bot, RHYTHM_LINE ? 22 : 31, p[1], 'Georgia, serif', 800);
    }
  }

  // The key signature and metre take room after the clef, so the first note
  // (and how many notes fit on a row) follows them.
  function relayout() {
    var keyCount = RHYTHM_LINE ? 0 : Math.abs(KEY_SIG);
    KEY_X = 118;
    var x = KEY_X + (keyCount ? keyCount * 13 + 6 : 0);
    TIME_X = x + 12;
    x += METER ? 28 : 0;
    X_START = x + (KIDS_MODE ? 32 : 14);
    NOTES_PER_ROW = Math.floor((X_MAX - X_START) / X_STEP) + 1;
    NOTES_PER_PAGE = NOTES_PER_ROW * 2;
  }

  function refreshStaff() {
    relayout();
    drawStaff(document.getElementById('staffSvg'), 'clefRow1');
    drawStaff(document.getElementById('staffSvg2'), 'clefRow2');
  }

  // Note names as taught in Lithuania: B is "h", and octaves follow the
  // Helmholtz naming - lowercase from the small octave up (c, c1, c2, c3 =
  // C3, C4, C5, C6), uppercase for the great octave (C2). The number only
  // goes on the C keys of the piano.
  var LETTER_NAME = { 'C':'c','D':'d','E':'e','F':'f','G':'g','A':'a','B':'h' };
  function noteLetter(noteName) {
    var name = LETTER_NAME[noteName.charAt(0)] || '';
    return parseInt(noteName.slice(1), 10) >= 3 ? name : name.toUpperCase();
  }
  function keyLabel(noteName) {
    var oct = parseInt(noteName.slice(1), 10);
    return noteLetter(noteName) + (noteName.charAt(0) === 'C' && oct >= 4 ? (oct - 3) : '');
  }

  // Darker shade of a #rrggbb colour (amt 0..1), for outlines and stems.
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var f = 1 - amt;
    var r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function isLight(hex) {
    var n = parseInt(hex.slice(1), 16);
    return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 > 0.6;
  }
  // How many notes fit on one staff row before overflowing onto row 2.
  var NOTES_PER_ROW = Math.floor((X_MAX - X_START) / X_STEP) + 1;
  // A "page" (lapas) is the two staff rows; noteList keeps running on
  // across pages, only the current page is drawn.
  var NOTES_PER_PAGE = NOTES_PER_ROW * 2;
  var currentPage = 0;

  Object.keys(NOTE_Y_TREBLE).concat(Object.keys(NOTE_Y_BASS)).forEach(function (k) { RHYTHM_Y[k] = 48; });
  refreshStaff();

  function getRowNoteY() {
    if (RHYTHM_LINE) { return RHYTHM_Y; }
    return rowClef === 'treble' ? NOTE_Y_TREBLE : NOTE_Y_BASS;
  }

  // Where a note at a given index in noteList lives: which page, row/SVG and x position.
  function notePos(idx) {
    var page = Math.floor(idx / NOTES_PER_PAGE);
    var local = idx - page * NOTES_PER_PAGE;
    var row = local < NOTES_PER_ROW ? 0 : 1;
    var col = local - row * NOTES_PER_ROW;
    return { page: page, row: row, x: X_START + col * X_STEP, el: row === 0 ? placedEl1 : placedEl2 };
  }

  // The last page you can open: the one holding the last note, or the
  // empty page right after a full one (so writing can go on there).
  function lastPage() { return Math.floor(noteList.length / NOTES_PER_PAGE); }

  // Length of each note in beats (a beat = a quarter note); at tempo 1 a
  // beat lasts BEAT_SECS. Exact beats keep the playback in time with the
  // metre, the bar lines and a play-along music excerpt.
  var BEATS = {
    'whole': 4, 'half': 2, 'half-dot': 3, 'quarter': 1, 'quarter-dot': 1.5,
    'eighth': 0.5, 'eighth-dot': 0.75, 'sixteenth': 0.25,
    'rest-whole': 4, 'rest-half': 2, 'rest-quarter': 1, 'rest-eighth': 0.5, 'rest-sixteenth': 0.25
  };
  var BEAT_SECS = 0.45;
  var DURS = {};
  Object.keys(BEATS).forEach(function (k) { DURS[k] = BEATS[k] * BEAT_SECS; });
  // Beaming eligibility: plain (non-dotted) eighths/sixteenths only, matching
  // the exact combinations the spec calls out (two eighths, two sixteenths,
  // four sixteenths, eighth+2 sixteenths, 2 sixteenths+eighth, ...).
  var BEAMABLE = { 'eighth': 1, 'sixteenth': 2 };

  function drawNoteGlyph(noteName, type, x, yOffset, noteYTable, acc, beamInfo, lyric, mark) {
    yOffset = yOffset || 0;
    noteYTable = noteYTable || ROW_NOTE_Y[0];
    var g = document.createElementNS(svgNS, 'g');

    if (type.startsWith('rest-')) {
      var rt = type.replace('rest-', '');
      var yo = yOffset;
      if (rt === 'quarter') {
        var qt = document.createElementNS(svgNS, 'text');
        qt.setAttribute('x', x); qt.setAttribute('y', 72 + yo);
        qt.setAttribute('text-anchor', 'middle');
        qt.setAttribute('font-family', 'serif');
        qt.setAttribute('font-size', '52');
        qt.setAttribute('fill', '#444');
        qt.textContent = '𝄽';
        g.appendChild(qt);
      } else if (rt === 'eighth') {
        var et = document.createElementNS(svgNS, 'text');
        et.setAttribute('x', x); et.setAttribute('y', 68 + yo);
        et.setAttribute('text-anchor', 'middle');
        et.setAttribute('font-family', 'serif');
        et.setAttribute('font-size', '48');
        et.setAttribute('fill', '#444');
        et.textContent = '𝄾';
        g.appendChild(et);
      } else if (rt === 'sixteenth') {
        var st = document.createElementNS(svgNS, 'text');
        st.setAttribute('x', x); st.setAttribute('y', 64 + yo);
        st.setAttribute('text-anchor', 'middle');
        st.setAttribute('font-family', 'serif');
        st.setAttribute('font-size', '44');
        st.setAttribute('fill', '#444');
        st.textContent = '𝄿';
        g.appendChild(st);
      } else if (rt === 'half') {
        var r = document.createElementNS(svgNS, 'rect');
        r.setAttribute('x', x - 12); r.setAttribute('y', 41 + yo);
        r.setAttribute('width', 24); r.setAttribute('height', 7);
        r.setAttribute('fill', '#444'); r.setAttribute('rx', '0');
        g.appendChild(r);
      } else {
        var r2 = document.createElementNS(svgNS, 'rect');
        r2.setAttribute('x', x - 12); r2.setAttribute('y', 34 + yo);
        r2.setAttribute('width', 24); r2.setAttribute('height', 7);
        r2.setAttribute('fill', '#444'); r2.setAttribute('rx', '0');
        g.appendChild(r2);
      }
      return g;
    }

    var y = noteYTable[noteName];
    if (y == null) { return null; }
    y += yOffset;

    // On the rhythm line pitch does not matter, so every note has one colour.
    var noteColor = RHYTHM_LINE ? '#7e57c2' : (NOTE_COLOR[noteName.charAt(0)] || '#222');
    var baseType  = type.replace('-dot', '');
    var isDotted  = type.indexOf('-dot') >= 0;

    var STAF_TOP = 20 + yOffset, STAF_BOT = 76 + yOffset, LGAP = 14;
    function ledger(ly) {
      var ll = document.createElementNS(svgNS, 'line');
      ll.setAttribute('x1', x - 17); ll.setAttribute('x2', x + 17);
      ll.setAttribute('y1', ly); ll.setAttribute('y2', ly);
      ll.setAttribute('stroke', STAFF_COLOR); ll.setAttribute('stroke-width', '2.4');
      ll.setAttribute('stroke-linecap', 'round');
      g.appendChild(ll);
    }
    if (y < STAF_TOP) {
      for (var ly = STAF_TOP - LGAP; ly >= y; ly -= LGAP) { ledger(ly); }
    } else if (y > STAF_BOT) {
      for (var ly2 = STAF_BOT + LGAP; ly2 <= y; ly2 += LGAP) { ledger(ly2); }
    }

    // Kid-friendly note head: big and round, filled with the same colour as
    // its piano key, a dark outline, a little shine, and the note's letter
    // written inside it (the same letter as on the key).
    var filled = (baseType !== 'whole' && baseType !== 'half');
    var dark = shade(noteColor, 0.3);
    var el = document.createElementNS(svgNS, 'ellipse');
    el.setAttribute('cx', x); el.setAttribute('cy', y);
    el.setAttribute('rx', HEAD_RX); el.setAttribute('ry', HEAD_RY);
    el.setAttribute('fill', filled ? noteColor : '#fff');
    el.setAttribute('stroke', dark); el.setAttribute('stroke-width', filled ? '2' : '3.2');
    el.setAttribute('transform', 'rotate(-12,' + x + ',' + y + ')');
    g.appendChild(el);
    if (filled) {
      var shine = document.createElementNS(svgNS, 'ellipse');
      shine.setAttribute('cx', x - 5); shine.setAttribute('cy', y - 3.6);
      shine.setAttribute('rx', 3.6); shine.setAttribute('ry', 1.9);
      shine.setAttribute('fill', '#fff'); shine.setAttribute('opacity', '0.55');
      shine.setAttribute('transform', 'rotate(-20,' + (x - 5) + ',' + (y - 3.6) + ')');
      g.appendChild(shine);
    }
    var letterEl = document.createElementNS(svgNS, 'text');
    letterEl.setAttribute('x', x); letterEl.setAttribute('y', y + 3.8);
    letterEl.setAttribute('text-anchor', 'middle');
    letterEl.setAttribute('font-family', "'Baloo 2', var(--font)");
    letterEl.setAttribute('font-size', '11'); letterEl.setAttribute('font-weight', '800');
    letterEl.setAttribute('fill', !filled ? dark : isLight(noteColor) ? '#4a3800' : '#fff');
    letterEl.setAttribute('pointer-events', 'none');
    letterEl.textContent = noteLetter(noteName);
    if (!RHYTHM_LINE) { g.appendChild(letterEl); }

    if (acc && ACC_GLYPH[acc] && !RHYTHM_LINE) {
      var accEl = document.createElementNS(svgNS, 'text');
      accEl.setAttribute('x', x - 21);
      accEl.setAttribute('y', y + 5);
      accEl.setAttribute('text-anchor', 'middle');
      accEl.setAttribute('font-family', 'serif');
      accEl.setAttribute('font-size', acc === 'doublesharp' || acc === 'doubleflat' ? '16' : '19');
      accEl.setAttribute('fill', dark);
      accEl.textContent = ACC_GLYPH[acc];
      g.appendChild(accEl);
    }

    // Augmentation dot, to the right of the notehead.
    if (isDotted) {
      var dot = document.createElementNS(svgNS, 'circle');
      dot.setAttribute('cx', x + 19); dot.setAttribute('cy', y - 4);
      dot.setAttribute('r', '3'); dot.setAttribute('fill', dark);
      g.appendChild(dot);
    }

    // A slur/legato/crescendo/diminuendo mark attached to this note (spec's
    // "papildomi ženklai") is drawn just under the staff.
    if (mark) {
      var my = 84 + yOffset;
      if (mark === 'slur') {
        var sp = document.createElementNS(svgNS, 'path');
        sp.setAttribute('d', 'M' + (x - 12) + ',' + my + ' Q' + x + ',' + (my + 9) + ' ' + (x + 12) + ',' + my);
        sp.setAttribute('fill', 'none'); sp.setAttribute('stroke', '#555'); sp.setAttribute('stroke-width', '2');
        sp.setAttribute('stroke-linecap', 'round');
        g.appendChild(sp);
      } else {
        var hp = document.createElementNS(svgNS, 'path');
        var d = mark === 'cresc'
          ? 'M' + (x - 13) + ',' + (my + 4) + ' L' + (x + 13) + ',' + my + ' M' + (x - 13) + ',' + (my + 4) + ' L' + (x + 13) + ',' + (my + 8)
          : 'M' + (x - 13) + ',' + my + ' L' + (x + 13) + ',' + (my + 4) + ' M' + (x - 13) + ',' + (my + 8) + ' L' + (x + 13) + ',' + (my + 4);
        hp.setAttribute('d', d);
        hp.setAttribute('fill', 'none'); hp.setAttribute('stroke', '#555'); hp.setAttribute('stroke-width', '2');
        hp.setAttribute('stroke-linecap', 'round');
        g.appendChild(hp);
      }
    }

    // A lyric/text syllable under this note (spec: "po penkline pridėti
    // tekstą kiekvienai pasirinktai natai") - pushed a bit further down when
    // a mark is already occupying the space just under the staff.
    if (lyric) {
      var lt = document.createElementNS(svgNS, 'text');
      lt.setAttribute('x', x); lt.setAttribute('y', (mark ? 104 : 96) + yOffset);
      lt.setAttribute('text-anchor', 'middle');
      lt.setAttribute('font-family', 'var(--font)');
      lt.setAttribute('font-size', '12');
      lt.setAttribute('font-weight', '600');
      lt.setAttribute('fill', '#444');
      lt.textContent = lyric;
      g.appendChild(lt);
    }

    if (baseType === 'whole') { return g; }

    var stemUp = beamInfo ? beamInfo.stemUp : (y >= 48 + yOffset);
    var sx  = stemUp ? x + STEM_DX : x - STEM_DX;
    var sy1 = y + (stemUp ? -3 : 3);
    var sy2 = beamInfo ? beamInfo.beamY : (stemUp ? y - STEM_LEN : y + STEM_LEN);

    var stem = document.createElementNS(svgNS, 'line');
    stem.setAttribute('x1', sx); stem.setAttribute('x2', sx);
    stem.setAttribute('y1', sy1); stem.setAttribute('y2', sy2);
    stem.setAttribute('stroke', dark); stem.setAttribute('stroke-width', '3');
    stem.setAttribute('stroke-linecap', 'round');
    g.appendChild(stem);

    function addFlag(fy) {
      var d = stemUp ? 1 : -1;
      var fp = document.createElementNS(svgNS, 'path');
      fp.setAttribute('d',
        'M' + sx + ',' + fy +
        ' C' + (sx + 14*d) + ',' + (fy + 6*d) +
        ' '  + (sx + 16*d) + ',' + (fy + 14*d) +
        ' '  + (sx + 6*d)  + ',' + (fy + 22*d));
      fp.setAttribute('fill', 'none');
      fp.setAttribute('stroke', dark); fp.setAttribute('stroke-width', '3');
      fp.setAttribute('stroke-linecap', 'round');
      g.appendChild(fp);
    }

    // Beamed notes share a straight beam bar (drawn separately by
    // drawBeams) instead of their own curly flag.
    if (!beamInfo) {
      if (baseType === 'eighth')    { addFlag(sy2); }
      if (baseType === 'sixteenth') { addFlag(sy2); addFlag(stemUp ? sy2 + 9 : sy2 - 9); }
    }

    return g;
  }

  // ── Beaming: adjacent eighth/eighth-dot/sixteenth notes on the same row,
  // with neither a rest nor a lyric in between, get straight connecting
  // beam bars instead of individual flags — exactly the combinations named
  // in the spec (two eighths, two/four sixteenths, eighth + 2 sixteenths, a
  // dotted-eighth + sixteenth pair, ...). A note carrying its own lyric
  // syllable breaks the group, per spec. ─────────────────────────────────────
  function beamLevel(n) {
    if (!n || !n.note || n.lyric) { return 0; }
    if (n.type === 'eighth' || n.type === 'eighth-dot') { return 1; }
    if (n.type === 'sixteenth') { return 2; }
    return 0;
  }

  function computeBeamGroups() {
    var groups = {};
    var noteY = getRowNoteY();
    var i = 0;
    while (i < noteList.length) {
      if (!beamLevel(noteList[i])) { i++; continue; }
      var row = notePos(i).row;
      var run = [i];
      var j = i + 1;
      while (j < noteList.length && beamLevel(noteList[j]) && notePos(j).row === row && notePos(j).page === notePos(i).page) { run.push(j); j++; }
      if (run.length >= 2) {
        var firstY = noteY[noteList[run[0]].note];
        var stemUp = firstY >= 48;
        var extreme = null;
        run.forEach(function (idx) {
          var yy = noteY[noteList[idx].note];
          var sy2 = stemUp ? yy - STEM_LEN : yy + STEM_LEN;
          if (extreme === null || (stemUp ? sy2 < extreme : sy2 > extreme)) { extreme = sy2; }
        });
        run.forEach(function (idx) { groups[idx] = { members: run, stemUp: stemUp, beamY: extreme }; });
      }
      i = j;
    }
    return groups;
  }

  function drawBeams(groups) {
    var done = {};
    Object.keys(groups).forEach(function (key) {
      var info = groups[key];
      var gid = info.members[0];
      if (done[gid]) { return; }
      done[gid] = true;
      if (notePos(gid).page !== currentPage) { return; }
      var el = notePos(gid).el;
      function beamRect(bx0, bx1, y, thick) {
        var r = document.createElementNS(svgNS, 'rect');
        var left = Math.min(bx0, bx1), w = Math.max(2, Math.abs(bx1 - bx0));
        r.setAttribute('x', left); r.setAttribute('width', w);
        r.setAttribute('y', info.stemUp ? y : y - thick);
        r.setAttribute('height', thick);
        r.setAttribute('rx', 1.5);
        r.setAttribute('fill', '#333');
        el.appendChild(r);
      }
      function stemX(idx) { var nx = notePos(idx).x; return info.stemUp ? nx + STEM_DX : nx - STEM_DX; }
      var sx0 = stemX(info.members[0]), sx1 = stemX(info.members[info.members.length - 1]);
      beamRect(sx0 - 1.5, sx1 + 1.5, info.beamY, 4.5);

      var off = info.stemUp ? -9 : 9;
      var k = 0;
      while (k < info.members.length) {
        if (beamLevel(noteList[info.members[k]]) === 2) {
          var startK = k;
          while (k + 1 < info.members.length && beamLevel(noteList[info.members[k + 1]]) === 2) { k++; }
          var endK = k;
          var xa = stemX(info.members[startK]);
          if (endK > startK) {
            var xb = stemX(info.members[endK]);
            beamRect(xa - 1.5, xb + 1.5, info.beamY + off, 4.5);
          } else {
            var toward = startK < info.members.length - 1 ? 1 : -1;
            beamRect(xa, xa + toward * 13, info.beamY + off, 4.5);
          }
        }
        k++;
      }
    });
  }

  function addNote(noteName) {
    var isRest = selectedType.startsWith('rest-');
    var noteY = getRowNoteY();
    if (!isRest && noteY[noteName] == null) { return; }
    // A new note always goes after the last one. When this page is full,
    // the player turns to the next page with the ➡ button first; when they
    // are just looking back at an earlier page, jump to where it lands.
    var targetPage = notePos(noteList.length).page;
    if (targetPage > currentPage) {
      if (currentPage === targetPage - 1 && noteList.length % NOTES_PER_PAGE === 0) {
        if (K && K.mascot) { K.mascot('sad', 'Lapas pilnas! Spausk ➡ ir rašyk toliau 🎵'); }
        updatePageNav();
        return;
      }
      currentPage = targetPage;
    }
    var acc = (isRest || RHYTHM_LINE) ? null : selectedAccidental;
    noteList.push({ note: isRest ? null : noteName, type: selectedType, acc: acc });
    markDirty();
    // Redraw everything rather than just this one note: adding a note can
    // change whether it - or its new neighbour - joins a beam group.
    redrawAllNotes();
  }

  // ── Note selection & single-note deletion ────────────────────────────────────
  var selectedNoteIdx = null;

  function clearNoteSelection() {
    selectedNoteIdx = null;
    document.querySelectorAll('.note-sel').forEach(function (r) { r.remove(); });
  }

  function attachNoteClick(el, idx, x, yCtr) {
    var hit = document.createElementNS(svgNS, 'rect');
    hit.setAttribute('x', x - 22); hit.setAttribute('y', yCtr - 38);
    hit.setAttribute('width', 44);  hit.setAttribute('height', 76);
    hit.setAttribute('fill', 'transparent');
    el.appendChild(hit);
    el.style.cursor = 'pointer';
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      if (selectedNoteIdx === idx) { clearNoteSelection(); return; }
      clearNoteSelection();
      selectedNoteIdx = idx;
      var ring = document.createElementNS(svgNS, 'rect');
      ring.setAttribute('x', x - 22); ring.setAttribute('y', yCtr - 38);
      ring.setAttribute('width', 44);  ring.setAttribute('height', 76);
      ring.setAttribute('rx', '10');
      ring.setAttribute('fill', 'rgba(255,140,0,0.22)');
      ring.setAttribute('stroke', '#f4a027');
      ring.setAttribute('stroke-width', '2.5');
      ring.setAttribute('class', 'note-sel');
      ring.setAttribute('pointer-events', 'none');
      el.insertBefore(ring, el.firstChild);
    });
  }

  function redrawAllNotes() {
    placedEl1.innerHTML = '';
    placedEl2.innerHTML = '';
    selectedNoteIdx = null;
    currentPage = Math.max(0, Math.min(currentPage, lastPage()));
    var noteY = getRowNoteY();
    var beamGroups = computeBeamGroups();
    noteList.forEach(function (n, i) {
      var pos = notePos(i);
      if (pos.page !== currentPage) { return; }
      var yCtr = n.note ? noteY[n.note] : 48;
      var el = drawNoteGlyph(n.note || 'C4', n.type, pos.x, 0, noteY, n.acc, beamGroups[i], n.lyric, n.mark);
      if (el) { el.classList.add('note-pop'); attachNoteClick(el, i, pos.x, yCtr); pos.el.appendChild(el); }
    });
    drawBeams(beamGroups);
    drawBarLines();
    updateSecondRow();
    updatePageNav();
    showPausedStick();
  }

  // Taktai: a bar line after the note that fills up (or runs past) each
  // bar of the metre. A bar line falling at the end of a row is left out -
  // the row's own closing line is already there.
  function drawBarLines() {
    if (!SHOW_BARS || !METER) { return; }
    var perBar = parseInt(METER, 10);
    var beats = 0;
    noteList.forEach(function (n, i) {
      var before = beats;
      beats += BEATS[n.type] || 1;
      if (Math.floor(beats / perBar + 1e-6) <= Math.floor(before / perBar + 1e-6)) { return; }
      var pos = notePos(i), next = notePos(i + 1);
      if (pos.page !== currentPage || next.row !== pos.row || next.page !== pos.page) { return; }
      var bx = pos.x + X_STEP / 2;
      var l = document.createElementNS(svgNS, 'line');
      l.setAttribute('x1', bx); l.setAttribute('x2', bx);
      l.setAttribute('y1', RHYTHM_LINE ? 34 : 20); l.setAttribute('y2', RHYTHM_LINE ? 62 : 76);
      l.setAttribute('stroke', SIG_COLOR); l.setAttribute('stroke-width', '2.4');
      l.setAttribute('stroke-linecap', 'round');
      pos.el.appendChild(l);
    });
  }

  // MUSICATION I: the second staff stays hidden until the first one on this
  // page is full - then it appears, ready for the next note.
  var staffPanel2 = document.getElementById('staffPanel2');
  function updateSecondRow() {
    if (!KIDS_MODE) { return; }
    staffPanel2.hidden = noteList.length - currentPage * NOTES_PER_PAGE < NOTES_PER_ROW;
  }
  updateSecondRow();

  // ── Pages: ⬅ / ➡ buttons beside the staves ────────────────────────────────
  var btnPagePrev = document.getElementById('btnPagePrev');
  var btnPageNext = document.getElementById('btnPageNext');
  var pageLabel   = document.getElementById('pageLabel');

  function updatePageNav() {
    var last = lastPage();
    btnPagePrev.hidden = currentPage === 0;
    btnPageNext.hidden = currentPage >= last;
    // This page is full and nothing is written after it yet: nudge the
    // player towards ➡ so they see where to keep writing.
    btnPageNext.classList.toggle('pulse', currentPage === last - 1 && noteList.length === last * NOTES_PER_PAGE);
    pageLabel.hidden = last === 0;
    pageLabel.textContent = (currentPage + 1) + ' / ' + (last + 1);
  }

  // Turning the page flips both staves like a book page: the old page
  // swings away until it stands edge-on, the notes swap while it is
  // invisible, then the new page swings flat. `pageFlipping` lets the
  // playback hide its stick while the page is mid-air.
  var staffSvgs   = [document.getElementById('staffSvg'), document.getElementById('staffSvg2')];
  var FLIP_MS     = 300;
  var flipTimer   = null;
  var pageFlipping = false;

  function setFlipClass(cls) {
    staffSvgs.forEach(function (svg) {
      svg.classList.remove('flip-out-next', 'flip-in-next', 'flip-out-prev', 'flip-in-prev');
      if (cls) { void svg.getBoundingClientRect(); svg.classList.add(cls); }
      svg.parentNode.classList.toggle('flipping', !!cls);
    });
  }

  function goToPage(p) {
    if (p === currentPage) { return; }
    var dir = p > currentPage ? 'next' : 'prev';
    currentPage = p;
    clearTimeout(flipTimer);
    pageFlipping = true;
    setFlipClass('flip-out-' + dir);
    flipTimer = setTimeout(function () {
      redrawAllNotes();
      setFlipClass('flip-in-' + dir);
      flipTimer = setTimeout(function () { setFlipClass(null); pageFlipping = false; }, FLIP_MS);
    }, FLIP_MS);
  }
  btnPagePrev.addEventListener('click', function () { if (currentPage > 0) { goToPage(currentPage - 1); } });
  btnPageNext.addEventListener('click', function () { if (currentPage < lastPage()) { goToPage(currentPage + 1); } });

  function deleteSelectedNote() {
    if (selectedNoteIdx === null) { return; }
    noteList.splice(selectedNoteIdx, 1);
    markDirty();
    redrawAllNotes();
  }

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedNoteIdx !== null) {
      e.preventDefault(); deleteSelectedNote();
    }
  });

  document.getElementById('staffSvg').addEventListener('click', function () { clearNoteSelection(); });
  document.getElementById('staffSvg2').addEventListener('click', function () { clearNoteSelection(); });

  function clearCanvas() {
    noteList = []; currentPage = 0; pausedIdx = null;
    markDirty();
    redrawAllNotes();
  }
  document.getElementById('btnClear').addEventListener('click', clearCanvas);

  // ── Saving / opening note sheets (natų lapai). The files themselves are
  // managed on mano-pamokos.html; it opens one here as ?lesson=<id>, or a
  // new empty sheet as ?new=1&folder=<folder id>. ──────────────────────────
  var CURRENT_ID = null;     // the sheet being edited (saving updates it)
  var NEW_FOLDER = null;     // folder a new sheet is saved into
  var DIRTY = false;         // written but not saved yet
  function markDirty() { DIRTY = true; }

  function currentState() {
    return {
      notes: noteList, sound: SOUND_TYPE, tempo: TEMPO_SCALE, clef: rowClef,
      meter: METER, keySig: KEY_SIG, bars: SHOW_BARS, rhythm: RHYTHM_LINE, along: ALONG_ID
    };
  }

  function applyState(state) {
    if (state.clef && state.clef !== rowClef && !state.rhythm) { setClef(state.clef); }
    METER = state.meter || null;
    KEY_SIG = state.keySig || 0;
    SHOW_BARS = !!state.bars;
    RHYTHM_LINE = !!state.rhythm;
    ALONG_ID = state.along || null;
    noteList = state.notes || [];
    currentPage = 0; pausedIdx = null;
    if (state.sound) {
      // Lessons saved earlier may name an instrument that is no longer
      // offered - those play on the piano.
      SOUND_TYPE = document.querySelector('[data-sound="' + state.sound + '"]') ? state.sound : 'piano';
      document.querySelectorAll('[data-sound]').forEach(function (b) {
        b.classList.toggle('sel', b.dataset.sound === SOUND_TYPE);
      });
    }
    if (state.tempo) {
      TEMPO_SCALE = state.tempo;
      tempoSlider.value = state.tempo;
      updateTempoLabel();
    }
    updateToolButtons();
    refreshStaff();
    redrawAllNotes();
  }

  // A small "type a name" dialog in the page's own info popup - the
  // browser's prompt() does not work in the desktop (Electron) app.
  function askText(title, label, value, onOk, allowEmpty) {
    showInfo(title,
      '<label style="display:flex;flex-direction:column;gap:6px;font-weight:700;">' + label +
      '<input id="askInput" type="text" style="border:2px solid #cfe9cc;border-radius:12px;padding:10px 12px;font:600 17px var(--font);outline:none;"></label>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px;">' +
      '<button class="pop-btn" id="askCancel" style="text-align:center">Atšaukti</button>' +
      '<button class="pop-btn sel" id="askOk" style="text-align:center">💾 Gerai</button></div>');
    var input = document.getElementById('askInput');
    input.value = value || '';
    setTimeout(function () { input.focus(); input.select(); }, 30);
    function ok() {

    document.getElementById('askOk').addEventListener('click', ok);
    document.getElementById('askCancel').addEventListener('click', function () { infoOverlay.hidden = true; });

  }

  document.getElementById('btnSaveLesson').addEventListener('click', function () {
    if (!noteList.length) {
      if (K && K.mascot) { K.mascot('sad', 'Pirma parašyk bent vieną natą 🎵'); }

      });

  // "Mano pamokos" and the other pages: leaving would lose unsaved notes.
  function leave(href) {

    location.href = href;

  document.getElementById('btnOpenLibrary').addEventListener('click', function () { leave('mano-pamokos.html'); });
  document.querySelectorAll('a[data-leave]').forEach(function (a) {

  // ── Staff tool buttons ──────────────────────────────────────────────────
  var meterMenu = document.getElementById('meterMenu');
  var keyMenu = document.getElementById('keyMenu');
  function closeToolMenus() {
    meterMenu.classList.remove('open'); keyMenu.classList.remove('open');
    document.getElementById('alongMenu').classList.remove('open');
  }
  document.addEventListener('click', closeToolMenus);

  function updateToolButtons() {
    document.getElementById('btnMeter').classList.toggle('active', !!METER);
    document.getElementById('btnKey').classList.toggle('active', KEY_SIG !== 0);
    document.getElementById('btnBars').classList.toggle('active', SHOW_BARS);
    document.getElementById('btnRhythmLine').classList.toggle('active', RHYTHM_LINE);
    meterMenu.querySelectorAll('[data-meter]').forEach(function (b) { b.classList.toggle('sel', (b.dataset.meter || null) === METER); });
    keyMenu.querySelectorAll('[data-key]').forEach(function (b) { b.classList.toggle('sel', parseInt(b.dataset.key, 10) === KEY_SIG); });
    document.getElementById('btnAlong').classList.toggle('on', !!ALONG_ID);

  function toggleMenu(menu, e) {

  document.getElementById('btnKey').addEventListener('click', function (e) {
    if (RHYTHM_LINE) {

  function staffChanged() {
    markDirty();
    updateToolButtons();
    refreshStaff();
    redrawAllNotes();
  }
  meterMenu.querySelectorAll('[data-meter]').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      METER = b.dataset.meter || null;
      // Picking a metre brings the bar lines with it ("Taktai" can still
      // switch them off); no metre means no bars.

      closeToolMenus();
      staffChanged();
    });
  });
  keyMenu.querySelectorAll('[data-key]').forEach(function (b) {
    b.addEventListener('click', function (e) {

  document.getElementById('btnRhythmLine').addEventListener('click', function () {

  // ── Play along with a music excerpt (groti kartu) ─────────────────────────
  var EXC = window.MusicationExcerpts;
  var ALONG_ID = null;
  var alongMenu = document.getElementById('alongMenu');

  function renderAlongMenu() {
    EXC.all().then(function (items) {
      alongMenu.innerHTML = '';
      function item(label, id) {
        var b = document.createElement('button');
        b.className = 'pop-btn' + (ALONG_ID === id ? ' sel' : '');
        b.textContent = (ALONG_ID === id ? '✓ ' : '') + label;
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          ALONG_ID = id;
          markDirty();
          updateToolButtons();
          closeToolMenus();

        });
        alongMenu.appendChild(b);
      }
      var head = document.createElement('div');
      head.className = 'am-head';
      head.textContent = '🎶 Groti kartu su ištrauka' + (METER ? ' (' + METER + ')' : '');
      alongMenu.appendChild(head);
      item('Be ištraukos', null);
      items.filter(function (x) { return !METER || x.meter === METER; }).forEach(function (x) {
        item(EXC.KIND_ICON[x.kind] + ' ' + x.title + (METER ? '' : ' · ' + x.meter), x.id);
      });
    });
  }
  document.getElementById('btnAlong').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = alongMenu.classList.contains('open');
    closeToolMenus(); closeAllPopups();
    if (!open) { renderAlongMenu(); alongMenu.classList.add('open'); }
  });

  // Starts the chosen excerpt in step with the written notes: one beat of
  // the excerpt = one quarter note of the playback.
  function startAlong() {
    if (!ALONG_ID || EXC.playingId() === ALONG_ID) { return; }
    EXC.get(ALONG_ID).then(function (it) {
      if (!it || !isPlaying) { return; }
      EXC.play(it, { bpm: 60 * TEMPO_SCALE / BEAT_SECS, loop: true, volume: 0.55 * VOLUME_LEVEL });
    });
  }
  function stopAlong() { if (EXC.playingId()) { EXC.stop(); } }

  // Opened from "Mano pamokos" / a lesson.
  (function openFromUrl() {
    var q = new URLSearchParams(location.search);
    var id = q.get('lesson');
    if (id) {
      var state = LessonLibrary.load(id);
      if (state && LessonLibrary.get(id)) { CURRENT_ID = id; applyState(state); DIRTY = false; }
    }
    NEW_FOLDER = q.get('folder') || null;
    updateToolButtons();
  })();

  document.getElementById('btnDeleteNote').addEventListener('click', deleteSelectedNote);

  var playbackId = 0;
  var isPlaying = false;
  var playingIdx = 0;      // the note sounding right now
  var pausedIdx = null;    // after Stop: the note the stick waits on (null = no stick)

  // One play-head "stick" per staff row (a vertical line drawn at x = 0 and
  // moved with a translate). It first shows when Play is pressed. Stop
  // leaves it standing on the note it reached, and Play carries on from
  // there. It can be dragged to any note: while playing the music jumps
  // there at once, while stopped Play will start from there.
  var playHeadEls = [document.getElementById('playHead'), document.getElementById('playHead2')];
  function hidePlayHeads() { playHeadEls.forEach(function (g) { g.style.display = 'none'; }); }

  // A new note starts: the stick pulses, and the frog hops (not on a rest).
  function beat(row, hop) {
    var g = playHeadEls[row];
    g.classList.remove('beat', 'hop');
    void g.getBoundingClientRect();
    g.classList.add('beat');
    if (hop) { g.classList.add('hop'); }
  }

  function placeStick(row, x) {
    playHeadEls[row === 0 ? 1 : 0].style.display = 'none';
    playHeadEls[row].setAttribute('transform', 'translate(' + x.toFixed(2) + ',0)');
    playHeadEls[row].style.display = 'block';
  }

  // Play starts from the stopped stick when it is on the page being looked
  // at, otherwise from that page's first note (from the very beginning
  // when that page is still empty).
  function pausedOnThisPage() {
    return pausedIdx !== null && pausedIdx < noteList.length && notePos(pausedIdx).page === currentPage;
  }
  function playFromIdx() {
    if (pausedOnThisPage()) { return pausedIdx; }
    var first = currentPage * NOTES_PER_PAGE;
    return first < noteList.length ? first : 0;
  }

  // While stopped: stand the stick on its note, or hide it when that note
  // is on another page / gone.
  function showPausedStick() {
    if (!playHeadEls || isPlaying) { return; }
    if (!pausedOnThisPage()) { hidePlayHeads(); return; }
    var pos = notePos(pausedIdx);
    placeStick(pos.row, pos.x);
  }

  // ── Stop: invalidate the current playback so every still-pending
  // scheduled note/play-head callback (guarded by `playbackId === pid`)
  // becomes a no-op; the stick stays on the note it had reached. ───────────
  function stopPlayback() {
    if (!isPlaying) { return; }
    playbackId++;
    isPlaying = false;
    pausedIdx = playingIdx;
    stopAlong();
    showPausedStick();
  }
  document.getElementById('btnStop').addEventListener('click', stopPlayback);

  document.getElementById('btnPlay').addEventListener('click', function () {
    if (!noteList.length) { return; }
    startPlayback(playFromIdx());
  });

  // ── Dragging the stick: it follows the finger / mouse (across both rows)
  // and when let go snaps to the nearest note. If the music was playing it
  // carries on from that note; if stopped, the stick waits there for Play. ──
  function svgPointX(svg, clientX, clientY) {
    var pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  }

  function stickTarget(clientX, clientY) {
    var first = currentPage * NOTES_PER_PAGE;
    var row = 0, best = Infinity;
    staffSvgs.forEach(function (svg, r) {
      var b = svg.getBoundingClientRect();
      var d = Math.abs(clientY - (b.top + b.height / 2));
      if (d < best) { best = d; row = r; }
    });
    var rowStart = first + row * NOTES_PER_ROW;
    if (rowStart >= noteList.length) { row = 0; rowStart = first; }
    var rowCount = Math.min(NOTES_PER_ROW, noteList.length - rowStart);
    var x = Math.max(X_START - X_STEP / 2, Math.min(STAFF_END + 2, svgPointX(staffSvgs[row], clientX, clientY)));
    var col = Math.max(0, Math.min(rowCount - 1, Math.round((x - X_START) / X_STEP)));
    return { row: row, x: x, idx: rowStart + col };
  }

  playHeadEls.forEach(function (g) {
    g.addEventListener('pointerdown', function (e) {
      if (pageFlipping || (!isPlaying && !pausedOnThisPage())) { return; }
      e.preventDefault(); e.stopPropagation();
      var wasPlaying = isPlaying;
      playbackId++;
      isPlaying = false;
      document.body.classList.add('dragging-stick');
      function move(ev) {
        var t = stickTarget(ev.clientX, ev.clientY);
        placeStick(t.row, t.x);
      }
      function up(ev) {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        document.body.classList.remove('dragging-stick');
        pausedIdx = stickTarget(ev.clientX, ev.clientY).idx;
        if (wasPlaying) { startPlayback(pausedIdx); } else { showPausedStick(); }
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      move(e);
    });
  });

  function startPlayback(fromIdx) {
    playbackId++;
    var pid = playbackId;
    isPlaying = true;
    pausedIdx = null;

    // steps[i] = when note i starts (seconds from now) and where it sits.
    var steps = [];
    var t = 0;
    noteList.forEach(function (n, i) {
      if (i < fromIdx) { return; }
      var pos = notePos(i);
      var dur = (DURS[n.type] || 0.45) / TEMPO_SCALE;

      if (n.note) {
        (function (note, delay, d) {
          setTimeout(function () { if (playbackId === pid) playNote(note, d * 1.6); }, delay * 1000);
        })(soundingNote(n), t, dur);
      }

      steps.push({ start: t, x: pos.x, row: pos.row, page: pos.page, i: i });
      t += dur;
    });
    var total = t;
    startAlong();

    // The stick stands exactly on a note at the moment that note starts to
    // sound, then glides at an even speed so it reaches the next note right
    // when that one starts - a long note makes it travel slowly, a short one
    // quickly. Its position comes from the clock on every animation frame
    // (not from one timer per note), so the movement is smooth and stays in
    // step with the sound. After the last note of a row it glides one note
    // width further before jumping to the next row / disappearing. When the
    // music runs on past this page's two rows, the page turns by itself.
    var startedAt = performance.now();
    var idx = 0;
    var beatIdx = -1;
    function frame(now) {
      if (playbackId !== pid) { return; }
      var elapsed = (now - startedAt) / 1000;
      if (elapsed >= total) { isPlaying = false; pausedIdx = null; hidePlayHeads(); stopAlong(); return; }
      while (idx < steps.length - 1 && elapsed >= steps[idx + 1].start) { idx++; }
      var cur = steps[idx], next = steps[idx + 1];
      playingIdx = cur.i;
      if (beatIdx !== idx) { beatIdx = idx; beat(cur.row, !!(noteList[cur.i] && noteList[cur.i].note)); }
      if (cur.page !== currentPage) { goToPage(cur.page); }
      if (pageFlipping) { hidePlayHeads(); requestAnimationFrame(frame); return; }
      var segEnd = next ? next.start : total;
      var toX = (next && next.row === cur.row && next.page === cur.page) ? next.x : Math.min(cur.x + X_STEP, STAFF_END + 2);
      var k = Math.min(1, Math.max(0, (elapsed - cur.start) / (segEnd - cur.start)));
      placeStick(cur.row, cur.x + (toX - cur.x) * k);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ── Piano keyboard ───────────────────────────────────────────────────────────
  var WHITE_NOTES  = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  var BLACK_AFTER  = [true, true, false, true, true, true, false];
  var BLACK_PREFIX = ['Cs', 'Ds', null, 'Fs', 'Gs', 'As', null];
  var pianoEl = document.getElementById('piano');

  function makePianoKey(noteName, gIdx, isBlack, kw, bkw) {
    var div = document.createElement('div');
    div.className = isBlack ? 'bk' : 'wk';
    div.style.width = (isBlack ? bkw : kw) + 'px';
    if (isBlack) {
      div.style.left = (gIdx * kw + kw - bkw / 2) + 'px';
    } else {
      var color = NOTE_COLOR[noteName.charAt(0)] || '#888888';
      div.style.setProperty('--k', color);
      var span = document.createElement('span');
      span.textContent = keyLabel(noteName);
      // The key carries the colour; the name is white, or dark on the light
      // keys (yellow, orange) so it stays readable.
      span.style.color = isLight(color) ? '#3a2600' : '#fff';
      span.style.textShadow = isLight(color) ? '0 1px 0 rgba(255,255,255,0.45)' : '0 1px 2px rgba(0,0,0,0.35)';
      span.style.fontWeight = '800';
      span.style.fontFamily = 'var(--heading-font)';
      span.style.fontSize = Math.max(11, Math.min(20, Math.floor(kw * 0.3))) + 'px';
      div.appendChild(span);
    }
    div.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      div.classList.add('lit');
      var dur = (DURS[selectedType] || 0.45) * 1.6;
      playNote(noteName, dur);
      if (!isBlack) { addNote(noteName); }
      setTimeout(function () { div.classList.remove('lit'); }, 300);
    });
    return div;
  }

  function rebuildPiano() {
    var octaves    = keyboardOctaves();
    var totalWhite = octaves.length * 7 + 1;
    // A bit thinner than a full window-width fill - same octave range, narrower keys.
    var kw  = Math.max(14, Math.floor((window.innerWidth / totalWhite) * 0.8));
    var bkw = Math.round(kw * 0.6);

    pianoEl.innerHTML = '';
    pianoEl.style.width = (totalWhite * kw) + 'px';

    var whites = [], blacks = [];
    octaves.forEach(function (oct, oIdx) {
      WHITE_NOTES.forEach(function (n, wIdx) {
        var gIdx = oIdx * 7 + wIdx;
        whites.push(makePianoKey(n + oct, gIdx, false, kw, bkw));
        if (BLACK_AFTER[wIdx] && BLACK_PREFIX[wIdx]) {
          blacks.push(makePianoKey(BLACK_PREFIX[wIdx] + oct, gIdx, true, kw, bkw));
        }
      });
    });
    var lastGIdx = octaves.length * 7;
    whites.push(makePianoKey('C' + (octaves[octaves.length - 1] + 1), lastGIdx, false, kw, bkw));
    whites.forEach(function (w) { pianoEl.appendChild(w); });
    blacks.forEach(function (b) { pianoEl.appendChild(b); });
  }

  rebuildPiano();
  window.addEventListener('resize', rebuildPiano);

  var subOverlay = document.getElementById('subOverlay');
  var subTitle = document.getElementById('subTitle');
  function closeSub() { subOverlay.hidden = true; }
  document.querySelectorAll('[data-sub-open]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var group = btn.dataset.subOpen;
      subTitle.textContent = btn.querySelector('.nch-title').textContent;
      subOverlay.querySelectorAll('[data-sub-group]').forEach(function (g) {
        g.hidden = g.dataset.subGroup !== group;
      });
      subOverlay.hidden = false;
    });
  });
  document.getElementById('subClose').addEventListener('click', closeSub);
  subOverlay.addEventListener('click', function (e) {
    if (e.target === subOverlay || e.target.closest('.nav-btn')) { closeSub(); }
  });

  setTimeout(function () {
    if (K && K.mascot) { K.mascot('happy', 'Spausk klavišus ir rašyk natas! 🎵'); }
  }, 600);

})();
</script>
</body>
</html>
