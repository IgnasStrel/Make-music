<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MUSICATION — Rašyk natas 🎵</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Shared kids engine (mascot, stars, audio helpers) - loaded before our
       own <style> below so any of its rules our markup happens to share a
       class name with (only .topbar) get cleanly overridden by us. -->
  <link rel="stylesheet" href="../styles/kids.css">
  <style>
    /* kids.css's .topbar sets a max-width meant for its own centered layout;
       neutralize that here so our (different) topbar keeps its own sizing. */
    .topbar { width: auto !important; gap: 0 !important; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }

    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --heading-font: 'Baloo 2', var(--font);
      --ink: #1f2430;
      --ink-soft: #626b7a;
      --accent: #2f6fed;
      --accent-dark: #1d4fc4;
      --panel: rgba(255,255,255,0.97);
      --panel-border: rgba(15,23,42,0.1);
      /* Plain, solid panel colours - easy to re-tint by eye. --glass is the
         everyday chrome background (a whisper of blue), --glass-strong is
         pure white for surfaces (like the staff) that need to stay crisp. */
      --glass: #f7f9fc;
      --glass-strong: #ffffff;
      --glass-border: var(--panel-border);
    }

    body {
      font-family: var(--font);
      background: #222;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
      /* kids.css (loaded above for the mascot) sets its own body padding/gap
         meant for its centered-column layout - reset those back to ours. */
      padding: 0; gap: 0;
    }

    /* ── Page shell ── */
    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: 2000px;
      padding: 8px 10px 170px;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 100vh;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .back-link {
      text-decoration: none; color: var(--ink);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px; padding: 8px 16px;
      font-size: 15px; font-weight: 700; font-family: var(--heading-font);
      box-shadow: 0 2px 8px rgba(15,23,42,0.10);
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, transform 0.12s;
    }
    .back-link:hover { background: var(--glass-strong); box-shadow: 0 4px 14px rgba(15,23,42,0.16); transform: translateY(-1px); }

    /* ── Main area: just the center content ── */
    .main-area {
      display: flex; gap: 12px; align-items: flex-start; flex: 1;
      padding-left: 86px; /* leave room for fixed left circles */
    }

    /* ── Left column: 4 settings circles — fixed to left edge of screen ── */
    .left-col {
      position: fixed;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px;
      z-index: 200;
    }

    .circle-wrap { position: relative; }

    .scircle {
      width: 62px; height: 62px; border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      box-shadow: 0 3px 10px rgba(15,23,42,0.12);
      transition: box-shadow 0.15s, border-color 0.15s, background 0.15s, transform 0.15s;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .scircle .ico { font-size: 22px; line-height: 1; }
    .scircle .lbl { font-size: 10px; font-weight: 700; color: var(--ink-soft); font-family: var(--heading-font); }
    .scircle:hover { box-shadow: 0 6px 18px rgba(15,23,42,0.18); border-color: rgba(255,255,255,0.8); transform: translateY(-2px) scale(1.04); }
    .scircle.open {
      border-color: var(--accent);
      background: rgba(47,111,237,0.22);
      box-shadow: 0 6px 20px rgba(47,111,237,0.35);
    }
    .scircle.open .lbl { color: var(--accent-dark); }

    /* Popup opens to the RIGHT of the circle */
    .popup {
      position: absolute;
      left: calc(100% + 10px);
      top: 50%; transform: translateY(-50%);
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 8px;
      z-index: 300;
      box-shadow: 0 10px 32px rgba(15,23,42,0.22);
      display: none; flex-direction: column; gap: 3px;
      min-width: 148px;
      white-space: nowrap;
      max-height: 80vh;
      overflow-y: auto;
    }
    .popup.open { display: flex; }
    .pop-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--ink-soft); text-align: center;
      margin-bottom: 4px; font-family: var(--font);
    }
    .pop-btn {
      background: transparent;
      border: 1px solid transparent; border-radius: 7px;
      padding: 7px 10px;
      font-family: var(--font); font-size: 13.5px; font-weight: 500; color: var(--ink);
      cursor: pointer; text-align: left; transition: 0.12s;
      white-space: nowrap;
    }
    .pop-btn:hover { background: rgba(47,111,237,0.08); }
    .pop-btn.sel { border-color: var(--accent); background: rgba(47,111,237,0.12); color: var(--accent-dark); font-weight: 600; }

    /* ── Lesson library modal ── */
    .lib-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(15,23,42,0.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .lib-overlay[hidden] { display: none; }
    .lib-modal {
      background: #fff; border-radius: 16px; padding: 20px;
      width: 100%; max-width: 420px; max-height: 80vh;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(15,23,42,0.35);
      font-family: var(--font);
    }
    .lib-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 17px; font-weight: 700; color: var(--ink);
    }
    .lib-close {
      border: none; background: transparent; font-size: 22px; line-height: 1;
      color: var(--ink-soft); cursor: pointer;
    }
    .lib-close:hover { color: var(--accent-dark); }
    .lib-search {
      border: 1.5px solid var(--panel-border); border-radius: 10px;
      padding: 9px 12px; font-family: var(--font); font-size: 14px;
    }
    .lib-search:focus { outline: none; border-color: var(--accent); }
    .lib-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .lib-empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 16px 0; }
    .lib-row {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 12px;
    }
    .lib-row-info { flex: 1; min-width: 0; }
    .lib-row-title { font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lib-row-date { font-size: 12px; color: var(--ink-soft); }
    .lib-row-btn {
      border: none; border-radius: 7px; padding: 7px 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: var(--font);
    }
    .lib-row-open { background: rgba(47,111,237,0.12); color: var(--accent-dark); }
    .lib-row-open:hover { background: rgba(47,111,237,0.2); }
    .lib-row-del { background: rgba(192,57,43,0.10); color: #c0392b; }
    .lib-row-del:hover { background: rgba(192,57,43,0.18); }

    /* ── Center column: note-bar + staff ── */
    .center-col {
      flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0;
    }

    /* Note type bar */
    .note-bar {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 6px 10px;
      display: flex; gap: 2px; align-items: center; justify-content: center;
      box-shadow: 0 3px 14px rgba(15,23,42,0.10); flex-wrap: nowrap;
    }
    .nbar-btn {
      min-width: 42px; height: 54px;
      border: 1px solid transparent; background: transparent;
      border-radius: 6px; cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
      padding: 0 4px;
      transition: background 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .nbar-btn:hover { background: rgba(15,23,42,0.05); }
    .nbar-btn.active { border-color: var(--accent); background: rgba(47,111,237,0.12); }
    .nbar-btn .nl { font-size: 10px; font-weight: 600; color: var(--ink-soft); font-family: var(--font); }
    /* Icon-only note/rest/accidental glyphs (spec: "aiškios ikonos be žodžių") */
    .glyph-serif { font-family:serif; font-size:28px; line-height:1.1; display:block; }
    /* Markings keep an icon + the music term (spec's explicit exception), so
       they need a bit more room than the icon-only buttons. */
    .nbar-mark { min-width: 62px; }
    .nbar-mark .nl { font-size: 9.5px; }
    .nbar-btn.active .nl { color: var(--accent-dark); }
    .nbar-sep { width: 1px; height: 36px; background: rgba(15,23,42,0.10); margin: 0 3px; flex-shrink: 0; }

    /* Staff panel */
    .staff-panel {
      /* Kept nearly-opaque (unlike the glass chrome elsewhere) so the
         written notes always stay crisp and readable over any background. */
      background: var(--glass-strong);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 16px 20px 14px;
      box-shadow: 0 6px 24px rgba(15,23,42,0.14);
      overflow-x: auto;
    }
    /* SVG is vector, so scaling it up to fill the wider page stays crisp (HD)
       instead of stretching a raster image - the viewBox keeps everything
       (staff, clef, notes) proportional at any size. */
    #staffSvg, #staffSvg2 { display: block; width: 100%; height: auto; aspect-ratio: 1280 / 130; min-width: 900px; }
    .staff-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .sbtn {
      font-family: var(--font); font-size: 14px; font-weight: 600;
      padding: 9px 20px; border: 1px solid transparent; border-radius: 8px;
      cursor: pointer; transition: background 0.13s, border-color 0.13s, transform 0.08s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .sbtn:hover { transform: translateY(-1px); }
    .sbtn:active { transform: translateY(1px); }
    .sbtn-play  { background: var(--accent); color: #fff; box-shadow: 0 1px 3px rgba(47,111,237,0.4); }
    .sbtn-play:hover { background: var(--accent-dark); box-shadow: 0 3px 8px rgba(47,111,237,0.45); }
    .sbtn-del   { background: #fff; color: var(--ink); border-color: var(--panel-border); }
    .sbtn-del:hover { background: #f4f6f9; border-color: rgba(15,23,42,0.2); }
    .sbtn-clear { background: #fff; color: #c0392b; border-color: rgba(192,57,43,0.3); }
    .sbtn-clear:hover { background: rgba(192,57,43,0.06); }
    .sbtn-stop  { background: #fff; color: #c0392b; border-color: rgba(192,57,43,0.3); }
    .sbtn-stop:hover { background: rgba(192,57,43,0.06); }
    .sbtn-zoom  { background: #fff; color: var(--ink); border-color: var(--panel-border); padding: 9px 14px; }
    .sbtn-zoom:hover { background: #f4f6f9; }

    /* ── Piano ── */
    .piano-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: transparent; padding: 8px 0 4px;
      display: flex; justify-content: center;
      overflow-x: auto; z-index: 10;
      box-shadow: 0 -5px 22px rgba(0,0,0,0.5);
    }
    .piano-inner { position: relative; display: flex; flex-shrink: 0; height: 140px; }

    .wk {
      flex-shrink: 0; height: 140px;
      background: linear-gradient(175deg, #f6f6f2 75%, #e0e0da 100%);
      border: 1px solid #bbb; border-radius: 0 0 8px 8px;
      cursor: pointer;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 5px;
      font-size: 10px; font-weight: 700; color: #bbb; font-family: var(--font);
      user-select: none; transition: background 0.06s, transform 0.07s;
      transform-origin: top center;
      box-shadow: inset 0 -3px 5px rgba(0,0,0,0.09), 2px 4px 8px rgba(0,0,0,0.28);
      -webkit-tap-highlight-color: transparent;
    }
    .wk:active, .wk.lit { background: linear-gradient(175deg, #c8e4ff 75%, #a8c8ee 100%); transform: scaleY(0.97) translateY(2px); }

    .bk {
      position: absolute; top: 0; height: 86px;
      background: linear-gradient(175deg, #3d3d3d 0%, #111 100%);
      border-radius: 0 0 5px 5px;
      cursor: pointer; z-index: 2;
      transition: background 0.06s, transform 0.07s;
      transform-origin: top center;
      box-shadow: 2px 5px 10px rgba(0,0,0,0.5);
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .bk:active, .bk.lit { background: linear-gradient(175deg, #6090cc 0%, #336 100%); transform: scaleY(0.97) translateY(2px); }

    .clef-hover-bg { transition: fill 0.15s; }
    #clefGroupRow1:hover .clef-hover-bg,
    #clefGroupRow2:hover .clef-hover-bg { fill: rgba(70,142,224,0.15); }

    /* ── Right column: games & other activities ── */
    .right-col {
      width: 320px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 12px;
      overflow-y: auto;
    }

    /* Each nav group (Žaidimai / Mokymasis / Pamokos) is its own plain white
       card with a clickable header that expands/collapses its body - a
       smooth, dependency-free "unfold" using the CSS grid-rows trick
       (0fr -> 1fr) instead of a JS height hack or an animation library. */
    .nav-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: 0 6px 22px rgba(15,23,42,0.12);
      overflow: hidden;
    }
    /* A weak colour hint per card so the sidebar isn't just flat white -
       change these 3 lines any time to whatever tint you like. */
    .right-col .nav-card:nth-of-type(1) { background: #fdf3f8; }
    .right-col .nav-card:nth-of-type(2) { background: #fdfaf0; }
    .right-col .nav-card:nth-of-type(3) { background: #f2fbf6; }
    .nav-card-head {
      width: 100%; display: flex; align-items: center; gap: 10px;
      background: transparent; border: none; cursor: pointer;
      padding: 14px 16px;
      font-family: var(--heading-font); font-weight: 700; font-size: 15.5px; color: var(--ink);
      text-align: left; -webkit-tap-highlight-color: transparent;
      transition: background 0.12s;
    }
    .nav-card-head:hover { background: rgba(15,23,42,0.04); }
    .nch-ico { font-size: 20px; line-height: 1; }
    .nch-title { flex: 1; }
    .nch-chev { font-size: 13px; color: var(--ink-soft); transition: transform 0.25s cubic-bezier(.16,1,.3,1); }
    .nav-card.open .nch-chev { transform: rotate(180deg); }
    .nav-card-body {
      display: grid; grid-template-rows: 0fr;
      transition: grid-template-rows 0.32s cubic-bezier(.16,1,.3,1);
    }
    .nav-card.open .nav-card-body { grid-template-rows: 1fr; }
    .nav-card-inner {
      min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; gap: 6px;
      padding: 0 10px 10px;
    }

    .nav-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; background: rgba(255,255,255,0.7);
      border: 1px solid transparent;
      border-radius: 14px; padding: 10px 12px;
      font-family: var(--font); font-size: 14.5px; font-weight: 600; color: var(--ink);
      text-decoration: none;
      cursor: pointer; transition: background 0.15s, transform 0.15s, box-shadow 0.15s; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn .nb-ico {
      font-size: 19px; line-height: 1; flex-shrink: 0;
      width: 34px; height: 34px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: var(--nav-accent, #2f6fed); background: color-mix(in srgb, var(--nav-accent, #2f6fed) 20%, white);
    }
    .nav-btn:hover { background: #ffffff; transform: translateX(3px) translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,0.12); }
    .nav-btn:active { transform: scale(0.98); }

    /* ── Motion polish: notes pop in, panels + nav items unfold on load ── */
    @keyframes notePop {
      0%   { transform: scale(0.3); opacity: 0; }
      60%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .note-pop { transform-box: fill-box; transform-origin: center; animation: notePop 0.28s cubic-bezier(.34,1.56,.64,1); }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes navBtnIn {
      from { opacity: 0; transform: translateX(-10px) scale(0.96); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .note-bar, .staff-panel, .right-col .nav-card {
      animation: panelIn 0.4s cubic-bezier(.16,1,.3,1) both;
    }
    .staff-panel:nth-of-type(2) { animation-delay: 0.06s; }
    .right-col .nav-card:nth-child(1) { animation-delay: 0.08s; }
    .right-col .nav-card:nth-child(2) { animation-delay: 0.14s; }
    .right-col .nav-card:nth-child(3) { animation-delay: 0.2s; }
    /* Buttons "unfold" into place just after their card lands. */
    .nav-card-inner .nav-btn {
      animation: navBtnIn 0.32s cubic-bezier(.16,1,.3,1) both;
    }
    .nav-card-inner .nav-btn:nth-child(1) { animation-delay: 0.3s; }
    .nav-card-inner .nav-btn:nth-child(2) { animation-delay: 0.35s; }
    .nav-card-inner .nav-btn:nth-child(3) { animation-delay: 0.4s; }
    .nav-card-inner .nav-btn:nth-child(4) { animation-delay: 0.45s; }
    .nav-card-inner .nav-btn:nth-child(5) { animation-delay: 0.5s; }
    .nav-card-inner .nav-btn:nth-child(6) { animation-delay: 0.55s; }
  </style>
</head>
<body>




<div class="page">
  <div class="topbar">
    <span class="back-link" style="cursor:default;">🎵 MUSICATION</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="back-link" id="btnNew" style="border:none;background:none;cursor:pointer;">🆕 <span data-i18n="newLesson">Nauja</span></button>
      <button class="back-link" id="btnUser" title="Naudotojas">👤 <span id="userModeLabel">Mokytojas</span></button>
    </div>
  </div>

  <div class="main-area">

    <!-- ── Center: note-bar + staff ── -->
    <div class="center-col">

      <!-- Note type bar -->
      <div class="note-bar" id="noteBar">

        <!-- Whole -->
        <button class="nbar-btn" data-type="whole" title="Visa nata">
          <svg width="36" height="26" viewBox="0 0 36 26">
            <ellipse cx="18" cy="17" rx="14" ry="8.5" fill="none" stroke="#333" stroke-width="3"/>
          </svg>
        </button>

        <!-- Half -->
        <button class="nbar-btn" data-type="half" title="Pusinė nata">
          <svg width="32" height="44" viewBox="0 0 32 44">
            <ellipse cx="12" cy="34" rx="11" ry="7" fill="none" stroke="#333" stroke-width="3" transform="rotate(-12 12 34)"/>
            <line x1="23" y1="32" x2="23" y2="5" stroke="#333" stroke-width="2.8"/>
          </svg>
        </button>

        <!-- Dotted half -->
        <button class="nbar-btn" data-type="half-dot" title="Pusinė nata su tašku">
          <svg width="40" height="44" viewBox="0 0 40 44">
            <ellipse cx="12" cy="34" rx="11" ry="7" fill="none" stroke="#333" stroke-width="3" transform="rotate(-12 12 34)"/>
            <line x1="23" y1="32" x2="23" y2="5" stroke="#333" stroke-width="2.8"/>
            <circle cx="31" cy="31" r="2.4" fill="#333"/>
          </svg>
        </button>

        <!-- Quarter (default active) -->
        <button class="nbar-btn active" data-type="quarter" title="Ketvirtinė nata">
          <svg width="32" height="44" viewBox="0 0 32 44">
            <ellipse cx="12" cy="34" rx="11" ry="7" fill="#333" stroke="#333" stroke-width="2" transform="rotate(-12 12 34)"/>
            <line x1="23" y1="32" x2="23" y2="5" stroke="#333" stroke-width="2.8"/>
          </svg>
        </button>

        <!-- Dotted quarter -->
        <button class="nbar-btn" data-type="quarter-dot" title="Ketvirtinė nata su tašku">
          <svg width="40" height="44" viewBox="0 0 40 44">
            <ellipse cx="12" cy="34" rx="11" ry="7" fill="#333" stroke="#333" stroke-width="2" transform="rotate(-12 12 34)"/>
            <line x1="23" y1="32" x2="23" y2="5" stroke="#333" stroke-width="2.8"/>
            <circle cx="31" cy="31" r="2.4" fill="#333"/>
          </svg>
        </button>

        <!-- Eighth -->
        <button class="nbar-btn" data-type="eighth" title="Aštuntinė nata">
          <svg width="36" height="44" viewBox="0 0 36 44">
            <ellipse cx="11" cy="34" rx="10" ry="6.5" fill="#333" stroke="#333" stroke-width="2" transform="rotate(-12 11 34)"/>
            <line x1="21" y1="32" x2="21" y2="5" stroke="#333" stroke-width="2.8"/>
            <path d="M21 5 C33 9 35 21 26 29" fill="none" stroke="#333" stroke-width="2.8" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Dotted eighth -->
        <button class="nbar-btn" data-type="eighth-dot" title="Aštuntinė nata su tašku">
          <svg width="42" height="44" viewBox="0 0 42 44">
            <ellipse cx="11" cy="34" rx="10" ry="6.5" fill="#333" stroke="#333" stroke-width="2" transform="rotate(-12 11 34)"/>
            <line x1="21" y1="32" x2="21" y2="5" stroke="#333" stroke-width="2.8"/>

    master.gain.linearRampToValueAtTime(0.52, now + 0.006);
    master.gain.exponentialRampToValueAtTime(0.20, now + 0.08);
    master.gain.setValueAtTime(0.20, sustainEnd - 0.01);
    master.gain.exponentialRampToValueAtTime(0.001, releaseEnd);
    master.connect(comp);

    var harms  = [1,    2,    3,    4,    5,    6,    7,    8   ];
    var amps   = [1.00, 0.42, 0.20, 0.11, 0.066,0.038,0.022,0.012];
    var dFracs = [1.00, 0.87, 0.74, 0.62, 0.52, 0.44, 0.37, 0.31];

    harms.forEach(function (h, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * h * Math.sqrt(1.0 + BETA * h * h);
      var t1 = now + (durSecs + 0.6) * dFracs[i] * decayScale;
      g.gain.setValueAtTime(amps[i], now);
      g.gain.exponentialRampToValueAtTime(0.001, t1);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(t1 + 0.05);
    });
  }

  // ── Organ synthesis ──────────────────────────────────────────────────────────
  function synthOrgan(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.001, now);
    master.gain.linearRampToValueAtTime(0.32, now + 0.015);
    master.gain.setValueAtTime(0.32, now + durSecs);
    master.gain.exponentialRampToValueAtTime(0.001, now + durSecs + 0.06);
    master.connect(comp);

    [1, 2, 3, 4].forEach(function (h, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * h;
      g.gain.value = [1.0, 0.5, 0.25, 0.12][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + durSecs + 0.1);
    });
  }

  // ── Marimba/xylophone synthesis ──────────────────────────────────────────────
  function synthMarimba(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var decay = Math.min(durSecs, 0.55);
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.6, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + decay);
    master.connect(comp);

    [1, 2, 3.5, 5.5].forEach(function (h, i) {
      var osc = ctx.createOscillator();
      var g   = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq * h;
      g.gain.value = [1.0, 0.4, 0.15, 0.05][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + decay + 0.08);
    });
  }

  // ── Bowed strings (violin) — sawtooth core, slow bow attack + gentle vibrato ──
  function synthViolin(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var end = now + durSecs;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.34, now + 0.09);
    master.gain.setValueAtTime(0.34, Math.max(now + 0.09, end - 0.05));
    master.gain.exponentialRampToValueAtTime(0.0001, end + 0.12);
    master.connect(comp);

    var vibrato = ctx.createOscillator();
    vibrato.type = 'sine'; vibrato.frequency.value = 5.2;
    var vibGain = ctx.createGain(); vibGain.gain.value = freq * 0.006;
    vibrato.connect(vibGain);
    vibrato.start(now); vibrato.stop(end + 0.15);

    [1, 2, 3, 4, 5].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = freq * h;
      vibGain.connect(osc.frequency);
      g.gain.value = [0.5, 0.24, 0.14, 0.07, 0.04][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(end + 0.15);
    });
  }

  // ── Flute — mostly-sine core with a breath of filtered noise ────────────────
  function synthFlute(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var end = now + durSecs;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
    master.gain.setValueAtTime(0.4, Math.max(now + 0.05, end - 0.04));
    master.gain.exponentialRampToValueAtTime(0.0001, end + 0.08);
    master.connect(comp);

    [1, 2, 3].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq * h;
      g.gain.value = [1.0, 0.16, 0.06][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(end + 0.1);
    });

    var noise = makeNoiseSource(ctx, durSecs + 0.1);
    var breathFilter = ctx.createBiquadFilter();
    breathFilter.type = 'bandpass'; breathFilter.frequency.value = freq * 1.5; breathFilter.Q.value = 0.6;
    var breathGain = ctx.createGain(); breathGain.gain.value = 0.05;
    noise.connect(breathFilter); breathFilter.connect(breathGain); breathGain.connect(master);
    noise.start(now); noise.stop(end + 0.1);
  }

  // ── Trumpet — brighter sawtooth, fast attack, slightly nasal ────────────────
  function synthTrumpet(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var end = now + durSecs;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
    master.gain.setValueAtTime(0.3, Math.max(now + 0.02, end - 0.05));
    master.gain.exponentialRampToValueAtTime(0.0001, end + 0.1);
    master.connect(comp);

    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = freq * 3; filter.Q.value = 1.1;
    filter.connect(master);

    [1, 2, 3, 4, 5, 6].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = freq * h;
      g.gain.value = [0.5, 0.32, 0.24, 0.16, 0.1, 0.06][i];
      osc.connect(g); g.connect(filter);
      osc.start(now); osc.stop(end + 0.12);
    });
  }

  // ── Guitar — plucked string: fast attack, quick exponential decay ───────────
  function synthGuitar(freq, durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var decay = Math.min(durSecs + 0.4, 1.1);
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.55, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + decay);
    master.connect(comp);

    [1, 2, 3, 4].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq * h;
      var t1 = now + decay * [1, 0.7, 0.45, 0.3][i];
      g.gain.setValueAtTime([1.0, 0.5, 0.22, 0.1][i], now);
      g.gain.exponentialRampToValueAtTime(0.001, t1);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(t1 + 0.05);
    });
  }

  // ── Shared: a short burst of white noise, as a raw un-gained buffer source ──
  var NOISE_BUFFER = null;
  function makeNoiseSource(ctx, durSecs) {
    if (!NOISE_BUFFER || NOISE_BUFFER.sampleRate !== ctx.sampleRate) {
      var len = ctx.sampleRate * 2;
      NOISE_BUFFER = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = NOISE_BUFFER.getChannelData(0);
      for (var i = 0; i < len; i++) { data[i] = Math.random() * 2 - 1; }
    }
    var src = ctx.createBufferSource();
    src.buffer = NOISE_BUFFER;
    src.loop = true;
    return src;
  }

  // ── Percussion: drums/shaker/triangle/cymbal are unpitched - they ignore
  // the piano key's frequency and just play their own fixed hit. ─────────────
  function synthDrum(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.9, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    master.connect(comp);
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(48, now + 0.22);
    osc.connect(master);
    osc.start(now); osc.stop(now + 0.3);

    var noise = makeNoiseSource(ctx, 0.05);
    var nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 400;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.5, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    noise.connect(nf); nf.connect(ng); ng.connect(comp);
    noise.start(now); noise.stop(now + 0.07);
  }

  function synthShaker(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var noise = makeNoiseSource(ctx, 0.14);
    var f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 6500; f.Q.value = 0.7;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.5, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    noise.connect(f); f.connect(g); g.connect(comp);
    noise.start(now); noise.stop(now + 0.15);
  }

  function synthTriangleInst(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.5, now);
    master.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
    master.connect(comp);
    [1, 2.76, 5.4, 8.9].forEach(function (h, i) {
      var osc = ctx.createOscillator(); var g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 2800 * h / 4;
      g.gain.value = [1.0, 0.5, 0.28, 0.12][i];
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + 1.5);
    });
  }

  function synthCymbal(durSecs, ctx, comp) {
    var now = ctx.currentTime;
    var noise = makeNoiseSource(ctx, 1.4);
    var f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 5000;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
    noise.connect(f); f.connect(g); g.connect(comp);
    noise.start(now); noise.stop(now + 1.4);
  }

  // ── Dispatch ─────────────────────────────────────────────────────────────────
  var SOUND_TYPE   = 'piano';
  var TEMPO_SCALE  = 1.0;

  var UNPITCHED = { drums: 1, shaker: 1, triangle: 1, cymbal: 1 };

  function playNote(noteName, durSecs) {
    var freq = PIANO_FREQ[noteName];
    if (!freq && !UNPITCHED[SOUND_TYPE]) { return; }
    var ctx = getCtx();
    if (ctx.state !== 'running') { ctx.resume(); }
    switch (SOUND_TYPE) {
      case 'organ':    synthOrgan(freq, durSecs, ctx, PIANO_COMP); break;
      case 'marimba':  synthMarimba(freq, durSecs, ctx, PIANO_COMP); break;
      case 'violin':
      case 'strings':  synthViolin(freq, durSecs, ctx, PIANO_COMP); break;
      case 'flute':    synthFlute(freq, durSecs, ctx, PIANO_COMP); break;
      case 'clarinet': synthFlute(freq, durSecs, ctx, PIANO_COMP); break;
      case 'trumpet':  synthTrumpet(freq, durSecs, ctx, PIANO_COMP); break;
      case 'guitar':   synthGuitar(freq, durSecs, ctx, PIANO_COMP); break;
      case 'drums':    synthDrum(durSecs, ctx, PIANO_COMP); break;
      case 'shaker':   synthShaker(durSecs, ctx, PIANO_COMP); break;
      case 'triangle': synthTriangleInst(durSecs, ctx, PIANO_COMP); break;
      case 'cymbal':   synthCymbal(durSecs, ctx, PIANO_COMP); break;
      default:         synthPiano(freq, durSecs, ctx, PIANO_COMP); // piano, harp, bells, organ-ish extras, choir, childvoice
    }
  }

  document.getElementById('btnGlossary').addEventListener('click', function () {
    var lt = CURRENT_LANG === 'lt';
    var rows = GLOSSARY.map(function (g) {
      return '<div style="padding:8px 0;border-top:1px solid var(--panel-border);">' +
        '<div style="font-weight:700;">' + (lt ? g.lt : g.en) + '</div>' +
        '<div style="color:var(--ink-soft);font-size:13px;">' + (lt ? g.d.lt : g.d.en) + '</div>' +
      '</div>';
    }).join('');
    showInfo('📖 ' + I18N[CURRENT_LANG].glossary, rows);
  });

  applyLanguage(CURRENT_LANG);

  // ── Note type bar ────────────────────────────────────────────────────────────
  var selectedType = 'quarter';
  document.querySelectorAll('.nbar-btn[data-type]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.nbar-btn[data-type]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      selectedType = btn.dataset.type;
    });
  });

  // ── Accidentals ──────────────────────────────────────────────────────────────
  // Semitone-based so all 5 accidentals (sharp/double-sharp/flat/double-flat/
  // natural) resolve to the correct pitch, including wrapping into the next
  // or previous octave (e.g. B double-sharp -> Cs one octave up).
  var selectedAccidental = null;
  var LETTER_SEMI = { 'C':0,'D':2,'E':4,'F':5,'G':7,'A':9,'B':11 };
  var SEMI_NAME   = ['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
  var ACC_OFFSET  = { sharp:1, doublesharp:2, flat:-1, doubleflat:-2, natural:0 };
  var ACC_GLYPH   = { sharp:'♯', doublesharp:'𝄪', flat:'♭', doubleflat:'𝄫', natural:'♮' };

  function getPlayNote(noteName, acc) {
    if (!acc || !noteName) { return noteName; }
    var off = ACC_OFFSET[acc] || 0;
    if (!off) { return noteName; }
    var letter = noteName.charAt(0);
    var oct = parseInt(noteName.slice(1), 10);
    var semi = LETTER_SEMI[letter] + off;
    while (semi < 0) { semi += 12; oct -= 1; }
    while (semi > 11) { semi -= 12; oct += 1; }
    return SEMI_NAME[semi] + oct;
  }

  document.querySelectorAll('[data-acc]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var acc = btn.dataset.acc;
      if (selectedAccidental === acc) {
        selectedAccidental = null;
        btn.classList.remove('active');
      } else {
        selectedAccidental = acc;
        document.querySelectorAll('[data-acc]').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
      }
    });
  });

  // ── Additional markings + lyric text: applied to the currently selected
  // note (click a note in the staff first, per the existing selection ring
  // used for delete). ──────────────────────────────────────────────────────
  document.querySelectorAll('[data-mark]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (selectedNoteIdx === null) {
        if (K && K.mascot) { K.mascot('sad', 'Pirma pažymėk natą penklinėje 🎵'); }
        return;
      }
      var mark = btn.dataset.mark;
      var n = noteList[selectedNoteIdx];
      n.mark = (n.mark === mark) ? null : mark;
      redrawAllNotes();
    });
  });

  document.getElementById('btnAddLyric').addEventListener('click', function () {
    if (selectedNoteIdx === null) {
      if (K && K.mascot) { K.mascot('sad', 'Pirma pažymėk natą penklinėje 🎵'); }
      return;
    }
    var n = noteList[selectedNoteIdx];
    var text = prompt('Tekstas po nata:', n.lyric || '');
    if (text === null) { return; }
    n.lyric = text.trim() || null;
    redrawAllNotes();
  });

  // SVG clef click: toggle clef
  var CLEF_FS  = { treble: '88', bass: '44' };
  var CLEF_Y   = { treble: '88', bass: '62' };
  var CLEF_CHR = { treble: '𝄞', bass: '𝄢' };

  function toggleClef(e) {
    e.stopPropagation();
    rowClef = rowClef === 'treble' ? 'bass' : 'treble';
    ['clefRow1', 'clefRow2'].forEach(function (id) {
      var clefEl = document.getElementById(id);
      clefEl.textContent = CLEF_CHR[rowClef];
      clefEl.setAttribute('font-size', CLEF_FS[rowClef]);
      clefEl.setAttribute('y', CLEF_Y[rowClef]);
    });
    noteList = []; redrawAllNotes();
    CURRENT_OCTAVES = rowClef === 'treble' ? [3, 4, 5] : [2, 3, 4];
    rebuildPiano();
  }
  document.getElementById('clefGroupRow1').addEventListener('click', toggleClef);
  document.getElementById('clefGroupRow2').addEventListener('click', toggleClef);

  // ── Staff ────────────────────────────────────────────────────────────────────
  var NOTE_COLOR = {
    'C': '#e53935', 'D': '#fb8c00', 'E': '#fdd835',
    'F': '#43a047', 'G': '#1e88e5', 'A': '#8e24aa', 'B': '#ec407a'
  };

  var NOTE_Y_TREBLE = {
    'C3':139, 'D3':132, 'E3':125, 'F3':118, 'G3':111, 'A3':104, 'B3': 97,
    'C4': 90, 'D4': 83,
    'E4': 76, 'F4': 69, 'G4': 62, 'A4': 55, 'B4': 48,
    'C5': 41, 'D5': 34, 'E5': 27, 'F5': 20,
    'G5': 13, 'A5':  6, 'B5': -1, 'C6': -8
  };
  var NOTE_Y_BASS = {
    'G1':125, 'A1':118, 'B1':111,
    'C2':104, 'D2': 97, 'E2': 90, 'F2': 83,
    'G2': 76, 'A2': 69, 'B2': 62,
    'C3': 55, 'D3': 48, 'E3': 41, 'F3': 34, 'G3': 27, 'A3': 20,
    'B3': 13, 'C4':  6, 'D4': -1, 'E4': -8
  };
  var ROW_NOTE_Y = [NOTE_Y_TREBLE, NOTE_Y_BASS];

  var svgNS     = 'http://www.w3.org/2000/svg';
  var placedEl1 = document.getElementById('placedNotes');
  var placedEl2 = document.getElementById('placedNotes2');
  var noteList  = [];
  var X_STEP    = 48;
  var X_MAX     = 1240;
  var rowClef   = 'treble';
  // How many notes fit on one staff row before overflowing onto row 2.
  var NOTES_PER_ROW = Math.floor((X_MAX - 120) / X_STEP) + 1;

  function getRowNoteY() {
    return rowClef === 'treble' ? NOTE_Y_TREBLE : NOTE_Y_BASS;
  }

  // Where a note at a given index in noteList lives: which row/SVG and x position.
  function notePos(idx) {
    var row = idx < NOTES_PER_ROW ? 0 : 1;
    var col = idx - row * NOTES_PER_ROW;
    return { row: row, x: 120 + col * X_STEP, el: row === 0 ? placedEl1 : placedEl2 };
  }

  var DURS = {
    'whole': 1.8, 'half': 0.9, 'half-dot': 1.35, 'quarter': 0.45, 'quarter-dot': 0.675,
    'eighth': 0.22, 'eighth-dot': 0.33, 'sixteenth': 0.11,
    'rest-whole': 1.8, 'rest-half': 0.9, 'rest-quarter': 0.45, 'rest-eighth': 0.22, 'rest-sixteenth': 0.11
  };
  // Beaming eligibility: plain (non-dotted) eighths/sixteenths only, matching
  // the exact combinations the spec calls out (two eighths, two sixteenths,
  // four sixteenths, eighth+2 sixteenths, 2 sixteenths+eighth, ...).
  var BEAMABLE = { 'eighth': 1, 'sixteenth': 2 };

  function drawNoteGlyph(noteName, type, x, yOffset, noteYTable, acc, beamInfo, lyric, mark) {
    yOffset = yOffset || 0;
    noteYTable = noteYTable || ROW_NOTE_Y[0];
    var g = document.createElementNS(svgNS, 'g');

    if (type.startsWith('rest-')) {
      var rt = type.replace('rest-', '');
      var yo = yOffset;
      if (rt === 'quarter') {
        var qt = document.createElementNS(svgNS, 'text');
        qt.setAttribute('x', x); qt.setAttribute('y', 72 + yo);
        qt.setAttribute('text-anchor', 'middle');
        qt.setAttribute('font-family', 'serif');
        qt.setAttribute('font-size', '52');
        qt.setAttribute('fill', '#444');
        qt.textContent = '𝄽';
        g.appendChild(qt);
      } else if (rt === 'eighth') {
        var et = document.createElementNS(svgNS, 'text');
        et.setAttribute('x', x); et.setAttribute('y', 68 + yo);
        et.setAttribute('text-anchor', 'middle');
        et.setAttribute('font-family', 'serif');
        et.setAttribute('font-size', '48');
        et.setAttribute('fill', '#444');
        et.textContent = '𝄾';
        g.appendChild(et);
      } else if (rt === 'sixteenth') {
        var st = document.createElementNS(svgNS, 'text');
        st.setAttribute('x', x); st.setAttribute('y', 64 + yo);
        st.setAttribute('text-anchor', 'middle');
        st.setAttribute('font-family', 'serif');
        st.setAttribute('font-size', '44');
        st.setAttribute('fill', '#444');
        st.textContent = '𝄿';
        g.appendChild(st);
      } else if (rt === 'half') {
        var r = document.createElementNS(svgNS, 'rect');
        r.setAttribute('x', x - 12); r.setAttribute('y', 41 + yo);
        r.setAttribute('width', 24); r.setAttribute('height', 7);
        r.setAttribute('fill', '#444'); r.setAttribute('rx', '0');
        g.appendChild(r);
      } else {
        var r2 = document.createElementNS(svgNS, 'rect');
        r2.setAttribute('x', x - 12); r2.setAttribute('y', 34 + yo);
        r2.setAttribute('width', 24); r2.setAttribute('height', 7);
        r2.setAttribute('fill', '#444'); r2.setAttribute('rx', '0');
        g.appendChild(r2);
      }
      return g;
    }

    var y = noteYTable[noteName];
    if (y == null) { return null; }
    y += yOffset;

    var noteColor = NOTE_COLOR[noteName.charAt(0)] || '#222';
    var baseType  = type.replace('-dot', '');
    var isDotted  = type.indexOf('-dot') >= 0;

    var STAF_TOP = 20 + yOffset, STAF_BOT = 76 + yOffset, LGAP = 14;
    if (y < STAF_TOP) {
      for (var ly = STAF_TOP - LGAP; ly >= y; ly -= LGAP) {
        var ll = document.createElementNS(svgNS, 'line');
        ll.setAttribute('x1', x - 13); ll.setAttribute('x2', x + 13);
        ll.setAttribute('y1', ly); ll.setAttribute('y2', ly);
        ll.setAttribute('stroke', '#777'); ll.setAttribute('stroke-width', '1.5');
        g.appendChild(ll);
      }
    } else if (y > STAF_BOT) {
      for (var ly = STAF_BOT + LGAP; ly <= y; ly += LGAP) {
        var ll = document.createElementNS(svgNS, 'line');
        ll.setAttribute('x1', x - 13); ll.setAttribute('x2', x + 13);
        ll.setAttribute('y1', ly); ll.setAttribute('y2', ly);
        ll.setAttribute('stroke', '#777'); ll.setAttribute('stroke-width', '1.5');
        g.appendChild(ll);
      }
    }

    var filled = (baseType !== 'whole' && baseType !== 'half');
    var el = document.createElementNS(svgNS, 'ellipse');
    el.setAttribute('cx', x); el.setAttribute('cy', y);
    el.setAttribute('rx', 10); el.setAttribute('ry', 6.5);
    el.setAttribute('fill', filled ? noteColor : 'none');
    el.setAttribute('stroke', noteColor); el.setAttribute('stroke-width', filled ? '2' : '2.5');
    el.setAttribute('transform', 'rotate(-12,' + x + ',' + y + ')');
    g.appendChild(el);

    if (acc && ACC_GLYPH[acc]) {
      var accEl = document.createElementNS(svgNS, 'text');
      accEl.setAttribute('x', x - 16);
      accEl.setAttribute('y', y + 5);
      accEl.setAttribute('text-anchor', 'middle');
      accEl.setAttribute('font-family', 'serif');
      accEl.setAttribute('font-size', acc === 'doublesharp' || acc === 'doubleflat' ? '14' : '16');
      accEl.setAttribute('fill', noteColor);
      accEl.textContent = ACC_GLYPH[acc];
      g.appendChild(accEl);
    }

    // Augmentation dot, to the right of the notehead.
    if (isDotted) {
      var dot = document.createElementNS(svgNS, 'circle');
      dot.setAttribute('cx', x + 15); dot.setAttribute('cy', y - 4);
      dot.setAttribute('r', '2.3'); dot.setAttribute('fill', noteColor);
      g.appendChild(dot);
    }

    // A slur/legato/crescendo/diminuendo mark attached to this note (spec's
    // "papildomi ženklai") is drawn just under the staff.
    if (mark) {
      var my = 84 + yOffset;
      if (mark === 'slur') {
        var sp = document.createElementNS(svgNS, 'path');
        sp.setAttribute('d', 'M' + (x - 12) + ',' + my + ' Q' + x + ',' + (my + 9) + ' ' + (x + 12) + ',' + my);
        sp.setAttribute('fill', 'none'); sp.setAttribute('stroke', '#555'); sp.setAttribute('stroke-width', '2');
        sp.setAttribute('stroke-linecap', 'round');
        g.appendChild(sp);
      } else {
        var hp = document.createElementNS(svgNS, 'path');
        var d = mark === 'cresc'
          ? 'M' + (x - 13) + ',' + (my + 4) + ' L' + (x + 13) + ',' + my + ' M' + (x - 13) + ',' + (my + 4) + ' L' + (x + 13) + ',' + (my + 8)
          : 'M' + (x - 13) + ',' + my + ' L' + (x + 13) + ',' + (my + 4) + ' M' + (x - 13) + ',' + (my + 8) + ' L' + (x + 13) + ',' + (my + 4);
        hp.setAttribute('d', d);
        hp.setAttribute('fill', 'none'); hp.setAttribute('stroke', '#555'); hp.setAttribute('stroke-width', '2');
        hp.setAttribute('stroke-linecap', 'round');
        g.appendChild(hp);
      }
    }

    // A lyric/text syllable under this note (spec: "po penkline pridėti
    // tekstą kiekvienai pasirinktai natai") - pushed a bit further down when
    // a mark is already occupying the space just under the staff.
    if (lyric) {
      var lt = document.createElementNS(svgNS, 'text');
      lt.setAttribute('x', x); lt.setAttribute('y', (mark ? 104 : 96) + yOffset);
      lt.setAttribute('text-anchor', 'middle');
      lt.setAttribute('font-family', 'var(--font)');
      lt.setAttribute('font-size', '12');
      lt.setAttribute('font-weight', '600');
      lt.setAttribute('fill', '#444');
      lt.textContent = lyric;
      g.appendChild(lt);
    }

    if (baseType === 'whole') { return g; }

    var stemUp = beamInfo ? beamInfo.stemUp : (y >= 48 + yOffset);
    var sx  = stemUp ? x + 9  : x - 9;
    var sy1 = y + (stemUp ? -3 : 3);
    var sy2 = beamInfo ? beamInfo.beamY : (stemUp ? y - 32 : y + 32);

    var stem = document.createElementNS(svgNS, 'line');
    stem.setAttribute('x1', sx); stem.setAttribute('x2', sx);
    stem.setAttribute('y1', sy1); stem.setAttribute('y2', sy2);
    stem.setAttribute('stroke', noteColor); stem.setAttribute('stroke-width', '2.2');
    g.appendChild(stem);

    function addFlag(fy) {
      var d = stemUp ? 1 : -1;
      var fp = document.createElementNS(svgNS, 'path');
      fp.setAttribute('d',
        'M' + sx + ',' + fy +
        ' C' + (sx + 14*d) + ',' + (fy + 6*d) +
        ' '  + (sx + 16*d) + ',' + (fy + 14*d) +
        ' '  + (sx + 6*d)  + ',' + (fy + 22*d));
      fp.setAttribute('fill', 'none');
      fp.setAttribute('stroke', noteColor); fp.setAttribute('stroke-width', '2.2');
      fp.setAttribute('stroke-linecap', 'round');
      g.appendChild(fp);
    }

    // Beamed notes share a straight beam bar (drawn separately by
    // drawBeams) instead of their own curly flag.
    if (!beamInfo) {
      if (baseType === 'eighth')    { addFlag(sy2); }
      if (baseType === 'sixteenth') { addFlag(sy2); addFlag(stemUp ? sy2 + 9 : sy2 - 9); }
    }

    return g;
  }

  // ── Beaming: adjacent eighth/eighth-dot/sixteenth notes on the same row,
  // with neither a rest nor a lyric in between, get straight connecting
  // beam bars instead of individual flags — exactly the combinations named
  // in the spec (two eighths, two/four sixteenths, eighth + 2 sixteenths, a
  // dotted-eighth + sixteenth pair, ...). A note carrying its own lyric
  // syllable breaks the group, per spec. ─────────────────────────────────────
  function beamLevel(n) {
    if (!n || !n.note || n.lyric) { return 0; }
    if (n.type === 'eighth' || n.type === 'eighth-dot') { return 1; }
    if (n.type === 'sixteenth') { return 2; }
    return 0;
  }

  function computeBeamGroups() {
    var groups = {};
    var noteY = getRowNoteY();
    var i = 0;
    while (i < noteList.length) {
      if (!beamLevel(noteList[i])) { i++; continue; }
      var row = notePos(i).row;
      var run = [i];
      var j = i + 1;
      while (j < noteList.length && beamLevel(noteList[j]) && notePos(j).row === row) { run.push(j); j++; }
      if (run.length >= 2) {
        var firstY = noteY[noteList[run[0]].note];
        var stemUp = firstY >= 48;
        var extreme = null;
        run.forEach(function (idx) {
          var yy = noteY[noteList[idx].note];
          var sy2 = stemUp ? yy - 32 : yy + 32;
          if (extreme === null || (stemUp ? sy2 < extreme : sy2 > extreme)) { extreme = sy2; }
        });
        run.forEach(function (idx) { groups[idx] = { members: run, stemUp: stemUp, beamY: extreme }; });
      }
      i = j;
    }
    return groups;
  }

  function drawBeams(groups) {
    var done = {};
    Object.keys(groups).forEach(function (key) {
      var info = groups[key];
      var gid = info.members[0];
      if (done[gid]) { return; }
      done[gid] = true;
      var el = notePos(gid).el;
      function beamRect(bx0, bx1, y, thick) {
        var r = document.createElementNS(svgNS, 'rect');
        var left = Math.min(bx0, bx1), w = Math.max(2, Math.abs(bx1 - bx0));
        r.setAttribute('x', left); r.setAttribute('width', w);
        r.setAttribute('y', info.stemUp ? y : y - thick);
        r.setAttribute('height', thick);
        r.setAttribute('fill', '#333');
        el.appendChild(r);
      }
      var x0 = notePos(info.members[0]).x, x1 = notePos(info.members[info.members.length - 1]).x;
      var sx0 = info.stemUp ? x0 + 9 : x0 - 9, sx1 = info.stemUp ? x1 + 9 : x1 - 9;
      beamRect(sx0, sx1, info.beamY, 3.2);

      var off = info.stemUp ? -9 : 9;
      var k = 0;
      while (k < info.members.length) {
        if (beamLevel(noteList[info.members[k]]) === 2) {
          var startK = k;
          while (k + 1 < info.members.length && beamLevel(noteList[info.members[k + 1]]) === 2) { k++; }
          var endK = k;
          var xa = info.stemUp ? notePos(info.members[startK]).x + 9 : notePos(info.members[startK]).x - 9;
          if (endK > startK) {
            var xb = info.stemUp ? notePos(info.members[endK]).x + 9 : notePos(info.members[endK]).x - 9;
            beamRect(xa, xb, info.beamY + off, 3.2);
          } else {
            var toward = startK < info.members.length - 1 ? 1 : -1;
            beamRect(xa, xa + toward * 11, info.beamY + off, 3.2);
          }
        }
        k++;
      }
    });
  }

  function addNote(noteName) {
    if (noteList.length >= NOTES_PER_ROW * 2) {
      if (K && K.mascot) { K.mascot('sad', 'Daugiau natų netelpa! 🎵'); }
      return;
    }
    var isRest = selectedType.startsWith('rest-');
    var noteY = getRowNoteY();
    if (!isRest && noteY[noteName] == null) { return; }
    var acc = isRest ? null : selectedAccidental;
    noteList.push({ note: isRest ? null : noteName, type: selectedType, acc: acc });
    // Redraw everything rather than just this one note: adding a note can
    // change whether it - or its new neighbour - joins a beam group.
    redrawAllNotes();
  }

  // ── Note selection & single-note deletion ────────────────────────────────────
  var selectedNoteIdx = null;

  function clearNoteSelection() {
    selectedNoteIdx = null;
    document.querySelectorAll('.note-sel').forEach(function (r) { r.remove(); });
  }

  function attachNoteClick(el, idx, x, yCtr) {
    var hit = document.createElementNS(svgNS, 'rect');
    hit.setAttribute('x', x - 18); hit.setAttribute('y', yCtr - 36);
    hit.setAttribute('width', 36);  hit.setAttribute('height', 72);
    hit.setAttribute('fill', 'transparent');
    el.appendChild(hit);
    el.style.cursor = 'pointer';
    el.addEventListener('click', function (e) {
      e.stopPropagation();
      if (selectedNoteIdx === idx) { clearNoteSelection(); return; }
      clearNoteSelection();
      selectedNoteIdx = idx;
      var ring = document.createElementNS(svgNS, 'rect');
      ring.setAttribute('x', x - 18); ring.setAttribute('y', yCtr - 36);
      ring.setAttribute('width', 36);  ring.setAttribute('height', 72);
      ring.setAttribute('rx', '8');
      ring.setAttribute('fill', 'rgba(255,140,0,0.22)');
      ring.setAttribute('stroke', '#f4a027');
      ring.setAttribute('stroke-width', '2.5');
      ring.setAttribute('class', 'note-sel');
      ring.setAttribute('pointer-events', 'none');
      el.insertBefore(ring, el.firstChild);
    });
  }

  function redrawAllNotes() {
    placedEl1.innerHTML = '';
    placedEl2.innerHTML = '';
    selectedNoteIdx = null;
    var noteY = getRowNoteY();
    var beamGroups = computeBeamGroups();
    noteList.forEach(function (n, i) {
      var pos = notePos(i);
      var yCtr = n.note ? noteY[n.note] : 48;
      var el = drawNoteGlyph(n.note || 'C4', n.type, pos.x, 0, noteY, n.acc, beamGroups[i], n.lyric, n.mark);
      if (el) { el.classList.add('note-pop'); attachNoteClick(el, i, pos.x, yCtr); pos.el.appendChild(el); }
    });
    drawBeams(beamGroups);
  }

  function deleteSelectedNote() {
    if (selectedNoteIdx === null) { return; }
    noteList.splice(selectedNoteIdx, 1);
    redrawAllNotes();
  }

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedNoteIdx !== null) {
      e.preventDefault(); deleteSelectedNote();
    }
  });

  document.getElementById('staffSvg').addEventListener('click', function () { clearNoteSelection(); });
  document.getElementById('staffSvg2').addEventListener('click', function () { clearNoteSelection(); });

  function clearCanvas() {
    noteList = []; placedEl1.innerHTML = ''; placedEl2.innerHTML = '';
    selectedNoteIdx = null;
  }
  document.getElementById('btnClear').addEventListener('click', clearCanvas);
  document.getElementById('btnNew').addEventListener('click', function () {
    if (noteList.length && !confirm('Pradėti naują pamoką? Neišsaugoti pakeitimai bus prarasti.')) { return; }
    clearCanvas();
  });

  // ── Pamokų išsaugojimas ir biblioteka (localStorage) ────────────────────────
  document.getElementById('btnSaveLesson').addEventListener('click', function () {
    if (!noteList.length) { alert('Prieš išsaugant įrašykite bent vieną natą.'); return; }
    var title = prompt('Pamokos pavadinimas:', 'Pamoka ' + new Date().toLocaleDateString('lt-LT'));
    if (!title) { return; }
    LessonLibrary.save(title, { notes: noteList, sound: SOUND_TYPE, tempo: TEMPO_SCALE });
    alert('Pamoka „' + title + '“ išsaugota.');
  });

  var libOverlay = document.getElementById('libOverlay');
  var libSearch  = document.getElementById('libSearch');
  var libList    = document.getElementById('libList');

  function fmtDate(ts) {
    return new Date(ts).toLocaleDateString('lt-LT') + ' ' + new Date(ts).toLocaleTimeString('lt-LT', { hour: '2-digit', minute: '2-digit' });
  }

  function renderLibrary(query) {
    var records = LessonLibrary.search(query);
    libList.innerHTML = '';
    if (!records.length) {
      var empty = document.createElement('div');
      empty.className = 'lib-empty';
      empty.textContent = query ? 'Nieko nerasta.' : 'Kol kas nėra išsaugotų pamokų.';
      libList.appendChild(empty);
      return;
    }
    records.forEach(function (rec) {
      var row = document.createElement('div');
      row.className = 'lib-row';
      row.innerHTML =
        '<div class="lib-row-info">' +
          '<div class="lib-row-title"></div>' +
          '<div class="lib-row-date"></div>' +
        '</div>' +
        '<button class="lib-row-btn lib-row-open">Atidaryti</button>' +
        '<button class="lib-row-btn lib-row-del">🗑</button>';
      row.querySelector('.lib-row-title').textContent = rec.title;
      row.querySelector('.lib-row-date').textContent = fmtDate(rec.updatedAt);
      row.querySelector('.lib-row-open').addEventListener('click', function () {
        var state = LessonLibrary.load(rec.id);
        if (!state) { return; }
        noteList = state.notes || [];
        redrawAllNotes();
        if (state.sound) {
          SOUND_TYPE = state.sound;
          document.querySelectorAll('[data-sound]').forEach(function (b) {
            b.classList.toggle('sel', b.dataset.sound === state.sound);
          });
        }
        if (state.tempo) {
          TEMPO_SCALE = state.tempo;
          tempoSlider.value = state.tempo;
          updateTempoLabel();
        }
        libOverlay.hidden = true;
      });
      row.querySelector('.lib-row-del').addEventListener('click', function () {
        if (!confirm('Ištrinti pamoką „' + rec.title + '“?')) { return; }
        LessonLibrary.remove(rec.id);
        renderLibrary(libSearch.value);
      });
      libList.appendChild(row);
    });
  }

  document.getElementById('btnOpenLibrary').addEventListener('click', function () {
    libSearch.value = '';
    renderLibrary('');
    libOverlay.hidden = false;
  });
  document.getElementById('libClose').addEventListener('click', function () { libOverlay.hidden = true; });
  libOverlay.addEventListener('click', function (e) { if (e.target === libOverlay) { libOverlay.hidden = true; } });
  libSearch.addEventListener('input', function () { renderLibrary(libSearch.value); });

  document.getElementById('btnDeleteNote').addEventListener('click', deleteSelectedNote);

  // ── Zoom the staff in/out (spec: "priartinti penklinę ar atitolinti") ──────
  var staffZoom = 1;
  function applyStaffZoom() {
    document.querySelectorAll('.staff-panel').forEach(function (p) {
      p.style.transform = 'scale(' + staffZoom + ')';
      p.style.transformOrigin = 'top center';
    });
  }
  document.getElementById('btnZoomIn').addEventListener('click', function () {
    staffZoom = Math.min(1.6, +(staffZoom + 0.1).toFixed(2));
    applyStaffZoom();
  });
  document.getElementById('btnZoomOut').addEventListener('click', function () {
    staffZoom = Math.max(0.6, +(staffZoom - 0.1).toFixed(2));
    applyStaffZoom();
  });

  var playbackId = 0;

  // ── Stop: invalidate the current playback so every still-pending
  // scheduled note/play-head callback (guarded by `playbackId === pid`)
  // becomes a no-op, and hide the play-heads immediately. ────────────────────
  document.getElementById('btnStop').addEventListener('click', function () {
    playbackId++;
    var ph1 = document.getElementById('playHead'), ph2 = document.getElementById('playHead2');
    if (ph1) { ph1.style.display = 'none'; }
    if (ph2) { ph2.style.display = 'none'; }
  });

  document.getElementById('btnPlay').addEventListener('click', function () {
    if (!noteList.length) { return; }
    playbackId++;
    var pid = playbackId;
    var playHeads = [
      { g: document.getElementById('playHead'),  rect: document.getElementById('playHeadRect') },
      { g: document.getElementById('playHead2'), rect: document.getElementById('playHeadRect2') }
    ];
    playHeads.forEach(function (p) { p.g.style.display = 'none'; });

    var t = 0;
    var noteY = getRowNoteY();
    noteList.forEach(function (n, i) {
      var pos = notePos(i);
      var dur = (DURS[n.type] || 0.45) / TEMPO_SCALE;

      if (n.note) {
        (function (note, delay, d) {
          setTimeout(function () { if (playbackId === pid) playNote(note, d * 1.6); }, delay * 1000);
        })(getPlayNote(n.note, n.acc), t, dur);
      }

      (function (px2, pyCtr, delay, row) {
        setTimeout(function () {
          if (playbackId !== pid) { return; }
          var active = playHeads[row], other = playHeads[row === 0 ? 1 : 0];
          other.g.style.display = 'none';
          active.rect.setAttribute('x', px2 - 18);
          active.rect.setAttribute('y', pyCtr - 36);
          active.g.style.display = 'block';
        }, delay * 1000);
      })(pos.x, n.note ? noteY[n.note] : 48, t, pos.row);

      t += dur + 0.04;
    });

    setTimeout(function () { if (playbackId === pid) { playHeads.forEach(function (p) { p.g.style.display = 'none'; }); } }, t * 1000);
  });

  // ── Piano keyboard ───────────────────────────────────────────────────────────
  var SOLF_NAMES   = { 'C':'C','D':'D','E':'E','F':'F','G':'G','A':'A','B':'H' };
  var WHITE_NOTES  = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  var BLACK_AFTER  = [true, true, false, true, true, true, false];
  var BLACK_PREFIX = ['Cs', 'Ds', null, 'Fs', 'Gs', 'As', null];
  var pianoEl = document.getElementById('piano');

  function makePianoKey(noteName, gIdx, isBlack, kw, bkw) {
    var div = document.createElement('div');
    div.className = isBlack ? 'bk' : 'wk';
    div.style.width = (isBlack ? bkw : kw) + 'px';
    if (isBlack) {
      div.style.left = (gIdx * kw + kw - bkw / 2) + 'px';
    } else {
      var letter = noteName.charAt(0);
      var label = SOLF_NAMES[letter] + (letter === 'C' ? noteName.slice(1) : '');
      var span = document.createElement('span');
      span.textContent = label;
      span.style.color = NOTE_COLOR[letter] || '#888';
      span.style.fontWeight = 'bold';
      span.style.fontSize = Math.max(9, Math.min(14, Math.floor(kw * 0.18))) + 'px';
      div.appendChild(span);
    }
    div.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      div.classList.add('lit');
      var dur = (DURS[selectedType] || 0.45) * 1.6;
      playNote(noteName, dur);
      if (!isBlack) { addNote(noteName); }
      setTimeout(function () { div.classList.remove('lit'); }, 300);
    });
    return div;
  }

  function rebuildPiano() {
    var octaves    = CURRENT_OCTAVES;
    var totalWhite = octaves.length * 7 + 1;
    // A bit thinner than a full window-width fill - same octave range, narrower keys.
    var kw  = Math.max(14, Math.floor((window.innerWidth / totalWhite) * 0.8));
    var bkw = Math.round(kw * 0.6);

    pianoEl.innerHTML = '';
    pianoEl.style.width = (totalWhite * kw) + 'px';

    var whites = [], blacks = [];
    octaves.forEach(function (oct, oIdx) {
      WHITE_NOTES.forEach(function (n, wIdx) {
        var gIdx = oIdx * 7 + wIdx;
        whites.push(makePianoKey(n + oct, gIdx, false, kw, bkw));
        if (BLACK_AFTER[wIdx] && BLACK_PREFIX[wIdx]) {
          blacks.push(makePianoKey(BLACK_PREFIX[wIdx] + oct, gIdx, true, kw, bkw));
        }
      });
    });
    var lastGIdx = octaves.length * 7;
    whites.push(makePianoKey('C' + (octaves[octaves.length - 1] + 1), lastGIdx, false, kw, bkw));
    whites.forEach(function (w) { pianoEl.appendChild(w); });
    blacks.forEach(function (b) { pianoEl.appendChild(b); });
  }

  rebuildPiano();
  window.addEventListener('resize', rebuildPiano);

  // The games sidebar now has much bigger cards - cap its height so it never
  // grows down behind the fixed piano keyboard and becomes unclickable there.
  function fitRightCol() {
    var col = document.querySelector('.right-col');
    var pianoWrap = document.querySelector('.piano-wrap');
    if (!col || !pianoWrap) { return; }
    var colTop = col.getBoundingClientRect().top;
    var pianoTop = pianoWrap.getBoundingClientRect().top;
    var avail = pianoTop - colTop - 12;
    col.style.maxHeight = Math.max(200, avail) + 'px';
  }
  fitRightCol();
  window.addEventListener('resize', fitRightCol);
  // Re-measure once the 'Inter' webfont finishes swapping in (it loads async
  // and can reflow text height after our first measurement) and once more
  // after full page load, so the cap always matches the real layout.
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitRightCol); }
  window.addEventListener('load', fitRightCol);

  // Collapsible sidebar cards (Žaidimai / Mokymasis / Pamokos) - the smooth
  // open/close "unfold" itself is pure CSS (grid-template-rows 0fr -> 1fr in
  // the stylesheet above), this just flips the .open class per card.
  document.querySelectorAll('[data-nav-toggle]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var card = btn.closest('.nav-card');
      if (card) { card.classList.toggle('open'); fitRightCol(); }
    });
  });

  setTimeout(function () {
    if (K && K.mascot) { K.mascot('happy', 'Spausk klavišus ir rašyk natas! 🎵'); }
  }, 600);

})();
</script>
